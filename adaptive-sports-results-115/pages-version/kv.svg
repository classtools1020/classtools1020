<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="主視覺：藍天白雲、金色獎盃與紅色緞帶">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc6f2"/>
      <stop offset="0.55" stop-color="#c9e5fa"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#f4b323"/>
      <stop offset="1" stop-color="#d98a0c"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a51a"/>
      <stop offset="1" stop-color="#b56f06"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8483f"/>
      <stop offset="1" stop-color="#c8262a"/>
    </linearGradient>
    <linearGradient id="redDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8222a"/>
      <stop offset="1" stop-color="#8f151c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc96a"/>
      <stop offset="1" stop-color="#3f9a4a"/>
    </linearGradient>
    <linearGradient id="blueRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f7fd9"/>
      <stop offset="1" stop-color="#1f5fbf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffe9a3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1f3a" flood-opacity="0.18"/></filter>
    <symbol id="star4" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0 Z"/></symbol>
    <symbol id="cloud" viewBox="0 0 200 90">
      <path d="M40 80 C15 80 8 60 22 50 C10 30 40 20 52 32 C58 8 98 6 108 28 C122 14 156 22 152 46 C176 44 186 70 166 80 Z"/>
    </symbol>
  </defs>

  <rect width="1600" height="560" fill="url(#sky)"/>
  <circle cx="1120" cy="250" r="260" fill="url(#glow)"/>

  <g fill="#ffffff" opacity="0.95">
    <use href="#cloud" x="-60" y="60" width="420" height="190"/>
    <use href="#cloud" x="260" y="-30" width="300" height="135"/>
    <use href="#cloud" x="1240" y="20" width="420" height="190"/>
    <use href="#cloud" x="1000" y="-40" width="260" height="117"/>
    <use href="#cloud" x="-40" y="330" width="360" height="160" opacity="0.85"/>
    <use href="#cloud" x="1330" y="300" width="380" height="170" opacity="0.9"/>
  </g>
  <g fill="#ffffff" opacity="0.5" filter="url(#soft)">
    <use href="#cloud" x="620" y="40" width="240" height="108"/>
  </g>

  <g fill="#ffffff">
    <use href="#star4" x="520" y="90" width="34" height="34"/>
    <use href="#star4" x="900" y="60" width="22" height="22"/>
    <use href="#star4" x="1330" y="150" width="28" height="28"/>
    <use href="#star4" x="1460" y="240" width="18" height="18"/>
    <use href="#star4" x="700" y="150" width="16" height="16"/>
  </g>
  <g fill="#ffd54a">
