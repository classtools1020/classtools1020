    <use href="#star4" x="960" y="130" width="24" height="24"/>
    <use href="#star4" x="1400" y="330" width="26" height="26"/>
  </g>

  <path d="M-40 470 C300 380 700 520 1000 430 C1250 355 1450 380 1640 330 L1640 470 C1450 520 1250 500 1000 540 C700 600 300 500 -40 560 Z" fill="url(#red)" opacity="0.95"/>
  <path d="M-40 500 C300 420 700 560 1000 470 C1250 395 1450 420 1640 370 L1640 420 C1450 470 1250 445 1000 520 C700 610 300 470 -40 545 Z" fill="url(#redDark)" opacity="0.55"/>
  <path d="M-40 560 L1640 560 L1640 470 C1450 520 1250 500 1000 540 C700 600 300 500 -40 560 Z" fill="#f3f7fb"/>
  <path d="M-40 505 C300 430 700 560 1000 480 C1250 410 1450 430 1640 385" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7" stroke-dasharray="26 18"/>

  <g fill="url(#green)" opacity="0.95">
    <path d="M60 440 C40 380 90 330 150 330 C160 390 120 440 60 440 Z"/>
    <path d="M160 455 C130 400 180 350 240 360 C240 420 210 460 160 455 Z" opacity="0.85"/>
    <path d="M1540 445 C1560 385 1510 335 1450 335 C1440 395 1480 445 1540 445 Z"/>
    <path d="M1440 465 C1470 410 1420 360 1360 370 C1360 430 1390 470 1440 465 Z" opacity="0.85"/>
  </g>
  <g stroke="#2f7a3a" stroke-width="2" fill="none" opacity="0.5">
    <path d="M62 438 C90 400 110 370 148 334"/><path d="M1538 443 C1510 405 1490 375 1452 339"/>
  </g>

  <g transform="translate(1110 120)" filter="url(#shadow)">
    <path d="M-40 250 L-10 330 L30 330 L0 250 Z" fill="url(#blueRibbon)"/>
    <path d="M40 250 L10 330 L-30 330 L0 250 Z" fill="#e8483f"/>
    <rect x="-70" y="270" width="140" height="26" rx="6" fill="url(#goldDark)"/>
    <rect x="-56" y="238" width="112" height="36" rx="6" fill="url(#gold)"/>
    <rect x="-24" y="188" width="48" height="52" rx="8" fill="url(#goldDark)"/>
    <path d="M-92 0 L92 0 C92 90 62 160 0 176 C-62 160 -92 90 -92 0 Z" fill="url(#gold)"/>
    <path d="M-92 0 L92 0 L92 18 L-92 18 Z" fill="#ffe89a" opacity="0.7"/>
    <path d="M-40 30 C-52 80 -40 130 -8 160 C-54 140 -74 90 -66 30 Z" fill="#fff5c9" opacity="0.55"/>
    <path d="M-92 24 C-150 24 -160 110 -96 120 L-90 96 C-128 90 -124 46 -92 46 Z" fill="url(#goldDark)"/>
    <path d="M92 24 C150 24 160 110 96 120 L90 96 C128 90 124 46 92 46 Z" fill="url(#goldDark)"/>
    <circle cx="0" cy="88" r="34" fill="#e8483f"/>
    <circle cx="0" cy="88" r="27" fill="#fff5d6"/>
    <path d="M0 68 L6 82 L21 83 L9 93 L13 108 L0 100 L-13 108 L-9 93 L-21 83 L-6 82 Z" fill="#f4b323"/>
  </g>

  <g fill="#ffffff">
    <use href="#star4" x="990" y="110" width="26" height="26"/>
    <use href="#star4" x="1236" y="200" width="20" height="20"/>
  </g>

  <g opacity="0.9">
    <g transform="translate(330 300)">
      <ellipse cx="0" cy="0" rx="22" ry="28" fill="#ffb347"/><ellipse cx="30" cy="-30" rx="22" ry="28" fill="#ff6b6b"/><ellipse cx="-28" cy="-36" rx="22" ry="28" fill="#4fc3f7"/><ellipse cx="4" cy="-62" rx="22" ry="28" fill="#81c784"/>
      <path d="M0 28 L4 70 M30 -2 L4 70 M-28 -8 L4 70 M4 -34 L4 70" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7"/>
    </g>
    <g transform="translate(1450 470) scale(0.9)">
      <ellipse cx="0" cy="0" rx="22" ry="28" fill="#4fc3f7"/><ellipse cx="30" cy="-30" rx="22" ry="28" fill="#ffd54a"/><ellipse cx="-28" cy="-36" rx="22" ry="28" fill="#ff6b6b"/>
    </g>
