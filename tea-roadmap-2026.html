<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --law:#1e3a8a;
  --law-soft:#dbeafe;
  --work:#ea580c;
  --work-soft:#ffe4cc;
  --ai:#7c3aed;
  --ai-soft:#ede9fe;
  --rest:#6b7280;
  --rest-soft:#f0eee9;
  --ink:#1f2937;
  --soft:#6b7280;
  --bg:#fdfaf5;
  --card:#ffffff;
  --line:#efe9e0;
  --warm:#ff8a65;
}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans TC',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased}
.container{max-width:1100px;margin:0 auto;padding:0 20px}

/* ===== 頂部導覽 ===== */
.topnav{position:sticky;top:0;z-index:100;background:rgba(253,250,245,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.05);padding:10px 16px}
.topnav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-brand{font-weight:900;color:var(--ink);text-decoration:none;font-size:.95em}
.nav-spacer{flex:1}
.nav-ext{font-size:.85em;color:#94a3b8;text-decoration:none}
.nav-ext:hover{color:var(--ink)}

/* ===== Hero ===== */
.hero{padding:50px 24px 36px;text-align:center;background:linear-gradient(180deg,#fff5e6 0%,#ffe9d4 40%,var(--bg) 100%);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,138,101,.2),transparent 70%);border-radius:50%}
.hero::after{content:'';position:absolute;bottom:-50px;right:-50px;width:220px;height:220px;background:radial-gradient(circle,rgba(124,58,237,.14),transparent 70%);border-radius:50%}
.hero-inner{position:relative;z-index:1}
.hero .tag{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#7a4500;padding:6px 16px;border-radius:30px;font-size:.84em;font-weight:700;margin-bottom:18px;border:1.5px solid #ffd5ab;box-shadow:0 4px 14px rgba(255,138,101,.12)}
.hero h1{font-size:2em;font-weight:900;color:var(--ink);letter-spacing:-1px;margin-bottom:10px;line-height:1.3}
.hero h1 .em{color:var(--warm)}
.hero .lead{font-size:1em;color:var(--soft);max-width:560px;margin:0 auto 22px;line-height:1.85}

/* 進度條 */
.progress-block{max-width:560px;margin:0 auto;background:#fff;border-radius:18px;padding:18px 22px;box-shadow:0 4px 14px rgba(0,0,0,.05);border:1px solid var(--line)}
.progress-stats{display:flex;align-items:baseline;gap:10px;justify-content:center;margin-bottom:10px}
.progress-stats .done{font-size:2em;font-weight:900;color:var(--warm);letter-spacing:-1px}
.progress-stats .slash{font-size:1.4em;color:var(--soft);font-weight:600}
.progress-stats .total{font-size:1.3em;color:var(--soft);font-weight:700}
.progress-stats .label{font-size:.88em;color:var(--soft);margin-left:6px;font-weight:600}
.progress-bar-wrap{background:#f0eee9;height:10px;border-radius:5px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--warm),#ff5722);width:0%;transition:width .4s;border-radius:5px}
.progress-meta{display:flex;justify-content:space-between;font-size:.82em;color:var(--soft);margin-top:8px;font-weight:600}

/* ===== 篩選列 ===== */
.toolbar{padding:24px 0 12px}
.tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{padding:8px 16px;background:#fff;color:var(--soft);font-size:.92em;font-weight:700;border-radius:24px;cursor:pointer;transition:all .15s;border:1.5px solid var(--line);font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.tab .count{background:#f0eee9;color:var(--soft);padding:1px 7px;border-radius:8px;font-size:.78em;font-weight:800;margin-left:2px}
.tab:hover{border-color:var(--ink);color:var(--ink)}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.active .count{background:rgba(255,255,255,.25);color:#fff}
.tab[data-cat="law"].active{background:var(--law);border-color:var(--law)}
.tab[data-cat="work"].active{background:var(--work);border-color:var(--work)}
.tab[data-cat="ai"].active{background:var(--ai);border-color:var(--ai)}
.tab[data-cat="rest"].active{background:var(--rest);border-color:var(--rest)}

.jump-today{text-align:center;margin-top:8px}
.jump-today button{background:var(--warm);color:#fff;border:none;padding:8px 18px;border-radius:20px;font-weight:800;font-size:.88em;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(255,138,101,.3);transition:transform .15s}
.jump-today button:hover{transform:scale(1.05)}

/* ===== Week Section ===== */
.week{padding:18px 0 6px}
.week-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding:0 4px}
.week-num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--ink);color:#fff;border-radius:8px;font-size:.82em;font-weight:900}
.week-title{font-size:1.05em;font-weight:900;color:var(--ink)}
.week-range{font-size:.88em;color:var(--soft);font-weight:600}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media(max-width:900px){.week-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:640px){.week-grid{grid-template-columns:repeat(2,1fr)}}

/* ===== Day Card ===== */
.day-card{background:var(--card);border-radius:14px;padding:14px 12px;box-shadow:0 2px 8px rgba(0,0,0,.04);border:1px solid var(--line);transition:all .2s;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px;min-height:148px}
.day-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.day-card.hidden{display:none}

.day-card.law{border-top:3px solid var(--law)}
.day-card.work{border-top:3px solid var(--work)}
.day-card.ai{border-top:3px solid var(--ai)}
.day-card.rest{border-top:3px solid var(--rest);opacity:.85}

.day-card.today{box-shadow:0 0 0 3px var(--warm),0 8px 20px rgba(255,138,101,.25);transform:translateY(-2px)}
.day-card.done{background:#f8f5ee}
.day-card.done .day-title{text-decoration:line-through;opacity:.6}

.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.day-date{font-size:.82em;font-weight:800;color:var(--ink);letter-spacing:.3px}
.day-date .dw{color:var(--soft);font-weight:600;margin-left:4px}
.day-badge{font-size:.62em;padding:2px 7px;border-radius:6px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.day-badge.law{background:var(--law-soft);color:var(--law)}
.day-badge.work{background:var(--work-soft);color:#9a3412}
.day-badge.ai{background:var(--ai-soft);color:var(--ai)}
.day-badge.rest{background:var(--rest-soft);color:var(--rest)}

.day-num{font-size:.68em;color:var(--soft);font-weight:700;margin-top:2px}
.day-title{font-size:.88em;font-weight:700;line-height:1.4;color:var(--ink);flex:1;margin-top:2px}
.day-mins{font-size:.72em;color:var(--soft);margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.day-check{display:inline-flex;align-items:center;gap:4px}
.day-check input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:var(--warm)}
.day-check label{font-size:.78em;color:var(--soft);font-weight:700;cursor:pointer}

.today-banner{position:absolute;top:-10px;right:8px;background:var(--warm);color:#fff;padding:2px 10px;border-radius:10px;font-size:.66em;font-weight:900;letter-spacing:.5px;box-shadow:0 4px 10px rgba(255,138,101,.4)}

/* ===== 圖例 ===== */
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px 0 8px;padding:14px 16px;background:#fff;border-radius:14px;border:1px solid var(--line);max-width:760px;margin-left:auto;margin-right:auto}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.84em;color:var(--ink);font-weight:600}
.legend-dot{width:12px;height:12px;border-radius:3px}
.legend-dot.law{background:var(--law)}
.legend-dot.work{background:var(--work)}
.legend-dot.ai{background:var(--ai)}
.legend-dot.rest{background:var(--rest)}

footer{padding:40px 24px 60px;text-align:center;color:var(--soft);font-size:.86em;line-height:2;border-top:1px solid var(--line);background:#fff;margin-top:40px}
footer a{color:var(--warm);text-decoration:none;font-weight:700}

/* Reset button */
.reset{display:inline-block;margin-top:14px;font-size:.78em;color:var(--soft);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit}
.reset:hover{color:var(--warm)}

</head>

  { d:'7/30', w:'四', cat:'law',  n:28, t:'特教法規綜合整理與快速查詢卡', m:20 },
  { d:'7/31', w:'五', cat:'work', n:19, t:'危機處理（情緒／行為／通報）', m:15 },
  { d:'8/1',  w:'六', cat:'ai',   n:10, t:'AI 倫理 + 整合自己的 AI 工作流（畢業日）', m:25 }
];

const CAT_LABEL = { law:'📘 法規', work:'🛠 實務', ai:'🤖 AI', rest:'☕ 休/複習' };
const TODAY = '5/28';
let activeCat = 'all';
let doneSet = JSON.parse(localStorage.getItem('te_done') || '[]');

function key(it){ return it.d + '|' + it.n + '|' + it.cat; }
function isDone(it){ return doneSet.includes(key(it)); }
function toggleDone(it){
  const k = key(it);
  if(doneSet.includes(k)) doneSet = doneSet.filter(x=>x!==k);
  else doneSet.push(k);
  localStorage.setItem('te_done', JSON.stringify(doneSet));
  render();
}
function resetProgress(){
  if(confirm('確定要清空所有勾選進度嗎？')){
    doneSet = []; localStorage.removeItem('te_done'); render();
  }
}

function groupByWeek(){
  const weeks = [];
  let cur = null, idx = 0;
  ROADMAP.forEach(it => {
    if(it.w === '一' || (cur === null)){
      if(cur) weeks.push(cur);
      idx++;
      cur = { num: idx, items: [], range: '' };
    }
    cur.items.push(it);
  });
  if(cur) weeks.push(cur);
  weeks.forEach(w => {
    w.range = `${w.items[0].d} – ${w.items[w.items.length-1].d}`;
  });
  return weeks;
}

function render(){
  const cal = document.getElementById('calendar');
  const weeks = groupByWeek();
  cal.innerHTML = weeks.map(week => {
    const cards = week.items.map(it => {
      const visible = (activeCat === 'all' || it.cat === activeCat);
      const done = isDone(it);
      const today = it.d === TODAY;
      return `
        <div class="day-card ${it.cat} ${today?'today':''} ${done?'done':''} ${visible?'':'hidden'}" data-cat="${it.cat}">
          ${today ? '<div class="today-banner">今天</div>' : ''}
          <div class="day-head">
            <div class="day-date">${it.d} <span class="dw">(${it.w})</span></div>
            <span class="day-badge ${it.cat}">${CAT_LABEL[it.cat].replace(/[^一-鿿A-Za-z]/g,'')}</span>
          </div>
          <div class="day-num">Day ${ROADMAP.indexOf(it)+1}${it.cat!=='rest'?` · ${CAT_LABEL[it.cat].replace(/[^一-鿿A-Za-z]/g,'')} #${it.n}`:''}</div>
          <div class="day-title">${it.t}</div>
          <div class="day-mins">
            <span>${it.m>0?'⏱ '+it.m+' 分':'☕'}</span>
            <span class="day-check">
              <input type="checkbox" id="c-${ROADMAP.indexOf(it)}" ${done?'checked':''} onchange='toggleDone(${JSON.stringify(it)})' onclick="event.stopPropagation()">
              <label for="c-${ROADMAP.indexOf(it)}">${done?'已讀':'讀完'}</label>
            </span>
          </div>
        </div>
      `;
    }).join('');
    return `
      <section class="week" id="week-${week.num}">
        <div class="week-head">
          <span class="week-num">W${week.num}</span>
          <span class="week-title">第 ${week.num} 週</span>
          <span class="week-range">${week.range}</span>
        </div>
        <div class="week-grid">${cards}</div>
      </section>
    `;
  }).join('');

  // 進度條
  const done = doneSet.length;
  const total = ROADMAP.length;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('progressBar').style.width = (done/total*100) + '%';

  // 剩餘天數（從今天 5/28 到 8/1 = 65 天）
  const today = new Date();
  const target = new Date(2026, 7, 1); // 8/1
  const diff = Math.max(0, Math.ceil((target - today) / 86400000));
  document.getElementById('remaining').textContent = `還剩 ${diff} 天`;
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeCat = t.dataset.cat;
    render();
  });
});

function jumpToToday(){
  const todayEl = document.querySelector('.day-card.today');
  if(todayEl) todayEl.scrollIntoView({behavior:'smooth', block:'center'});
}

render();
// 預設展開到今天的位置
setTimeout(() => { jumpToToday(); }, 200);
</script>
</body>
</html>
