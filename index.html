<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>傳說戰場：幾何特訓</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 載入 React 與 Babel (讓瀏覽器能直接跑 React) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #020617; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 遊戲關卡腳本 ---
        const STAGES = [
          {
            type: 'intro',
            title: '歡迎來到幾何戰場',
            dialog: (
              <React.Fragment>
                特戰隊員你好！<br/><br/>
                今天我們要解鎖 <span className="text-cyan-400 font-black text-2xl sm:text-3xl">3 招</span> 觀察敵人位置的超能力。<br/>
                學會這 3 招，你就能看破敵人的陣型！<br/><br/>
                準備好開始特訓了嗎？
              </React.Fragment>
            ),
            button: '開始特訓',
            icon: <i className="fa-solid fa-crosshairs text-cyan-400 animate-pulse text-4xl sm:text-5xl"></i>
          },
          // --- 第一招：同位角 ---
          {
            type: 'tutorial',
            title: '第一招：同位角 (影分身)',
            dialog: (
              <React.Fragment>
                請看閃爍的 <strong>∠1</strong> 和 <strong>∠5</strong>。<br/><br/>
                它們都在十字路口的 <span className="text-cyan-400 font-black text-2xl sm:text-3xl">「左上角」</span>。<br/>
                位置一模一樣，這叫做「同位角」。<br/><br/>
                👉 只要位置一樣，它們的數字就會 <span className="text-cyan-400 font-black text-2xl sm:text-3xl">「完全相同」</span>！
              </React.Fragment>
            ),
            highlights: [1, 5],
            knownValues: {1: '120°', 5: '120°'},
            button: '我懂了！',
            icon: <i className="fa-solid fa-bolt text-cyan-400 text-3xl sm:text-4xl"></i>,
            color: 'cyan'
          },
          {
            type: 'task_click',
            title: '實戰：尋找影分身',
            dialog: (
              <React.Fragment>
                換你試試看！<br/>
                敵人在上面路口的 <span className="text-cyan-400 font-black text-2xl sm:text-3xl">「右下角」</span> (∠4)。<br/><br/>
                👉 請點擊找出：下面路口的「右下角」在哪裡？
              </React.Fragment>
            ),
            knownValues: {4: '60°'},
            targetAngle: 8,
            errorMsg: (
              <React.Fragment>
                <span className="text-red-400 font-bold">哎呀，點錯位置囉！</span><br/>
                請找找看下面路口的「右下角」是哪一個圓圈？
              </React.Fragment>
            ),
            successMsg: (
              <React.Fragment>
                <span className="text-green-400 font-black text-2xl sm:text-3xl">太棒了！精準鎖定！</span><br/>
                ∠4 和 ∠8 都在右下角，它們是同位角(影分身)。
              </React.Fragment>
            ),
            color: 'cyan'
          },
          {
            type: 'task_choice',
            title: '實戰：確認數字',
            dialog: (
              <React.Fragment>
                既然 ∠4 和 ∠8 是同位角(影分身)。<br/><br/>
                如果 ∠4 是 <strong>60度</strong>，那 ∠8 應該是幾度呢？<br/>
                <span className="text-slate-400 text-base sm:text-lg">(提示：影分身的數字會「一模一樣」喔！)</span>
              </React.Fragment>
            ),
            knownValues: {4: '60°'},
            highlights: [4, 8],
            choices: [60, 120, 180],
            correctChoice: 60,
            errorMsg: (
              <React.Fragment>
                <span className="text-red-400 font-bold">不對喔！</span><br/>
                影分身的數字要跟 60 「一模一樣」才行！
              </React.Fragment>
            ),
            successMsg: (
              <React.Fragment>
                <span className="text-green-400 font-black text-2xl sm:text-3xl">完全正確！</span><br/>
                同位角的數字一樣大！
              </React.Fragment>
            ),
            color: 'cyan'
          },
          // --- 第二招：內錯角 ---
          {
            type: 'tutorial',
            title: '第二招：內錯角 (交叉走位)',
            dialog: (
              <React.Fragment>
                請看閃爍的 <strong>∠3</strong> 和 <strong>∠6</strong>。<br/><br/>
                它們躲在兩條兵線的 <span className="text-pink-400 font-black text-2xl sm:text-3xl">「裡面」</span>，而且 <span className="text-pink-400 font-black text-2xl sm:text-3xl">「左右交叉」</span>。<br/>
                這叫做「內錯角」。<br/><br/>
                👉 交叉走位的數字，也會 <span className="text-pink-400 font-black text-2xl sm:text-3xl">「完全相同」</span>！
              </React.Fragment>
            ),
            highlights: [3, 6],
            knownValues: {3: '110°', 6: '110°'},
            button: '記住了！',
            icon: <i className="fa-solid fa-bolt text-pink-400 text-3xl sm:text-4xl"></i>,
            color: 'pink'
          },
          {
            type: 'task_click',
            title: '實戰：尋找交叉走位',
            dialog: (
              <React.Fragment>
                敵方躲在「裡面」的 <span className="text-pink-400 font-black text-2xl sm:text-3xl">「右邊」</span> (∠4)。<br/><br/>
                👉 請點擊找出：在「裡面」，而且交叉跑到「左邊」的是哪一個？
              </React.Fragment>
            ),
            knownValues: {4: '70°'},
            targetAngle: 5,
            errorMsg: (
              <React.Fragment>
                <span className="text-red-400 font-bold">走錯位置囉！</span><br/>
                要找躲在「裡面」，而且跑到「左邊」的那一個圓圈！
              </React.Fragment>
            ),
            successMsg: (
              <React.Fragment>
                <span className="text-green-400 font-black text-2xl sm:text-3xl">漂亮！抓到了！</span><br/>
                ∠4 和 ∠5 是內錯角。
              </React.Fragment>
            ),
            color: 'pink'
          },
          {
            type: 'task_choice',
            title: '實戰：確認數字',
            dialog: (
              <React.Fragment>
                既然 ∠4 和 ∠5 是交叉走位(內錯角)。<br/><br/>
                如果 ∠4 是 <strong>70度</strong>，那 ∠5 應該是幾度呢？<br/>
                <span className="text-slate-400 text-base sm:text-lg">(提示：交叉走位的數字也會「一模一樣」！)</span>
              </React.Fragment>
            ),
            knownValues: {4: '70°'},
            highlights: [4, 5],
            choices: [70, 110, 180],
            correctChoice: 70,
            errorMsg: (
              <React.Fragment>
                <span className="text-red-400 font-bold">想想看！</span><br/>
                內錯角的數字，戰鬥力「一樣大」喔！
              </React.Fragment>
            ),
            successMsg: (
              <React.Fragment>
                <span className="text-green-400 font-black text-2xl sm:text-3xl">沒錯！</span><br/>
                內錯角數字一樣大！
              </React.Fragment>
            ),
            color: 'pink'
          },
          // --- 第三招：同側內角 ---
          {
            type: 'tutorial',
            title: '第三招：同側內角 (好隊友)',
            dialog: (
              <React.Fragment>
                最後一招！看 <strong>∠3</strong> 和 <strong>∠5</strong>。<br/><br/>
                它們都在兵線的「裡面」，而且在 <span className="text-yellow-400 font-black text-2xl sm:text-3xl">「同一邊」</span>。<br/>
                它們是好隊友，叫做「同側內角」。<br/><br/>
                👉 好隊友合作，數字加起來 <span className="text-yellow-400 font-black text-2xl sm:text-3xl">「剛好 180 度」</span>！
              </React.Fragment>
            ),
            highlights: [3, 5],
            knownValues: {3: '110°', 5: '70°'},
            button: '準備實戰！',
            icon: <i className="fa-solid fa-shield-halved text-yellow-400 text-3xl sm:text-4xl"></i>,
            color: 'yellow'
          },
          {
            type: 'task_click',
            title: '實戰：尋找好隊友',
            dialog: (
              <React.Fragment>
                隊友在「裡面」的 <span className="text-yellow-400 font-black text-2xl sm:text-3xl">「右邊」</span> (∠4)。<br/><br/>
                👉 請點擊找出：跟他同樣在「右邊」，一起防守的好隊友是誰？
              </React.Fragment>
            ),
            knownValues: {4: '70°'},
            targetAngle: 6,
            errorMsg: (
              <React.Fragment>
                <span className="text-red-400 font-bold">找錯隊友囉！</span><br/>
                同側內角要在「裡面」，而且跟他在「同一邊 (右邊)」喔！
              </React.Fragment>
            ),
            successMsg: (
              <React.Fragment>
                <span className="text-green-400 font-black text-2xl sm:text-3xl">找到了！集結完畢！</span><br/>
                ∠4 和 ∠6 是好隊友。
              </React.Fragment>
            ),
            color: 'yellow'
          },
          {
            type: 'task_choice',
            title: '實戰：啟動防護罩',
            dialog: (
              <React.Fragment>
                ∠4 是 <strong>70度</strong>。<br/><br/>
                隊友 ∠6 需要出多少力氣，兩個人加起來才會 <span className="text-yellow-400 font-black text-2xl sm:text-3xl">「剛好 180度」</span> 呢？<br/>
                <span className="text-slate-400 text-base sm:text-lg">(提示： 180 - 70 = ? )</span>
              </React.Fragment>
            ),
            knownValues: {4: '70°'},
            highlights: [4, 6],
            choices: [70, 110, 180],
            correctChoice: 110,
            errorMsg: (
              <React.Fragment>
                <span className="text-red-400 font-bold">算錯囉！</span><br/>
                你可以用手指算算看： 180 減掉 70 是多少？
              </React.Fragment>
            ),
            successMsg: (
              <React.Fragment>
                <span className="text-green-400 font-black text-2xl sm:text-3xl">完美！</span><br/>
                70 + 110 = 180！同側內角加起來 180度！
              </React.Fragment>
            ),
            color: 'yellow'
          },
          // --- 魔王關 ---
          {
            type: 'tutorial',
            title: '⚠️ 魔王降臨 ⚠️',
            dialog: (
              <React.Fragment>
                敵方派出大魔王！<br/><br/>
                現在畫面只剩下一個數字，你必須連續使用剛才學會的 3 招，<br/>
                把所有的位置都破解掉！準備好了嗎？
              </React.Fragment>
            ),
            highlights: [],
            knownValues: {},
            button: '迎擊魔王！',
            icon: <i className="fa-solid fa-crosshairs text-red-500 animate-bounce text-3xl sm:text-4xl"></i>,
            color: 'red'
          },
          {
            type: 'task_choice',
            title: '魔王戰 (1/3)：同位角',
            dialog: (
              <React.Fragment>
                已知 ∠2 是 <strong>130度</strong>。<br/><br/>
                它和 ∠6 都在「右上角」(同位角)。<br/>
                請問影分身 ∠6 是幾度？
              </React.Fragment>
            ),
            knownValues: {2: '130°'},
            highlights: [2, 6],
            choices: [50, 130, 180],
            correctChoice: 130,
            errorMsg: (
              <React.Fragment>
                <span className="text-red-400 font-bold">回想一下第一招！</span><br/>
                同位角(影分身)的數字會「一模一樣」喔！
              </React.Fragment>
            ),
            successMsg: (
              <React.Fragment>
                <span className="text-green-400 font-black text-2xl sm:text-3xl">正確！</span><br/>
                ∠6 也是 130度。
              </React.Fragment>
            ),
            color: 'cyan'
          },
          {
            type: 'task_choice',
            title: '魔王戰 (2/3)：內錯角',
            dialog: (
              <React.Fragment>
                現在已知 ∠6 是 <strong>130度</strong>。<br/><br/>
                它和 ∠3 在裡面「交叉走位」(內錯角)。<br/>
                請問交叉走位的 ∠3 是幾度？
              </React.Fragment>
            ),
            knownValues: {2: '130°', 6: '130°'},
            highlights: [6, 3],
            choices: [50, 130, 180],
            correctChoice: 130,
            errorMsg: (
              <React.Fragment>
                <span className="text-red-400 font-bold">回想一下第二招！</span><br/>
                交叉走位(內錯角)的數字也會「一模一樣」喔！
              </React.Fragment>
            ),
            successMsg: (
              <React.Fragment>
                <span className="text-green-400 font-black text-2xl sm:text-3xl">正確！</span><br/>
                ∠3 也是 130度。
              </React.Fragment>
            ),
            color: 'pink'
          },
          {
            type: 'task_choice',
            title: '魔王戰 (3/3)：同側內角',
            dialog: (
              <React.Fragment>
                最後一擊！已知 ∠3 是 <strong>130度</strong>。<br/><br/>
                它和 ∠5 在裡面「同一邊」(同隊好隊友)。<br/>
                加起來要 <strong>180度</strong>！請問 ∠5 是幾度？<br/>
                <span className="text-slate-400 text-base sm:text-lg">(提示： 180 - 130 = ? )</span>
              </React.Fragment>
            ),
            knownValues: {2: '130°', 6: '130°', 3: '130°'},
            highlights: [3, 5],
            choices: [50, 130, 180],
            correctChoice: 50,
            errorMsg: (
              <React.Fragment>
                <span className="text-red-400 font-bold">再算一次！</span><br/>
                180 減掉 130 是多少呢？
              </React.Fragment>
            ),
            successMsg: (
              <React.Fragment>
                <span className="text-green-400 font-black text-2xl sm:text-3xl">太強了！</span><br/>
                你完全破解了魔王關卡！
              </React.Fragment>
            ),
            color: 'yellow'
          },
          {
            type: 'victory',
          }
        ];

        function App() {
          const [stageIndex, setStageIndex] = useState(0);
          const [currentMessage, setCurrentMessage] = useState(null);
          const [isError, setIsError] = useState(false);
          const [isSuccess, setIsSuccess] = useState(false);
          const [showConfetti, setShowConfetti] = useState(false);

          const stage = STAGES[stageIndex];

          const colorMap = {
            cyan: 'text-cyan-400 border-cyan-400 bg-cyan-400/20',
            pink: 'text-pink-400 border-pink-400 bg-pink-400/20',
            yellow: 'text-yellow-400 border-yellow-400 bg-yellow-400/20',
            red: 'text-red-500 border-red-500 bg-red-500/20',
            default: 'text-white border-slate-600 bg-slate-800'
          };

          const getThemeColor = (color) => colorMap[color] || colorMap.default;

          const nextStage = () => {
            setIsError(false);
            setIsSuccess(false);
            setCurrentMessage(null);
            if (stageIndex < STAGES.length - 1) {
              setStageIndex(stageIndex + 1);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          useEffect(() => {
            if (stage?.type === 'victory') {
              setShowConfetti(true);
            }
          }, [stage]);

          const handleAngleClick = (angleId) => {
            if (stage.type !== 'task_click' || isSuccess) return;

            if (angleId === stage.targetAngle) {
              setIsError(false);
              setIsSuccess(true);
              setCurrentMessage(stage.successMsg);
            } else {
              setIsError(true);
              setCurrentMessage(stage.errorMsg);
            }
          };

          const handleChoice = (choice) => {
            if (stage.type !== 'task_choice' || isSuccess) return;

            if (choice === stage.correctChoice) {
              setIsError(false);
              setIsSuccess(true);
              setCurrentMessage(stage.successMsg);
            } else {
              setIsError(true);
              setCurrentMessage(stage.errorMsg);
            }
          };

          const renderGeometryBoard = () => {
            const anglePositions = {
              1: { x: 320, y: 70 }, 2: { x: 430, y: 70 },
              3: { x: 320, y: 170 }, 4: { x: 430, y: 170 },
              5: { x: 170, y: 230 }, 6: { x: 280, y: 230 },
              7: { x: 170, y: 330 }, 8: { x: 280, y: 330 },
            };

            const isClickable = stage.type === 'task_click' && !isSuccess;

            return (
              <div className="relative w-full max-w-2xl aspect-[3/2] sm:aspect-[16/9] mx-auto bg-slate-900 rounded-xl border-2 border-slate-700 shadow-xl overflow-hidden flex-shrink-0">
                <svg viewBox="0 0 600 400" className="absolute inset-0 w-full h-full pointer-events-none">
                  <line x1="50" y1="120" x2="550" y2="120" stroke="#4bc0c8" strokeWidth="6" strokeLinecap="round" className="animate-pulse"/>
                  <line x1="50" y1="280" x2="550" y2="280" stroke="#4bc0c8" strokeWidth="6" strokeLinecap="round" className="animate-pulse"/>
                  <line x1="450" y1="40" x2="150" y2="360" stroke="#ff007f" strokeWidth="6" strokeLinecap="round" className="drop-shadow-lg"/>
                </svg>
                
                {Object.entries(anglePositions).map(([id, pos]) => {
                  const numId = parseInt(id);
                  const isHighlighted = stage.highlights?.includes(numId);
                  const isKnown = stage.knownValues && stage.knownValues[numId];
                  const isTargeted = isSuccess && stage.targetAngle === numId;
                  
                  let btnClass = "absolute transform -translate-x-1/2 -translate-y-1/2 w-10 h-10 sm:w-16 sm:h-16 rounded-full flex items-center justify-center font-black text-lg sm:text-2xl transition-all duration-300 border-2 sm:border-4 select-none ";
                  
                  if (isKnown) {
                    btnClass += "bg-white text-slate-900 border-white shadow-[0_0_15px_rgba(255,255,255,0.8)] z-20";
                  } else if (isHighlighted || isTargeted) {
                    btnClass += `bg-slate-800 border-yellow-400 text-yellow-400 shadow-[0_0_20px_rgba(250,204,21,0.8)] scale-110 sm:scale-125 z-20 animate-pulse`;
                  } else if (isClickable) {
                    btnClass += "bg-slate-800/80 border-slate-500 text-slate-400 hover:border-cyan-400 hover:text-cyan-400 hover:scale-110 cursor-pointer z-10 hover:z-30";
                  } else {
                    btnClass += "bg-slate-800/50 border-slate-600 text-slate-500 z-10 pointer-events-none";
                  }

                  return (
                    <div 
                      key={id}
                      style={{ left: `${(pos.x / 600) * 100}%`, top: `${(pos.y / 400) * 100}%` }}
                      className={btnClass}
                      onClick={() => handleAngleClick(numId)}
                    >
                      {isKnown ? stage.knownValues[numId] : `∠${id}`}
                    </div>
                  );
                })}
              </div>
            );
          };

          if (stage.type === 'victory') {
            return (
              <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-center font-sans overflow-y-auto relative text-slate-200">
                {showConfetti && (
                  <div className="absolute inset-0 pointer-events-none flex justify-center">
                    <div className="animate-bounce mt-10 sm:mt-20">
                      <i className="fa-solid fa-trophy text-[6rem] sm:text-[8rem] text-yellow-400 drop-shadow-[0_0_30px_rgba(250,204,21,0.8)]"></i>
                    </div>
                  </div>
                )}
                <h1 className="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-400 to-orange-500 mb-6 z-10 mt-32 sm:mt-40">
                  特訓完美通關！
                </h1>
                <p className="text-xl sm:text-3xl text-slate-300 mb-12 max-w-2xl z-10 font-bold leading-relaxed">
                  你太厲害了！<br/>
                  同位角、內錯角、同側內角都難不倒你！<br/>
                  給自己一個大大的掌聲！👏👏👏
                </p>
                <button 
                  onClick={() => { setStageIndex(0); setShowConfetti(false); }}
                  className="z-10 flex items-center gap-2 sm:gap-3 px-6 py-3 sm:px-8 sm:py-4 bg-cyan-500 hover:bg-cyan-400 text-slate-900 rounded-full font-black text-xl sm:text-2xl transition-all active:scale-95"
                >
                  <i className="fa-solid fa-rotate-right"></i> 再挑戰一次
                </button>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-slate-950 text-slate-200 flex flex-col font-sans select-none overflow-x-hidden overflow-y-auto">
              
              <header className="p-3 sm:p-4 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between sticky top-0 z-50 backdrop-blur-sm">
                <h1 className="text-base sm:text-xl font-bold flex items-center gap-2">
                  <i className="fa-solid fa-shield-halved text-cyan-400"></i>
                  <span className="truncate">傳說戰場：幾何特訓</span>
                </h1>
                <div className="text-xs sm:text-sm font-bold text-slate-400 bg-slate-800 px-3 py-1 rounded-full whitespace-nowrap">
                  進度 {stageIndex} / {STAGES.length - 1}
                </div>
              </header>

              <main className="flex-grow flex flex-col items-center justify-start sm:justify-center p-4 sm:p-6 gap-4 sm:gap-6 max-w-5xl mx-auto w-full pb-10">
                
                {stage.type === 'intro' ? (
                  <div className="text-center flex flex-col items-center gap-6 sm:gap-8 mt-4 sm:mt-0">
                    {stage.icon}
                    <h2 className="text-3xl sm:text-5xl font-black text-white">{stage.title}</h2>
                    <div className="text-lg sm:text-2xl text-slate-200 max-w-2xl leading-relaxed font-bold bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-700 shadow-xl w-full">
                      {stage.dialog}
                    </div>
                    <button 
                      onClick={nextStage}
                      className="mt-2 flex items-center gap-2 sm:gap-3 px-8 py-4 sm:px-10 sm:py-5 bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-white rounded-full font-black text-2xl sm:text-3xl transition-all active:scale-95 shadow-[0_0_20px_rgba(6,182,212,0.5)]"
                    >
                      <i className="fa-solid fa-play"></i> {stage.button}
                    </button>
                  </div>
                ) : (
                  <React.Fragment>
                    <div className="w-full flex flex-col items-center gap-2 sm:gap-3">
                      <div className={`inline-flex items-center gap-2 sm:gap-3 px-4 py-2 sm:px-6 sm:py-2 rounded-full border-2 font-black text-lg sm:text-2xl ${getThemeColor(stage.color)}`}>
                        {stage.icon}
                        {stage.title}
                      </div>
                    </div>

                    {renderGeometryBoard()}

                    {stage.type === 'task_choice' && (
                      <div className="flex flex-wrap gap-3 sm:gap-6 mt-1 sm:mt-2 w-full justify-center">
                        {stage.choices.map((choice, i) => (
                          <button
                            key={i}
                            onClick={() => handleChoice(choice)}
                            disabled={isSuccess}
                            className={`px-6 py-3 sm:px-10 sm:py-5 rounded-xl font-black text-2xl sm:text-4xl border-b-4 transition-all flex-1 min-w-[80px] max-w-[120px] sm:max-w-[160px] text-center justify-center
                              ${isSuccess 
                                ? choice === stage.correctChoice 
                                  ? 'bg-green-500 border-green-700 text-white shadow-[0_0_15px_rgba(34,197,94,0.6)]' 
                                  : 'bg-slate-800 border-slate-900 text-slate-500 opacity-50'
                                : 'bg-slate-700 border-slate-900 active:bg-slate-600 active:border-b-0 active:translate-y-1 text-white'
                              }`}
                          >
                            {choice}°
                          </button>
                        ))}
                      </div>
                    )}

                    <div className={`w-full max-w-3xl mt-auto rounded-xl p-5 sm:p-8 border-2 transition-colors duration-300 shadow-2xl flex flex-col gap-4 relative
                      ${isError ? 'bg-red-950/90 border-red-500' : isSuccess ? 'bg-green-950/90 border-green-500' : 'bg-slate-800 border-slate-600'}`}
                    >
                      <div className="absolute -top-4 -left-2 sm:-top-6 sm:-left-6 bg-slate-900 rounded-full p-1 sm:p-2 border-2 border-slate-700 flex items-center justify-center w-12 h-12 sm:w-16 sm:h-16">
                        {isError ? <i className="fa-solid fa-circle-xmark text-3xl sm:text-4xl text-red-500"></i> : 
                         isSuccess ? <i className="fa-solid fa-circle-check text-3xl sm:text-4xl text-green-500"></i> : 
                         <i className="fa-solid fa-shield-halved text-2xl sm:text-3xl text-cyan-400"></i>}
                      </div>

                      <div className="text-lg sm:text-2xl font-bold text-white leading-relaxed pl-6 sm:pl-10 pt-2 sm:pt-0">
                        {currentMessage || stage.dialog}
                      </div>

                      {(stage.type === 'tutorial' || isSuccess) && (
                        <div className="flex justify-end mt-2">
                          <button 
                            onClick={nextStage}
                            className="flex items-center gap-2 px-6 py-2 sm:px-8 sm:py-4 bg-cyan-500 text-slate-900 rounded-full font-black text-lg sm:text-2xl transition-all active:scale-95 shadow-lg border-2 border-slate-900"
                          >
                            {isSuccess ? '下一關' : (stage.button || '繼續')} <i className="fa-solid fa-arrow-right"></i>
                          </button>
                        </div>
                      )}
                    </div>
                  </React.Fragment>
                )}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
