<title>放大鏡偵探出動</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one stage-first column — a 16:9 cartoon player with chapter strip; the quiz swaps into the same column */
:root{
  --sky:#e2eff3;
  --panel:#ffffff;
  --ink:#2b2320;
  --muted:#53646a;
  --sun:#ffc83d;
  --teal:#1f7f86;
  --coral:#ff6b57;
  --leaf:#2f9e5b;
  --wash:#fff6d8;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-chalk:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  color-scheme:light;
}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
*{box-sizing:border-box}
.fd{font-family:var(--f-display)}
.fc{font-family:var(--f-chalk)}
.app{max-width:1120px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--f-display);font-size:clamp(24px,4.2vw,38px);line-height:1.15;margin:0;font-weight:400;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;background:var(--panel);padding:5px;border-radius:999px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.tab{font-family:var(--f-display);font-size:18px;border:0;background:transparent;padding:8px 18px;border-radius:999px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px;min-height:44px}
.tab[aria-selected="true"]{background:var(--sun)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.opt-main:focus-visible,.spk:focus-visible{outline:4px solid var(--teal);outline-offset:2px}

.stage-wrap{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:#fbf0d9;box-shadow:0 6px 0 var(--ink)}
.stage-wrap:fullscreen{border:0;border-radius:0;background:#1b1715;box-shadow:none}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.sub{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);max-width:94%;width:max-content;background:rgba(255,255,255,.96);border:3px solid var(--ink);border-radius:16px;padding:.3em .75em;font-family:var(--f-display);font-size:clamp(15px,2.9vw,34px);line-height:1.35;display:flex;gap:.5em;align-items:center;box-shadow:0 4px 0 var(--ink);pointer-events:none}
.sub .who{font-size:.58em;color:#fff;padding:.2em .7em;border-radius:999px;white-space:nowrap;flex:none}
.sub mark{background:linear-gradient(transparent 52%,#ffe06b 52%);color:inherit;padding:0 .05em}
.cover,.endcard{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;background:rgba(43,35,32,.28);text-align:center}
.bigplay{width:clamp(84px,14vw,140px);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);background:var(--sun);box-shadow:0 7px 0 var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.bigplay:hover{transform:scale(1.06) rotate(-4deg)}
.bigplay:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.cover-label{font-family:var(--f-display);font-size:clamp(16px,2.6vw,26px);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:.2em 1em;box-shadow:0 3px 0 var(--ink)}
.endcard h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,64px);margin:0;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink)}
.endcard .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls .spacer{flex:1 1 0}
.btn{font-family:var(--f-display);font-size:17px;border:3px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:14px;padding:6px 14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:48px;line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--sun)}
.btn.go{background:var(--teal);color:#fff}
.btn[aria-pressed="false"]{background:#eef3f4;color:var(--muted)}
.btn svg{flex:none}
.chapters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chip{flex:none;font-family:var(--f-display);font-size:16px;border:3px solid var(--ink);background:var(--panel);border-radius:999px;padding:4px 14px 4px 5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:44px;color:var(--ink)}
.chip b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--wash);border:2px solid var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.chip.on{background:var(--teal);color:#fff}
.chip.on b{background:var(--sun);color:var(--ink)}
.note{background:var(--panel);border:2px dashed #9fb7bd;border-radius:14px;padding:10px 14px;color:var(--muted);font-size:15px}
.note b{color:var(--ink)}

/* quiz */
.quiz{display:grid;gap:14px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.prog{display:flex;gap:6px;flex-wrap:wrap}
.prog span{width:34px;height:34px;display:grid;place-items:center}
.qcard{background:var(--panel);border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:18px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.host{position:relative}
.host svg{width:100%;height:auto;display:block}
.host.jump svg{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
.host .think{position:absolute;right:4%;top:2%;font-family:var(--f-display);font-size:54px;color:#2f8fd8;-webkit-text-stroke:2px var(--ink);opacity:0;transform:scale(.4);transition:all .25s}
.host.puzzled .think{opacity:1;transform:scale(1) rotate(10deg)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-26px) scaleY(1.04)}70%{transform:translateY(0) scaleY(.95)}100%{transform:none}}
.qmain{display:grid;gap:14px;min-width:0}
.qno{font-family:var(--f-display);color:var(--teal);font-size:18px}
.qtext{font-family:var(--f-display);font-size:clamp(23px,3.6vw,38px);line-height:1.3;margin:0;display:flex;gap:10px;align-items:flex-start;text-wrap:balance}
.qtext mark{background:linear-gradient(transparent 55%,#ffe06b 55%);color:inherit}
.qpic{background:var(--wash);border:3px solid var(--ink);border-radius:16px;max-width:380px}
.qpic svg{display:block;width:100%;height:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.opt{position:relative}
.opt-main{width:100%;font-family:var(--f-display);font-size:clamp(20px,2.6vw,28px);border:4px solid var(--ink);background:#fff;border-radius:20px;box-shadow:0 5px 0 var(--ink);cursor:pointer;padding:10px 10px 12px;display:grid;gap:4px;justify-items:center;color:var(--ink);transition:background .2s,opacity .2s}
.opt-main svg{width:100%;max-width:220px;height:auto}
.opt-main:hover{background:#fffaf0}
.opt-main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.opt.wrong .opt-main{opacity:.45;animation:nope .45s}
.opt.right .opt-main{background:#dcf3e4;border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf)}
.opt.hint .opt-main{animation:glow 1.1s ease-in-out infinite}
@keyframes nope{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes glow{0%,100%{box-shadow:0 5px 0 var(--ink),0 0 0 0 rgba(255,200,61,.9)}50%{box-shadow:0 5px 0 var(--ink),0 0 0 12px rgba(255,200,61,.55)}}
.spk{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);cursor:pointer;display:grid;place-items:center;padding:0}
.feedback{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#dcf3e4;border:3px solid var(--leaf);border-radius:18px;padding:10px 14px;font-family:var(--f-display);font-size:clamp(18px,2.4vw,26px)}
.feedback.try{background:#fff3d6;border-color:#e0a100}
.feedback mark{background:linear-gradient(transparent 55%,#ffe06b 55%);color:inherit}
.qstart,.qdone{background:var(--panel);border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:22px;display:grid;gap:14px;justify-items:center;text-align:center}
.qstart h2,.qdone h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,46px);margin:0}
.qstart p,.qdone p{margin:0;color:var(--muted);font-size:17px;max-width:40em}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:12px;height:8px;border-radius:2px;animation:fall var(--d) linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:640px){
  .qcard{grid-template-columns:1fr}
  .host{max-width:150px;justify-self:center}
  .btn{font-size:15px;padding:6px 10px}
  .btn .lbl{display:none}
  .opts{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  .host.jump svg,.opt.wrong .opt-main,.opt.hint .opt-main,.confetti i{animation:none}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="58" height="58" viewBox="0 0 100 100" aria-hidden="true"><circle cx="42" cy="42" r="30" fill="#d9f0ff" stroke="#2b2320" stroke-width="7"/><circle cx="42" cy="42" r="30" fill="none" stroke="#ffc83d" stroke-width="3"/><path d="M28 32 Q34 22 46 22" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="62" y="60" width="16" height="36" rx="7" transform="rotate(-45 70 78)" fill="#8a5a2b" stroke="#2b2320" stroke-width="6"/></svg>
      <div>
        <h1>放大鏡偵探出動！</h1>
        <p>特教乙班自然｜IEP 1-2｜放大鏡，讓小東西看起來變大</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="切換">
      <button class="tab" role="tab" id="tabVideo" aria-selected="true">看動畫</button>
      <button class="tab" role="tab" id="tabQuiz" aria-selected="false">偵探問答</button>
    </nav>
  </header>

  <section id="viewVideo" class="quiz" aria-label="動畫">
    <div class="stage-wrap" id="stageWrap">
      <svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="放大鏡偵探動畫">
        <defs>
          <clipPath id="winClip"><rect x="933" y="83" width="284" height="244"/></clipPath>
          <filter id="lensBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="lensBlurN" stdDeviation="0"/></filter>
          <radialGradient id="hot"><stop offset="0" stop-color="#fff7b0"/><stop offset=".45" stop-color="#ff9a1f"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></radialGradient>
        </defs>
        <g id="cam"><g id="bg"></g><g id="props"></g><g id="actors"></g><g id="fx"></g></g>
        <g id="focus"></g>
        <g id="hud"></g>
        <g id="wipe"></g>
      </svg>
      <div class="sub" id="sub" hidden></div>
      <div class="cover" id="cover">
        <button class="bigplay" id="bigPlay" aria-label="播放動畫"><svg width="46%" viewBox="0 0 40 40" aria-hidden="true"><path d="M12 6 L34 20 L12 34Z" fill="#2b2320" stroke="#2b2320" stroke-width="4" stroke-linejoin="round"/></svg></button>
        <span class="cover-label">按我播放（約 4 分鐘，有配音）</span>
      </div>
      <div class="endcard" id="endcard" hidden>
        <h2>偵探任務完成！</h2>
        <div class="row">
          <button class="btn" id="againBtn">再看一次</button>
          <button class="btn go" id="toQuizBtn">去偵探問答 →</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" aria-label="上一段"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M19 4 8 12l11 8Z" fill="#2b2320" stroke="#2b2320" stroke-width="2.5" stroke-linejoin="round"/></svg><span class="lbl">上一段</span></button>
      <button class="btn primary" id="playBtn" aria-label="播放"><svg id="playIco" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 20 12 7 20Z" fill="#2b2320" stroke="#2b2320" stroke-width="2.5" stroke-linejoin="round"/></svg><span class="lbl" id="playLbl">播放</span></button>
      <button class="btn" id="nextBtn" aria-label="下一段"><span class="lbl">下一段</span><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4v16M5 4l11 8-11 8Z" fill="#2b2320" stroke="#2b2320" stroke-width="2.5" stroke-linejoin="round"/></svg></button>
      <span class="spacer"></span>
      <div class="toggles">
        <button class="btn" id="soundBtn" aria-pressed="true">配音：開</button>
        <button class="btn" id="voiceBtn">聲音：AI 錄音</button>
        <button class="btn" id="slowBtn" aria-pressed="false">慢速：關</button>
        <button class="btn" id="subBtn" aria-pressed="true">字幕：開</button>
        <button class="btn" id="fsBtn">全螢幕</button>
      </div>
    </div>
    <div class="chapters" id="chapters" role="list"></div>
    <p class="note"><b>上課怎麼播：</b>神秘信封後播第 2–6 段（發現問題 → 放大鏡操作）；發放大鏡前播第 7 段「安全規則」；生活任務前播第 8 段「保存期限」；統整時播第 9 段，接著到「偵探問答」。每段都可以單獨重播。</p>
  </section>

  <section id="viewQuiz" class="quiz" aria-label="偵探問答" hidden>
    <div class="qhead">
      <div class="prog" id="prog" aria-label="進度"></div>
      <div class="toggles">
        <button class="btn" id="qReadBtn" aria-pressed="true">自動唸題：開</button>
        <button class="btn" id="qRestart">重新開始</button>
      </div>
    </div>
    <div id="quizBody"></div>
  </section>
</div>

<script>
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg';
const INK='#2b2320',SKIN='#ffdcbc',SUN='#ffc83d',CORAL='#ff6b57',TEAL='#1f7f86',LEAF='#2f9e5b';
const $=id=>document.getElementById(id);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function g(html,parent){const n=el('g',null,parent);n.innerHTML=html;return n}
const rand=(a,b)=>a+Math.random()*(b-a);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= engine ================= */
const T={clock:0,playing:false,gen:0,tweens:[],timers:[],waiters:[],mul:1,speechRate:1,shake:0,focus:false,last:0};
const E={lin:t=>t,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}};
function tween(obj,to,dur=400,ease=E.out){const gg=T.gen;return new Promise(res=>{const from={};for(const k in to)from[k]=obj[k];T.tweens.push({obj,from,to,t0:T.clock,dur,ease,res,g:gg})})}
function wait(ms){const gg=T.gen;return new Promise(res=>T.timers.push({t:T.clock+ms,res,g:gg}))}
const par=(...p)=>Promise.all(p);

class Act{constructor(node,o){this.node=node;this.x=0;this.y=0;this.s=1;this.r=0;this.o=1;this.sy=1;Object.assign(this,o||{});this.apply()}
  apply(){this.node.setAttribute('transform',`translate(${this.x.toFixed(2)},${this.y.toFixed(2)}) rotate(${this.r.toFixed(2)}) scale(${this.s.toFixed(4)},${(this.s*this.sy).toFixed(4)})`);this.node.setAttribute('opacity',Math.max(0,Math.min(1,this.o)).toFixed(3))}}

const STAGE=$('stage'),CAMG=$('cam'),BG=$('bg'),PROPS=$('props'),ACTORS=$('actors'),FX=$('fx'),FOCUS=$('focus'),HUD=$('hud'),WIPE=$('wipe');
const cam={x:640,y:360,s:1,apply(){let ox=0,oy=0;if(T.shake>.3&&!reduce){ox=rand(-T.shake,T.shake);oy=rand(-T.shake,T.shake)}CAMG.setAttribute('transform',`translate(${640+ox},${360+oy}) scale(${this.s}) translate(${-this.x},${-this.y})`)}};

/* ================= characters ================= */
const KIDS=[];
const EYES={
  n:x=>`<ellipse cx="${x}" cy="0" rx="9" ry="13" fill="${INK}"/><circle cx="${x-3}" cy="-5" r="3.6" fill="#fff"/>`,
  star:x=>`<ellipse cx="${x}" cy="0" rx="12" ry="15" fill="${INK}"/><circle cx="${x-4}" cy="-6" r="5" fill="#fff"/><circle cx="${x+4}" cy="5" r="2.6" fill="#fff"/>`,
  happy:x=>`<path d="M${x-12},5 Q${x},-12 ${x+12},5" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`,
  shock:x=>`<circle cx="${x}" cy="-2" r="20" fill="#fff" stroke="${INK}" stroke-width="4"/><circle cx="${x}" cy="-2" r="6" fill="${INK}"/>`,
  squint:x=>{const d=x<0?1:-1;return `<path d="M${x-12*d},-9 L${x+10*d},0 L${x-12*d},9" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`},
  closed:x=>`<path d="M${x-12},2 L${x+12},2" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`,
  meh:x=>`<path d="M${x-11},-3 A11,9 0 0,0 ${x+11},-3Z" fill="${INK}"/><path d="M${x-15},-4 L${x+15},-4" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`,
  heart:x=>`<path transform="translate(${x},2) scale(1.15)" d="M0,10 C-22,-6 -12,-22 0,-11 C12,-22 22,-6 0,10Z" fill="#ff4d6d" stroke="${INK}" stroke-width="3"/>`,
  up:x=>`<ellipse cx="${x}" cy="0" rx="11" ry="15" fill="#fff" stroke="${INK}" stroke-width="3.5"/><circle cx="${x+3}" cy="-7" r="6" fill="${INK}"/>`,
  dizzy:x=>`<path d="M${x-11},-11 L${x+11},11 M${x+11},-11 L${x-11},11" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`
};
const MP='fill="none" stroke="'+INK+'" stroke-width="5" stroke-linecap="round"';
const MOUTH={
  smile:`<path d="M-18,38 Q0,55 18,38" ${MP}/>`,
  grin:`<path d="M-26,34 Q0,31 26,34 Q22,66 0,68 Q-22,66 -26,34Z" fill="#b8343a" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/><path d="M-12,58 Q0,50 12,58 Q6,66 0,66 Q-6,66 -12,58Z" fill="#ff8a8f"/>`,
  talk:`<path d="M-15,38 Q0,36 15,38 Q11,57 0,58 Q-11,57 -15,38Z" fill="#b8343a" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/>`,
  o:`<ellipse cx="0" cy="47" rx="9" ry="11" fill="#b8343a" stroke="${INK}" stroke-width="4.5"/>`,
  wow:`<ellipse cx="0" cy="50" rx="17" ry="23" fill="#b8343a" stroke="${INK}" stroke-width="4.5"/><ellipse cx="0" cy="63" rx="9" ry="6" fill="#ff8a8f"/>`,
  frown:`<path d="M-16,54 Q0,38 16,54" ${MP}/>`,
  flat:`<path d="M-14,47 L14,47" ${MP}/>`,
  wavy:`<path d="M-22,47 q5.5,-7 11,0 t11,0 t11,0 t11,0" ${MP}/>`,
  drool:`<path d="M-26,34 Q0,31 26,34 Q22,66 0,68 Q-22,66 -26,34Z" fill="#b8343a" stroke="${INK}" stroke-width="4.5"/><path d="M16,60 q8,16 0,26 q-8,-10 0,-26Z" fill="#8fd3ff" stroke="${INK}" stroke-width="2.5"/>`

function frame(now){const dt=Math.min(60,now-(T.last||now));T.last=now;
  if(T.playing){T.clock+=dt*T.mul;const cdt=dt*T.mul;
    for(let i=T.tweens.length-1;i>=0;i--){const w=T.tweens[i];if(w.g!==T.gen){T.tweens.splice(i,1);continue}const p=w.dur<=0?1:Math.min(1,(T.clock-w.t0)/w.dur);const e=w.ease(p);
      for(const k in w.to)w.obj[k]=w.from[k]+(w.to[k]-w.from[k])*e;if(w.obj.apply)w.obj.apply();if(p>=1){T.tweens.splice(i,1);w.res()}}
    for(let i=T.timers.length-1;i>=0;i--){const w=T.timers[i];if(w.g!==T.gen){T.timers.splice(i,1);continue}if(T.clock>=w.t){T.timers.splice(i,1);w.res()}}
    for(let i=T.waiters.length-1;i>=0;i--){const w=T.waiters[i];if(w.g!==T.gen){T.waiters.splice(i,1);continue}if(w.test()){T.waiters.splice(i,1);w.done();w.res()}}
    stepParticles(cdt);
    if(T.focus&&!reduce){if(T.clock-focusT>90){focusT=T.clock;drawFocus()}}else if(FOCUS.firstChild)FOCUS.innerHTML='';
    T.shake*=.88;const cl=$('clouds');if(cl)cl.setAttribute('transform',`translate(${((T.clock/90)%340)-60},0)`);
  }
  cam.apply();
  for(const k of KIDS)k.ambient(k.video?T.clock:now,T.playing);
  requestAnimationFrame(frame)}

const hostSvg=`<svg viewBox="-150 -470 300 480" aria-hidden="true"><g id="hostLayer"></g></svg>`;

function ensureHosts(container){container.innerHTML=hostSvg+'<span class="think">?</span>';const layer=container.querySelector('#hostLayer');

function showHost(key,e='n',m='smile',b='none'){Object.entries(HOSTS).forEach(([k,kid])=>{kid.root.style.display=k===key?'':'none'});HOSTS[key].face(e,m,b)}
let speakTimer=0;
function speak(text,who){if(!Sound.on)return;stopAudio();const plain=text.replace(/[【】]/g,'');const rec=audioFor(who?who.name:N.name,plain);const kk=who&&who.talk?[who]:[];

function quizStart(){QZ.i=0;QZ.first=[];prog.innerHTML='';

function burst(){if(reduce)return;const box=document.createElement('div');box.className='confetti';const cols=['#ffc83d','#ff6b57','#1f7f86','#7fd8ff','#ff9ec7','#3fbf73'];
