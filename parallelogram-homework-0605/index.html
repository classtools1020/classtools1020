<script>
const STORAGE_KEY = 'parallelogramHomework_v1';

/* ===== GATES (7 questions) ===== */
const GATES = [
  {
    id:1, topic:'4-1', label:'平行線・同位角', color:'#27D7FF', glow:'rgba(39,215,255,.5)',
    drawSVG: function(){return drawParallelLines({mark1:80,mark2Pos:'corresponding'});},
    prompt:'看圖：∠1 = <strong>80°</strong>，和它「同位置」的 ∠2 是多少？',

    prompt:'看圖：∠1 = <strong>110°</strong>，和它「同一邊、夾在中間」的 ∠2 是多少？（提示：兩個加起來 180°）',
    options:['70°','110°','90°','180°'], correct:0
  },
  {
    id:4, topic:'4-2', label:'平四・對邊等長', color:'#FFD93D', glow:'rgba(255,217,61,.5)',
    drawSVG: function(){return drawPgEqualSides();},
    prompt:'看圖：平行四邊形 AB = <strong>9 公分</strong>，那麼 CD = ？',
    options:['6 公分','9 公分','12 公分','15 公分'], correct:1
  },
  {
    id:5, topic:'4-2', label:'平四・對角線互平分', color:'#27D7FF', glow:'rgba(39,215,255,.5)',
    drawSVG: function(){return drawPgDiagonal();},
    prompt:'看圖：對角線 AC = <strong>12</strong>，O 是兩條對角線的交點。AO = ？',
    options:['6','8','10','12'], correct:0
  },

    id:6, topic:'4-2', label:'平四・面積四等分', color:'#9B5BFF', glow:'rgba(155,91,255,.5)',

/* ===== SVG DRAWERS ===== */
function drawParallelLines(opts){
  const IL1 = {x:261, y:85};
  const IL2 = {x:155, y:205};
  let a1Pos, a2Pos, a1Arc, a2Arc, hintText, hintColor;
  if(opts.mark2Pos==='corresponding'){
    a1Pos = {x:300, y:62, w:80};
    a1Arc = `M ${IL1.x+22},${IL1.y} A 22,22 0 0 0 ${IL1.x+12},${IL1.y-19}`;
    a2Pos = {x:194, y:182, w:64};
    a2Arc = `M ${IL2.x+22},${IL2.y} A 22,22 0 0 0 ${IL2.x+12},${IL2.y-19}`;
    hintText = 'F 形 · 同位角';
    hintColor = '#B47BFF';
  } else if(opts.mark2Pos==='alternate'){
    a1Pos = {x:300, y:120, w:80};
    a1Arc = `M ${IL1.x+22},${IL1.y} A 22,22 0 0 1 ${IL1.x+12},${IL1.y+19}`;
    a2Pos = {x:116, y:182, w:64};
    a2Arc = `M ${IL2.x-22},${IL2.y} A 22,22 0 0 0 ${IL2.x-12},${IL2.y-19}`;
    hintText = 'Z 形 · 內錯角';

/* ===== STATE ===== */
let state = { name:'', sessionId:'', startTime:0, currentIdx:0, attempts:[], completed:false };

/* ===== AUDIO ===== */
let audioCtx = null;
function initAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){return;} }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(f,d,delay=0,type='sine',v=0.18){
  if(!audioCtx) return;
  const t = audioCtx.currentTime+delay;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+d);
}
function playCorrect(){ tone(659,0.08,0,'sine',0.2); tone(988,0.25,0.08,'sine',0.22); }
function playWrong(){ tone(220,0.12,0,'triangle',0.13); tone(180,0.18,0.06,'triangle',0.1); }
function playVroom(){ if(!audioCtx) return; const t=audioCtx.currentTime; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(80,t); o.frequency.linearRampToValueAtTime(260,t+0.25); o.frequency.linearRampToValueAtTime(60,t+0.9); g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.9); o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+0.9); }
function playVictory(){ const n=[[523,.18,0],[659,.18,.16],[784,.18,.32],[1047,.4,.48],[1047,.16,.92],[1319,.7,1.1]]; n.forEach(([f,d,t])=>tone(f,d,t,'sine',0.24)); }

function fireRaceCar(mega=false){
  const c = document.getElementById('race-car');
  c.classList.remove('go','mega');
  void c.offsetWidth;
  if(mega) c.classList.add('go','mega'); else c.classList.add('go');
  playVroom();
}
function floatPlusOne(x,y){
  const e = document.getElementById('floating-plus');
  e.style.left=x+'px'; e.style.top=y+'px';
  e.classList.remove('fly'); void e.offsetWidth; e.classList.add('fly');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'),3000);
}

/* ===== STARFIELD ===== */
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars=[];
function resizeStarfield(){
  canvas.width=window.innerWidth*devicePixelRatio;
  canvas.height=window.innerHeight*devicePixelRatio;
  canvas.style.width=window.innerWidth+'px';
  canvas.style.height=window.innerHeight+'px';
  stars=Array.from({length:120},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5+.4,a:Math.random()*.6+.2,s:Math.random()*.01+.003}));
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    s.a += s.s*(Math.random()>.5?1:-1);
    if(s.a>.9)s.a=.9; if(s.a<.1)s.a=.1;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*devicePixelRatio,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${s.a})`; ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
window.addEventListener('resize',resizeStarfield);
resizeStarfield(); drawStars();

/* ===== VIEW SWITCHING ===== */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
}

/* ===== STORAGE ===== */
function saveRecord(){
  const record = {
    id: state.sessionId,
    name: state.name,
    startTime: state.startTime,
    endTime: state.completed ? Date.now() : null,
    currentIdx: state.currentIdx,
    attempts: [...state.attempts],
    totalAttempts: state.attempts.length,
    wrongCount: state.attempts.filter(a=>!a.correct).length,
    gatesPassed: state.currentIdx,
    completed: state.completed
  };
  try { localStorage.setItem(STORAGE_KEY+'_'+state.sessionId, JSON.stringify(record)); } catch(e){}
  try {
    if(typeof firebase!=='undefined' && firebase.database){
      firebase.database().ref(FB_PATH+'/'+state.sessionId).set(record);
    }
  } catch(e){ console.warn('Firebase error:',e); }
}

/* ===== START FLOW ===== */
document.getElementById('btn-start').addEventListener('click',()=>{
  const name = document.getElementById('player-name').value.trim();
  if(!name){
    const input = document.getElementById('player-name');
    if(typeof gsap!=='undefined') gsap.fromTo(input,{x:-8},{x:0,duration:.3,ease:'elastic.out(1,.3)'});
    input.focus();
    showToast('請先輸入名字喔！');
    return;
  }
  initAudio();
  state.name = name;
  state.sessionId = 'hw_'+Date.now()+'_'+Math.floor(Math.random()*1000);
  state.startTime = Date.now();
  state.currentIdx = 0;
  state.attempts = [];
  state.completed = false;
  document.getElementById('hud-name').textContent = name;
  saveRecord();
  switchView('quiz');
  renderGate(0);
});
document.getElementById('player-name').addEventListener('keypress',e=>{
  if(e.key==='Enter') document.getElementById('btn-start').click();
});

/* ===== QUIZ FLOW ===== */
let currentAttemptStart = 0;

function renderGate(idx){
  const g = GATES[idx];
  document.getElementById('view-quiz').style.setProperty('--gate-color',g.color);
  document.getElementById('view-quiz').style.setProperty('--gate-glow',g.glow);
  document.getElementById('gate-num').textContent = 'GATE '+(idx+1);
  document.getElementById('gate-num').style.setProperty('--gate-color',g.color);
  document.getElementById('gate-num').style.borderColor = g.color;
  document.getElementById('gate-num').style.color = g.color;
  document.getElementById('gate-label').textContent = g.topic + ' · ' + g.label;
  document.getElementById('gate-title').textContent = g.label;
  document.getElementById('gate-title').style.color = g.color;
  document.getElementById('gate-title').style.textShadow = '0 0 20px '+g.glow;
  document.getElementById('gate-frame').style.borderColor = g.color;
  document.getElementById('gate-frame').style.boxShadow = '0 0 32px '+g.glow;
  document.getElementById('gate-frame').setAttribute('data-gate','GATE '+(idx+1));
  document.getElementById('gate-svg').innerHTML = g.drawSVG();
  document.getElementById('q-prompt').innerHTML = g.prompt;
  // doors
  const grid = document.getElementById('doors-grid');
  grid.innerHTML = '';
  const letters=['A','B','C','D'];
  g.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'door-btn';
    btn.innerHTML = `<div class="door-letter">${letters[i]}</div><div>${opt}</div>`;
    btn.addEventListener('click',()=>onAnswer(i,btn));
    grid.appendChild(btn);
  });
  // entrance animation
  if(typeof gsap!=='undefined'){
    gsap.fromTo('.gate-frame',{scale:.92,y:20},{scale:1,y:0,duration:.5,ease:'back.out(1.4)'});
    gsap.fromTo('.door-btn',{y:30},{y:0,duration:.4,stagger:.06,ease:'back.out(1.4)'});
  }
  // progress
  document.getElementById('hud-fill').style.width = (idx*100/7)+'%';
  document.getElementById('hud-text').textContent = idx+' / 7';
  document.getElementById('hud-stars').textContent = '★ '+idx;
  currentAttemptStart = Date.now();
}

function onAnswer(idx,btn){
  if(btn.disabled) return;
  const g = GATES[state.currentIdx];
  const correct = idx === g.correct;
  state.attempts.push({gateId:g.id,correct,timeMs:Date.now()-currentAttemptStart,chose:idx});
  if(correct){
    btn.classList.add('correct');
    playCorrect();
    const r = btn.getBoundingClientRect();
    floatPlusOne(r.left+r.width/2, r.top+r.height/2);
    const isFinal = (state.currentIdx === GATES.length-1);
    fireRaceCar(isFinal);
    // confetti
    confetti({particleCount:isFinal?180:80,spread:isFinal?160:90,origin:{y:.55},colors:[g.color,'#FFD93D','#fff']});
    state.currentIdx += 1;
    saveRecord();
    setTimeout(()=>{
      if(state.currentIdx >= GATES.length){
        finishGame();
      } else {
        renderGate(state.currentIdx);
        showToast(`通過第 ${state.currentIdx} 關！下一關 →`);
      }
    },1400);
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    playWrong();
    setTimeout(()=>btn.classList.remove('wrong'),400);
    const grid = document.getElementById('doors-grid');
    let msg = grid.querySelector('.retry-msg');
    if(!msg){
      msg = document.createElement('div');
      msg.className = 'retry-msg';
      msg.textContent = '差一點點！再選一道門 →';
      grid.appendChild(msg);
    }
    currentAttemptStart = Date.now();
    saveRecord();
  }
}

/* ===== END FLOW ===== */
function finishGame(){
  state.completed = true;
  saveRecord();
  const elapsedMs = Date.now() - state.startTime;
  const mins = Math.floor(elapsedMs/60000);
  const secs = Math.floor((elapsedMs%60000)/1000);
  document.getElementById('end-name').textContent = state.name;
  document.getElementById('end-time').textContent = mins>0 ? `${mins}分${secs}秒` : `${secs}秒`;
  document.getElementById('end-attempts').textContent = state.attempts.length;
  switchView('end');
  // epic finale
  setTimeout(()=>{
    const colors=['#FFD93D','#FF6BB0','#27D7FF','#9B5BFF','#fff','#FFB300'];
    confetti({particleCount:260,spread:170,origin:{y:.35},colors});
    playVictory();
    setTimeout(()=>confetti({particleCount:160,spread:120,angle:60,origin:{x:0,y:.6},colors}),250);
    setTimeout(()=>confetti({particleCount:160,spread:120,angle:120,origin:{x:1,y:.6},colors}),500);
    setTimeout(()=>fireRaceCar(true),300);
    setTimeout(()=>fireRaceCar(false),1500);
    setTimeout(()=>confetti({particleCount:200,spread:360,startVelocity:35,origin:{y:.5},colors}),900);
  },200);
}

document.getElementById('btn-restart').addEventListener('click',()=>{
  state = { name:'', sessionId:'', startTime:0, currentIdx:0, attempts:[], completed:false };
  document.getElementById('player-name').value = '';
  switchView('start');
  setTimeout(()=>document.getElementById('player-name').focus(),300);
});

/* ===== INIT ===== */
window.addEventListener('load',()=>{
  document.getElementById('player-name').focus();
});
