<style>
  :root {
    --bg:#FFF8F0; --paper:#FFFFFF;
    --primary:#FFB3C7; --primary-soft:#FFD6E0;
    --accent:#A5D8FF; --accent-soft:#CCE7FF;
    --gold:#FFE066; --gold-soft:#FFF3B8;
    --mint:#B8E6B8; --orange:#FFA94D;
    --success:#95D5B2; --danger:#FFA8A8;
    --text:#4A4458; --text-dim:#918CA1;
    --ink:#4A4458;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;user-select:none}
  html,body{font-family:'M PLUS Rounded 1c','Microsoft JhengHei','PingFang TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  body{background:radial-gradient(circle at 15% 20%, rgba(255,179,199,0.15) 0, transparent 28%),radial-gradient(circle at 85% 75%, rgba(165,216,255,0.15) 0, transparent 30%),radial-gradient(circle, rgba(255,224,102,0.06) 1.5px, transparent 1.5px) 0 0 / 24px 24px,var(--bg);background-attachment:fixed}
  .app{max-width:760px;margin:0 auto;padding:14px}

  /* HUD */
  .hud{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:24px;padding:10px 18px;margin-bottom:14px;box-shadow:0 4px 0 var(--primary-soft);flex-wrap:wrap;gap:8px}
  .hud-nick{font-weight:900;color:var(--primary);font-size:15px}
  .hud-coins{font-weight:900;color:var(--orange);font-size:15px}
  .progress{display:flex;gap:6px}
  .pdot{width:32px;height:32px;border-radius:50%;background:white;border:2.5px solid var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--text-dim);box-shadow:0 2px 0 var(--primary-soft)}
  .pdot.done{background:var(--success);color:white;border-color:var(--success)}
  .pdot.active{background:var(--primary);color:white;border-color:var(--primary);transform:scale(1.15);box-shadow:0 3px 0 #FF8FA8}

  .card{background:white;border-radius:28px;padding:24px;box-shadow:0 6px 0 var(--primary-soft), 0 12px 28px rgba(255,179,199,0.2);position:relative;animation:cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
  .card::before{content:'🪁';position:absolute;top:-22px;right:-6px;font-size:44px;animation:flt 3s ease-in-out infinite}
  @keyframes flt{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-5deg)}}
  @keyframes cardIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

  h1{font-size:clamp(28px,7vw,38px);background:linear-gradient(135deg, #FFB3C7 0%, #FFA94D 50%, #FFD23F 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center;font-weight:900;letter-spacing:2px;filter:drop-shadow(0 3px 0 rgba(74,68,88,0.15))}
  h2{font-size:clamp(22px,5.5vw,28px);color:var(--primary);margin-bottom:10px;font-weight:900;text-align:center;letter-spacing:1px}

  .step-label{display:inline-block;background:var(--gold);color:white;padding:4px 14px;border-radius:14px;font-size:14px;font-weight:900;letter-spacing:1px;box-shadow:0 2px 0 #B88A1F;margin-bottom:8px}

  .story{background:#FFFEF5;border-radius:18px;padding:18px;margin:14px 0;font-size:17px;line-height:1.8;color:var(--text);font-weight:700;box-shadow:0 4px 0 var(--accent-soft);border-left:6px solid var(--accent)}
  .story strong{color:var(--orange);font-size:19px}

  .big-btn{width:100%;min-height:68px;padding:16px 24px;background:linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);color:white;border:none;font-size:20px;font-weight:900;border-radius:24px;cursor:pointer;font-family:inherit;letter-spacing:1px;box-shadow:0 5px 0 #B89BB3, 0 8px 20px rgba(255,179,199,0.4);transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1);margin-top:14px}
  .big-btn:hover{transform:translateY(-3px)}
  .big-btn:active{transform:translateY(5px);box-shadow:0 0 0 #B89BB3}
  .big-btn.gold{background:linear-gradient(135deg, var(--gold) 0%, var(--orange) 100%);box-shadow:0 5px 0 #B88A1F}
  .big-btn.ghost{background:white;color:var(--text);box-shadow:0 4px 0 var(--text-dim)}

  .input{width:100%;padding:16px 22px;background:#FFFEF7;border:3px solid var(--primary-soft);border-radius:20px;box-shadow:0 4px 0 var(--primary-soft);font-size:22px;color:var(--text);text-align:center;font-weight:800;font-family:inherit}
  .input:focus{outline:none;border-color:var(--primary);background:white;box-shadow:0 4px 0 var(--primary)}

  /* 圖形舞台 */
  .stage{background:white;border-radius:24px;padding:14px;margin:14px 0;box-shadow:inset 0 2px 6px rgba(0,0,0,0.04);border:3px solid var(--accent-soft)}
  .stage svg{width:100%;height:auto;display:block;max-height:340px}

  /* 提示框 */
  .tip{background:linear-gradient(135deg, var(--gold-soft) 0%, rgba(255,228,142,0.5) 100%);border:2px dashed var(--orange);padding:12px 16px;border-radius:16px;margin-top:10px;text-align:center;font-weight:800;color:var(--text);font-size:16px}

  /* 完成顯示 */
  .done-box{background:linear-gradient(135deg, var(--success) 0%, var(--mint) 100%);color:white;border-radius:20px;padding:16px;text-align:center;font-weight:900;font-size:18px;box-shadow:0 5px 0 #6FB68A;margin-top:14px;animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1)}
  @keyframes pop{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}

  /* 點擊邊（SVG line as button） */
  .edge-clickable{cursor:pointer;transition:all 0.2s}
  .edge-clickable:hover{filter:brightness(1.15)}
  .edge-clicked{filter:drop-shadow(0 0 8px currentColor)}

  /* 計數顯示 */
  .counter{font-size:18px;font-weight:900;color:var(--primary);text-align:center;margin-top:10px;letter-spacing:2px}

  /* Confetti */
  .confetti{position:fixed;width:14px;height:14px;top:-20px;pointer-events:none;z-index:9500;animation:fall linear forwards;border-radius:50%}
  @keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(540deg)}}

  /* Banner */
  .banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg, var(--gold), var(--primary));color:white;padding:24px 36px;border-radius:30px;font-size:30px;font-weight:900;letter-spacing:3px;box-shadow:0 8px 0 #B85C7C, 0 16px 40px rgba(0,0,0,0.3);text-shadow:0 3px 0 rgba(0,0,0,0.2);pointer-events:none;z-index:9000;animation:bnr 2.2s cubic-bezier(0.34,1.56,0.64,1) forwards}
  @keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}40%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}

  /* 分類框（Q5） */
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
  .cat-box{background:white;border-radius:18px;padding:14px;min-height:100px;text-align:center;font-weight:800;border:3px dashed;transition:all 0.2s}
  .cat-box[data-color="pink"]{border-color:#FFB3C7}
  .cat-box[data-color="blue"]{border-color:#A5D8FF}
  .cat-box[data-color="purple"]{border-color:#D0BFFF}
  .cat-box[data-color="yellow"]{border-color:#FFE066}
  .cat-box.hover{transform:scale(1.05);background:#FFFEF5}
  .cat-box.done{border-style:solid;background:var(--success);color:white}
  .cat-box .clbl{font-size:13px;margin-bottom:6px}
  .cat-box .slot{font-size:40px;min-height:48px}

  .tray{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0;padding:14px;background:#FFFEF5;border-radius:18px;border:2px dashed var(--gold)}
  .tray-item{font-size:60px;cursor:grab;transition:transform 0.2s;filter:drop-shadow(0 3px 4px rgba(0,0,0,0.15))}
  .tray-item:active{cursor:grabbing;transform:scale(1.3)}
  .tray-item.gone{display:none}

  /* 開始 screen */
  .start-screen{text-align:center;padding:24px 18px}
  .start-screen .icon{font-size:88px;animation:flt 3s ease-in-out infinite;display:inline-block}
  .start-screen .info{background:#FFFEF7;border-radius:20px;box-shadow:0 5px 0 var(--accent-soft);padding:18px;margin:18px 0;text-align:left;font-size:16px;font-weight:700;line-height:1.9}
</style>
</head>
<body>

<div class="app">

  <!-- 開始畫面 -->
  <section id="screen-start" class="card start-screen">
    <div class="icon">🪁</div>
    <h1>風箏館大冒險</h1>
    <p style="color:var(--text-dim);font-weight:700;margin-bottom:18px">4-3 預習 · 6/10 (三)</p>
    <div style="margin:18px 0">
      <label style="display:block;margin-bottom:10px;color:var(--primary);font-weight:900;font-size:17px">先輸入你的暱稱</label>
      <input id="nick-input" class="input" type="text" placeholder="例：小新、艾妲" maxlength="12">

      🎯 任務：5 個簡單探索<br>

      🎁 全部完成 → 風箏王 👑
    </div>
    <button id="start-btn" class="big-btn gold">🚀 出發！進入冬山風箏館</button>
  </section>

  <!-- 任務畫面 -->
  <section id="screen-quest" style="display:none">
    <div class="hud">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <span class="hud-nick">🪁 <span id="hud-name">小新</span></span>
        <span class="hud-coins">💰 <span id="hud-coins">0</span></span>
      </div>
      <div class="progress" id="hud-progress"></div>
    </div>
    <div class="card" id="card"></div>
  </section>

  <!-- 勝利畫面 -->
  <section id="screen-victory" style="display:none">
    <div class="card" style="text-align:center;padding:28px">
      <div style="font-size:88px;animation:flt 1.5s infinite">🏆</div>
      <h1>你是風箏王！</h1>
      <p style="margin:14px 0;color:var(--text);font-weight:700;font-size:17px">
        <strong style="color:var(--primary)" id="v-name">XXX</strong> 探索完所有風箏的秘密！
      </p>
      <div style="background:linear-gradient(135deg, var(--gold-soft), var(--primary-soft), var(--accent-soft));border-radius:24px;padding:20px;margin:18px 0;box-shadow:0 6px 0 var(--primary)">
        <div style="font-size:60px;font-weight:900;color:var(--orange);text-shadow:0 4px 0 rgba(74,68,88,0.15)">💰 <span id="v-coins">0</span></div>
        <div style="font-size:13px;color:var(--text);margin-top:4px;font-weight:800">探索金幣</div>
      </div>
      <div style="background:#FFF0F5;border-radius:18px;padding:18px;text-align:left;font-size:15px;line-height:2;color:var(--text);font-weight:600">
        <strong style="color:var(--primary);font-size:17px">🎁 你今天發現的秘密：</strong><br>
        1️⃣ <strong>鳶形</strong>＝兩組鄰邊「一樣長」<br>
        2️⃣ <strong>菱形</strong>＝四條邊都「一樣長」<br>
        3️⃣ <strong>對角線</strong>會「互相垂直」+ 「平分」
      </div>
      <div id="v-status" style="background:var(--accent-soft);color:#3676B2;padding:14px;border-radius:16px;text-align:center;font-weight:800;margin:14px 0">
        ⏳ 正在送給老師...
      </div>
      <button class="big-btn ghost" onclick="restart()">🔄 再玩一次</button>
    </div>
  </section>

</div>

<script>
var state = {nick:'', currentQ:0, coins:0, startTime:0, completed:[false,false,false,false,false]};
window.state = state;

/* ======================================================
   Q1 · 風箏館入場（故事 3 步）
   ====================================================== */
function setupQ1() {
  let step = 0;
  const card = document.getElementById('card');
  function render() {
    if (step === 0) {
      card.innerHTML = `
        <div class="step-label">步驟 1 / 3</div>
        <h2>🚪 來到冬山風箏館</h2>
        <div class="stage" style="text-align:center;padding:30px">
          <div style="font-size:120px">🏛️</div>
          <div style="font-size:18px;font-weight:800;color:var(--text);margin-top:10px">冬山風箏館</div>
        </div>
        <div class="story">
          🚄 今天小新坐火車到 <strong>宜蘭冬山</strong>！<br>
          這裡有全台灣最大的 <strong>風箏博物館</strong> 🪁<br>
          想進去看看 4 種特別的風箏嗎？
        </div>
        <button class="big-btn gold" onclick="window._next1(1)">🚪 推開大門進入！</button>
      `;
    } else if (step === 1) {
      card.innerHTML = `
        <div class="step-label">步驟 2 / 3</div>
        <h2>📜 風箏的秘密</h2>
        <div class="stage" style="text-align:center;padding:30px">
          <div style="font-size:80px">🪁 🔷 🟪 🟨</div>
          <div style="font-size:15px;font-weight:700;color:var(--text);margin-top:14px">
            鳶形 ・ 菱形 ・ 正方形 ・ 長方形
          </div>
        </div>
        <div class="story">
          ✨ 風箏的形狀是 <strong>「四邊形」</strong>！<br>
          但有 <strong>4 種特別的</strong>，每一種有自己的秘密 🔍<br>
          今天我們一起找出來吧！
        </div>
        <button class="big-btn gold" onclick="window._next1(2)">🔍 我準備好探索了！</button>
      `;
    } else if (step === 2) {
      card.innerHTML = `
        <div class="step-label">步驟 3 / 3</div>
        <h2>🎯 第 1 個發現</h2>
        <div class="stage" style="text-align:center;padding:30px">
          <div style="font-size:90px">🪁</div>
        </div>
        <div class="story">
          這就是 <strong>「鳶形」</strong>（讀作 元 形）！<br>
          看起來像 <strong>風箏</strong> 一樣 🪁<br>
          它有什麼秘密呢？
        </div>
        <div class="done-box">🎉 你完成第 1 關了！+ 30 💰</div>
        <button class="big-btn" onclick="completeAndNext(0, 30)">✨ 繼續探索鳶形 →</button>
      `;
    }
  }
  window._next1 = (s) => { step = s; render(); };
  render();
}

/* ======================================================
   Q2 · 找出鳶形「兩組鄰邊」（點擊邊配對顏色）
   ====================================================== */
function setupQ2() {
  const card = document.getElementById('card');
  let pinkClicked = new Set();
  let blueClicked = new Set();
  let phase = 1;  // 1=點粉紅，2=點藍

  function render() {
    const goal1Done = pinkClicked.size === 2;
    const goal2Done = blueClicked.size === 2;
    const allDone = goal1Done && goal2Done;

    card.innerHTML = `
      <div class="step-label">第 2 關</div>
      <h2>🌸 鳶形雙胞胎</h2>
      <div class="story">
        🪁 鳶形的秘密：「鄰邊有 <strong>兩組</strong> 一樣長」！<br>
        ${phase === 1 ? '👇 請點 <strong style="color:#FFB3C7">2 條粉紅色的邊</strong>' : (phase === 2 && !allDone ? '👇 接下來點 <strong style="color:#A5D8FF">2 條藍色的邊</strong>' : '✨ 完成！')}
      </div>
      <div class="stage">
        <svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg">
          <!-- 鳶形 ABCD：A 上、C 下、B 左、D 右 -->
          <polygon points="330,40 180,160 330,280 480,160" fill="rgba(255,179,199,0.08)" stroke="none"/>
          <!-- 4 條邊（可點） -->
          <line id="e-AB" class="edge-clickable" data-color="pink" x1="330" y1="40" x2="180" y2="160" stroke="#FFB3C7" stroke-width="8" stroke-linecap="round"/>
          <line id="e-AD" class="edge-clickable" data-color="pink" x1="330" y1="40" x2="480" y2="160" stroke="#FFB3C7" stroke-width="8" stroke-linecap="round"/>
          <line id="e-CB" class="edge-clickable" data-color="blue" x1="330" y1="280" x2="180" y2="160" stroke="#A5D8FF" stroke-width="8" stroke-linecap="round"/>
          <line id="e-CD" class="edge-clickable" data-color="blue" x1="330" y1="280" x2="480" y2="160" stroke="#A5D8FF" stroke-width="8" stroke-linecap="round"/>
          <!-- 4 頂點 -->
          <circle cx="330" cy="40" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="330" y="46" text-anchor="middle" font-size="16" font-weight="900" fill="#4A4458">A</text>
          <circle cx="180" cy="160" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="180" y="166" text-anchor="middle" font-size="16" font-weight="900" fill="#4A4458">B</text>
          <circle cx="330" cy="280" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="330" y="286" text-anchor="middle" font-size="16" font-weight="900" fill="#4A4458">C</text>
          <circle cx="480" cy="160" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="480" y="166" text-anchor="middle" font-size="16" font-weight="900" fill="#4A4458">D</text>
        </svg>
      </div>
      <div class="counter">粉紅 ${pinkClicked.size}/2 ・ 藍色 ${blueClicked.size}/2</div>
      ${allDone ? `
        <div class="done-box">🎉 找到了！<br>AB＝AD（粉紅一樣長）＋ CB＝CD（藍色一樣長）<br>這就是 <strong>「鳶形」</strong>！</div>
        <button class="big-btn" onclick="completeAndNext(1, 50)">✨ 繼續挑戰菱形 →</button>
      ` : phase === 1 && goal1Done ? `
        <div class="tip">✨ 粉紅找到了！現在 ${'<strong style="color:#A5D8FF">點 2 條藍色的邊</strong>'}</div>
      ` : ''}
    `;
    // 綁定點擊
    if (!allDone) {
      document.querySelectorAll('.edge-clickable').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.id;
          const c = el.dataset.color;
          if (phase === 1 && c === 'pink' && !pinkClicked.has(id)) {
            pinkClicked.add(id);
            el.classList.add('edge-clicked');
            if (pinkClicked.size === 2) phase = 2;
            render();
            playPing();
          } else if (phase === 2 && c === 'blue' && !blueClicked.has(id)) {
            blueClicked.add(id);
            el.classList.add('edge-clicked');
            render();
            playPing();
          } else if (c === 'blue' && phase === 1) {
            // 提示先點粉紅
            showShake(el);
          } else if (c === 'pink' && phase === 2 && pinkClicked.size === 2) {
            showShake(el);
          }
        });
      });
      // 已點過的維持高亮
      [...pinkClicked, ...blueClicked].forEach(id => document.getElementById(id)?.classList.add('edge-clicked'));
    }
  }
  render();
}

/* ======================================================
   Q3 · 菱形（4 邊都點）
   ====================================================== */
function setupQ3() {
  const card = document.getElementById('card');
  let clicked = new Set();

  function render() {
    const allDone = clicked.size === 4;
    card.innerHTML = `
      <div class="step-label">第 3 關</div>
      <h2>💎 菱形四胞胎</h2>
      <div class="story">
        💎 菱形的秘密：「<strong>四</strong> 條邊都一樣長」！<br>
        ${allDone ? '✨ 完成！' : '👇 請點 <strong style="color:#D0BFFF">所有 4 條紫色邊</strong>'}
      </div>
      <div class="stage">
        <svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg">
          <polygon points="330,30 510,160 330,290 150,160" fill="rgba(208,191,255,0.1)" stroke="none"/>
          <line id="r-AB" class="edge-clickable" x1="330" y1="30" x2="150" y2="160" stroke="#D0BFFF" stroke-width="8" stroke-linecap="round"/>
          <line id="r-AD" class="edge-clickable" x1="330" y1="30" x2="510" y2="160" stroke="#D0BFFF" stroke-width="8" stroke-linecap="round"/>
          <line id="r-CB" class="edge-clickable" x1="330" y1="290" x2="150" y2="160" stroke="#D0BFFF" stroke-width="8" stroke-linecap="round"/>
          <line id="r-CD" class="edge-clickable" x1="330" y1="290" x2="510" y2="160" stroke="#D0BFFF" stroke-width="8" stroke-linecap="round"/>
          <circle cx="330" cy="30" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="330" y="36" text-anchor="middle" font-size="16" font-weight="900" fill="#4A4458">A</text>
          <circle cx="150" cy="160" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="150" y="166" text-anchor="middle" font-size="16" font-weight="900" fill="#4A4458">B</text>
          <circle cx="330" cy="290" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="330" y="296" text-anchor="middle" font-size="16" font-weight="900" fill="#4A4458">C</text>
          <circle cx="510" cy="160" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="510" y="166" text-anchor="middle" font-size="16" font-weight="900" fill="#4A4458">D</text>
        </svg>
      </div>
      <div class="counter">已點 ${clicked.size} / 4 條邊</div>
      ${allDone ? `
        <div class="done-box">💎 菱形大師！<br>AB＝BC＝CD＝DA<br>4 條邊都一樣長 → 這就是 <strong>「菱形」</strong>！</div>
        <button class="big-btn" onclick="completeAndNext(2, 60)">✨ 探索對角線秘密 →</button>
      ` : ''}
    `;
    if (!allDone) {
      document.querySelectorAll('.edge-clickable').forEach(el => {
        el.addEventListener('click', () => {
          if (!clicked.has(el.id)) {
            clicked.add(el.id);
            el.classList.add('edge-clicked');
            render();
            playPing();
          }
        });
        if (clicked.has(el.id)) el.classList.add('edge-clicked');
      });
    }
  }
  render();
}

/* ======================================================
   Q4 · 對角線（動畫 + 觀察）
   ====================================================== */
function setupQ4() {
  const card = document.getElementById('card');
  let step = 0;  // 0=看 AC 出現, 1=看 BD 出現, 2=看 90°, 3=看平分

  function render() {
    const acVis = step >= 0;
    const bdVis = step >= 1;
    const angleVis = step >= 2;
    const halfVis = step >= 3;
    card.innerHTML = `
      <div class="step-label">第 4 關</div>
      <h2>⚡ 對角線秘密</h2>
      <div class="story">
        ${step === 0 ? '⚡ 把 <strong>對角的點連起來</strong> → 就是「對角線」！按下面看 1️⃣' :
          step === 1 ? '✨ 第 1 條對角線 <strong style="color:#FFB3C7">AC</strong> 出現了！按下面看第 2 條' :
          step === 2 ? '🌟 兩條對角線交叉的地方有個 <strong>「直角 90°」</strong>！這是秘密 1' :
          step === 3 ? '🎯 並且 <strong>O 點剛好把 BD 切成兩半</strong>（OB ＝ OD）！這是秘密 2' :
          '🏆 你發現了 2 個秘密！'
        }
      </div>
      <div class="stage">
        <svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg">
          <polygon points="330,30 510,160 330,290 150,160" fill="rgba(208,191,255,0.15)" stroke="#D0BFFF" stroke-width="3"/>
          ${acVis ? `<line x1="330" y1="30" x2="330" y2="290" stroke="#FFB3C7" stroke-width="5" stroke-linecap="round"><animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze"/></line>` : ''}
          ${bdVis ? `<line x1="150" y1="160" x2="510" y2="160" stroke="#A5D8FF" stroke-width="5" stroke-linecap="round"><animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze"/></line>` : ''}
          ${angleVis ? `
            <rect x="330" y="146" width="16" height="14" fill="none" stroke="#FF6600" stroke-width="3">
              <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze"/>
            </rect>
            <text x="360" y="148" font-size="20" font-weight="900" fill="#FF6600">90°</text>` : ''}
          ${halfVis ? `
            <circle cx="150" cy="160" r="20" fill="none" stroke="#00C853" stroke-width="3" stroke-dasharray="4 3"/>
            <circle cx="510" cy="160" r="20" fill="none" stroke="#00C853" stroke-width="3" stroke-dasharray="4 3"/>
            <text x="230" y="200" font-size="18" font-weight="900" fill="#00C853">OB</text>
            <text x="430" y="200" font-size="18" font-weight="900" fill="#00C853">＝OD</text>` : ''}
          <circle cx="330" cy="30" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="330" y="36" text-anchor="middle" font-size="16" font-weight="900">A</text>
          <circle cx="150" cy="160" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="150" y="166" text-anchor="middle" font-size="16" font-weight="900">B</text>
          <circle cx="330" cy="290" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="330" y="296" text-anchor="middle" font-size="16" font-weight="900">C</text>
          <circle cx="510" cy="160" r="14" fill="#FFE066" stroke="#4A4458" stroke-width="2.5"/><text x="510" y="166" text-anchor="middle" font-size="16" font-weight="900">D</text>
          ${bdVis ? `<circle cx="330" cy="160" r="8" fill="#FF1744" stroke="#4A4458" stroke-width="2"/><text x="345" y="155" font-size="16" font-weight="900" fill="#FF1744">O</text>` : ''}
        </svg>
      </div>
      ${step < 4 ? `
        <button class="big-btn gold" onclick="window._next4()">
          ${step === 0 ? '👀 1️⃣ 看 AC 對角線' :
            step === 1 ? '👀 2️⃣ 看 BD 對角線' :
            step === 2 ? '🔍 3️⃣ 發現秘密一' :
            '🔍 4️⃣ 發現秘密二'}
        </button>
      ` : `
        <div class="done-box">⚡ 你發現了！<br>對角線 <strong>互相垂直（90°）</strong> + <strong>互相平分</strong></div>
        <button class="big-btn" onclick="completeAndNext(3, 80)">✨ BOSS 挑戰 →</button>

  window._next4 = () => { step++; render(); playPing(); };
  render();
}

/* ======================================================
   Q5 · BOSS 拖拉分類（顏色配對）
   ====================================================== */
function setupQ5() {
  const card = document.getElementById('card');
  let count = 0;
  card.innerHTML = `
    <div class="step-label">🏆 最終挑戰</div>
    <h2>🪁 風箏分類學家</h2>
    <div class="story">
      🏆 BOSS 來了！把下面 4 個圖案 <strong>拖到顏色相同的框</strong>！<br>
      (用手指按住 → 拖到下方框框)
    </div>
    <div class="tray">
      <span class="tray-item" draggable="true" data-color="pink" title="鳶形">🪁</span>
      <span class="tray-item" draggable="true" data-color="blue" title="菱形">🔷</span>
      <span class="tray-item" draggable="true" data-color="purple" title="正方形">🟪</span>
      <span class="tray-item" draggable="true" data-color="yellow" title="長方形">🟨</span>
    </div>
    <div class="cat-grid">
      <div class="cat-box" data-color="pink"><div class="clbl">🟥 鳶形<br>（兩組鄰邊等長）</div><div class="slot"></div></div>
      <div class="cat-box" data-color="blue"><div class="clbl">🟦 菱形<br>（四邊都等長）</div><div class="slot"></div></div>
      <div class="cat-box" data-color="purple"><div class="clbl">🟪 正方形<br>（四邊等+四直角）</div><div class="slot"></div></div>
      <div class="cat-box" data-color="yellow"><div class="clbl">🟨 長方形<br>（對邊等+四直角）</div><div class="slot"></div></div>
    </div>
    <div class="counter" id="q5-counter">已分類 0 / 4</div>
    <div id="q5-done"></div>
  `;
  let dragId = null;
  document.querySelectorAll('.tray-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      dragId = item.dataset.color;
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('touchstart', e => {
      dragId = item.dataset.color;
    });
    item.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      document.querySelectorAll('.cat-box').forEach(b => b.classList.remove('hover'));
      const box = el && el.closest('.cat-box');
      if (box) box.classList.add('hover');
    }, {passive:false});
    item.addEventListener('touchend', e => {
      document.querySelectorAll('.cat-box').forEach(b => b.classList.remove('hover'));
      const t = e.changedTouches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const box = el && el.closest('.cat-box');
      if (box) tryDrop(box, item);
    });
  });
  document.querySelectorAll('.cat-box').forEach(box => {
    box.addEventListener('dragover', e => {e.preventDefault();box.classList.add('hover')});
    box.addEventListener('dragleave', () => box.classList.remove('hover'));
    box.addEventListener('drop', e => {
      e.preventDefault();
      box.classList.remove('hover');
      const item = document.querySelector(`.tray-item[data-color="${dragId}"]`);
      if (item) tryDrop(box, item);
    });
  });

  function tryDrop(box, item) {
    if (box.classList.contains('done')) return;
    if (box.dataset.color === item.dataset.color) {
      box.classList.add('done');
      box.querySelector('.slot').textContent = item.textContent;
      item.classList.add('gone');
      count++;
      document.getElementById('q5-counter').textContent = `已分類 ${count} / 4`;
      spawnConfetti(40);
      playPing();
      if (count === 4) {
        document.getElementById('q5-done').innerHTML = `
          <div class="done-box">🏆 你是風箏王！4 種特別四邊形都認識了！</div>
          <button class="big-btn gold" onclick="completeAndNext(4, 100)">🎉 完成大冒險 →</button>
        `;
      }
    } else {
      box.style.animation = 'shake 0.4s';
      setTimeout(() => box.style.animation = '', 400);
    }
  }
}

/* ======================================================
   公用函式
   ====================================================== */
function completeAndNext(idx, reward) {
  state.completed[idx] = true;
  state.coins += reward;
  showBanner(reward);
  spawnConfetti(80);
  if (idx < 4) {
    setTimeout(() => { state.currentQ = idx + 1; renderQuest(); }, 1200);
  } else {
    setTimeout(() => finish(), 1500);
  }
}

function renderQuest() {
  document.getElementById('hud-name').textContent = state.nick;
  document.getElementById('hud-coins').textContent = state.coins;
  const p = document.getElementById('hud-progress'); p.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div'); d.className = 'pdot';
    if (state.completed[i]) d.classList.add('done');
    else if (i === state.currentQ) d.classList.add('active');
    d.textContent = i + 1;
    p.appendChild(d);
  }
  const setups = [setupQ1, setupQ2, setupQ3, setupQ4, setupQ5];
  setups[state.currentQ]();
}

function showBanner(reward) {
  const b = document.createElement('div');
  b.className = 'banner';
  b.textContent = `+${reward} 💰`;
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 2200);
}

function showShake(el) {
  el.setAttribute('stroke-width', '10');
  setTimeout(() => el.setAttribute('stroke-width', '8'), 200);
}

function spawnConfetti(count = 60) {
  const colors = ['#FFB3C7','#FFE066','#A5D8FF','#95D5B2','#D0BFFF','#FFA94D'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

let audioCtx;
function playPing() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    o.start(); o.stop(audioCtx.currentTime + 0.2);
  } catch(e) {}
}

function finish() {
  document.getElementById('v-name').textContent = state.nick;
  document.getElementById('v-coins').textContent = state.coins;
  document.getElementById('screen-quest').style.display = 'none';
  document.getElementById('screen-victory').style.display = '';
  spawnConfetti(200);
  setTimeout(() => spawnConfetti(150), 500);
  setTimeout(() => spawnConfetti(150), 1000);
  submitToFirebase();
}

async function submitToFirebase() {
  const payload = {
    nick: state.nick,
    hwId: 'special_quad_explore_0610',
    completedAll: state.completed.every(Boolean),
    completed: state.completed,
    coins: state.coins,
    elapsedSec: Math.round((Date.now() - state.startTime) / 1000),
    submittedAt: new Date().toISOString(),
  };
  try {
    await firebase.database().ref('submissions/special_quad_explore_0610').push(payload);
    const s = document.getElementById('v-status');
    s.innerHTML = '✅ 探索已送給老師！';
    s.style.background = 'var(--success)';
    s.style.color = 'white';
  } catch (err) {
    document.getElementById('v-status').innerHTML = '⚠️ 送出失敗，請告訴老師你的暱稱 + 金幣 ' + state.coins;
  }
}

function restart() {
  state.nick = ''; state.currentQ = 0; state.coins = 0;
  state.startTime = 0; state.completed = [false,false,false,false,false];
  document.getElementById('nick-input').value = '';
  document.getElementById('screen-victory').style.display = 'none';
  document.getElementById('screen-start').style.display = '';
}

document.getElementById('start-btn').addEventListener('click', () => {
  const v = document.getElementById('nick-input').value.trim();
  if (!v) { document.getElementById('nick-input').focus(); return; }
  state.nick = v; state.startTime = Date.now();
  document.getElementById('screen-start').style.display = 'none';
  document.getElementById('screen-quest').style.display = '';
  renderQuest();
});

document.getElementById('nick-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('start-btn').click();
});

// shake animation
const se = document.createElement('style');
se.textContent = `@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}`;
document.head.appendChild(se);
</script>
