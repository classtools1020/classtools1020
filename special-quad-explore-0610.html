<script>
'use strict';

const FB_PATH_REF = 'submissions/special_quad_explore_0610';

const state = {
  nick: '',

  currentQ: 0,
  coins: 0,
  completed: [false, false, false, false, false],

const TASKS = [
  {
    title: '🪁 冬山風箏館：拖風箏到展示位',
    mission: '請把 3 個風箏「拖到」上方的展示框！每個展示位置都要有風箏喔～',

    mission: '繼續拖 4 個頂點，目標：4 條邊都相等（誤差 ≤ 0.3）',

    setup: setupQ5, check: checkQ5, reward: 120,

];

/* ============ Drag helper ============ */
function makeDraggable(el, onMove) {
  let dragging = false, startPt = null, startT = null;
  function getPos(e) {
    const svg = el.ownerSVGElement;
    const pt = svg.createSVGPoint();
    const evt = e.touches ? e.touches[0] : e;
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function getTransform() {
    const t = el.getAttribute('transform') || 'translate(0,0)';
    const m = t.match(/translate\(([^,)\s]+)[\s,]+([^)]+)\)/);
    return m ? {x:parseFloat(m[1]),y:parseFloat(m[2])} : {x:0,y:0};
  }
  function onStart(e){
    e.preventDefault();
    dragging = true;
    startPt = getPos(e);
    startT = getTransform();
  }
  function onMv(e){
    if(!dragging) return;
    e.preventDefault();
    const p = getPos(e);
    const nx = startT.x + (p.x - startPt.x);
    const ny = startT.y + (p.y - startPt.y);
    el.setAttribute('transform', `translate(${nx}, ${ny})`);
    if(onMove) onMove(nx, ny);
  }
  function onEnd(){ dragging = false; }
  el.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMv);
  window.addEventListener('mouseup', onEnd);
  el.addEventListener('touchstart', onStart, {passive:false});
  window.addEventListener('touchmove', onMv, {passive:false});
  window.addEventListener('touchend', onEnd);
}

/* ============ Q1: 風箏拖到展示位 ============ */
function setupQ1() {
  const card = document.getElementById('quest-card');
  const t = TASKS[0];
  card.innerHTML = `
    <h2>${t.title}</h2>
    <div class="task-mission">${t.mission}</div>
    <div class="stage">
      <svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg">
        <!-- 3 個展示位（虛線框） -->
        <rect x="80" y="40" width="120" height="100" rx="14" fill="#FFFEF5" stroke="#FFB3C7" stroke-width="3" stroke-dasharray="6 4"/>
        <text x="140" y="98" text-anchor="middle" fill="#FFB3C7" font-size="18" font-weight="900">展示 1</text>
        <rect x="270" y="40" width="120" height="100" rx="14" fill="#FFFEF5" stroke="#A5D8FF" stroke-width="3" stroke-dasharray="6 4"/>
        <text x="330" y="98" text-anchor="middle" fill="#A5D8FF" font-size="18" font-weight="900">展示 2</text>
        <rect x="460" y="40" width="120" height="100" rx="14" fill="#FFFEF5" stroke="#FFE066" stroke-width="3" stroke-dasharray="6 4"/>
        <text x="520" y="98" text-anchor="middle" fill="#D4A800" font-size="18" font-weight="900">展示 3</text>
        <!-- 3 個風箏（可拖） -->
        <g id="kite-a" class="draggable" transform="translate(80, 200)">
          <text font-size="68" text-anchor="middle">🪁</text>
        </g>
        <g id="kite-b" class="draggable" transform="translate(280, 200)">
          <text font-size="68" text-anchor="middle">🪁</text>
        </g>
        <g id="kite-c" class="draggable" transform="translate(480, 200)">
          <text font-size="68" text-anchor="middle">🪁</text>
        </g>
      </svg>
    </div>
    <div class="goal-box" id="q1-goal">🎯 把 3 個風箏都拖到展示位！(0 / 3)</div>
    <div class="hint-box">💡 提示：用手指（或滑鼠）按住 🪁，慢慢拖到上面的虛線框。冬山風箏館要開幕囉！</div>
  `;
  // 設定 draggable
  ['kite-a','kite-b','kite-c'].forEach(id => {
    const el = document.getElementById(id);
    makeDraggable(el, () => checkQ1());
  });
}

function inBox(el, bx, by, bw, bh) {
  const t = el.getAttribute('transform').match(/translate\(([^,)\s]+)[\s,]+([^)]+)\)/);
  const x = parseFloat(t[1]), y = parseFloat(t[2]);
  // 風箏的 emoji 在 (x, y) 是中心
  return x >= bx && x <= bx + bw && y >= by && y <= by + bh;
}

function dist(p1, p2) {
  return Math.sqrt(Math.pow(p1.x-p2.x,2) + Math.pow(p1.y-p2.y,2)) / 30;  // 1 公分 = 30 px
}

  const {A, C, B, D} = state._q2;

  document.getElementById('q2-diag-ac').setAttribute('x1', A.x); document.getElementById('q2-diag-ac').setAttribute('y1', A.y);
  document.getElementById('q2-diag-ac').setAttribute('x2', C.x); document.getElementById('q2-diag-ac').setAttribute('y2', C.y);

function drawQ4() {
  const {A, C, B, D} = state._q4;
  document.getElementById('q4-shape').setAttribute('points', `${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y} ${D.x},${D.y}`);
  document.getElementById('q4-diag-ac').setAttribute('x1', A.x); document.getElementById('q4-diag-ac').setAttribute('y1', A.y);
  document.getElementById('q4-diag-ac').setAttribute('x2', C.x); document.getElementById('q4-diag-ac').setAttribute('y2', C.y);
  document.getElementById('q4-diag-bd').setAttribute('x1', B.x); document.getElementById('q4-diag-bd').setAttribute('y1', B.y);
  document.getElementById('q4-diag-bd').setAttribute('x2', D.x); document.getElementById('q4-diag-bd').setAttribute('y2', D.y);
  // 兩線交點 O
  const O = lineIntersect(A, C, B, D);
  if (O) {
    document.getElementById('q4-O').setAttribute('cx', O.x);
    document.getElementById('q4-O').setAttribute('cy', O.y);
    document.getElementById('q4-O-lbl').setAttribute('x', O.x+10);
    document.getElementById('q4-O-lbl').setAttribute('y', O.y+5);
    document.getElementById('q4-O-lbl').textContent = 'O';
  }
  // 角度
  const v1 = {x:C.x-A.x, y:C.y-A.y};
  const v2 = {x:D.x-B.x, y:D.y-B.y};
  const dot = v1.x*v2.x + v1.y*v2.y;
  const m1 = Math.sqrt(v1.x*v1.x+v1.y*v1.y), m2 = Math.sqrt(v2.x*v2.x+v2.y*v2.y);
  let cos = dot/(m1*m2); cos = Math.max(-1,Math.min(1,cos));
  let ang = Math.acos(Math.abs(cos)) * 180 / Math.PI;
  document.getElementById('q4-val-angle').textContent = ang.toFixed(0) + '°';
  const perpOk = Math.abs(ang-90) <= 6;
  document.getElementById('q4-val-perp').textContent = perpOk ? '✓' : '✗';
  document.getElementById('q4-card-perp').classList.toggle('match', perpOk);
  // O 是否平分 BD？
  let bisectOk = false;
  if (O) {
    const OB = dist(O, B), OD = dist(O, D);
    bisectOk = Math.abs(OB-OD) <= 0.3;

  checkQ4(perpOk, bisectOk);
}

function lineIntersect(p1, p2, p3, p4) {
  const x1=p1.x, y1=p1.y, x2=p2.x, y2=p2.y, x3=p3.x, y3=p3.y, x4=p4.x, y4=p4.y;
  const d = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
  if (Math.abs(d) < 0.001) return null;
  const t = ((x1-x3)*(y3-y4) - (y1-y3)*(x3-x4)) / d;
  return {x:x1+t*(x2-x1), y:y1+t*(y2-y1)};
}

function checkQ4(perpOk, bisectOk) {
  const goal = document.getElementById('q4-goal');
  if (perpOk && bisectOk) {
    if (!state.completed[3]) {
      state.completed[3] = true;
      completeTask(3, '⚡ 對角線秘密 GET！');
    }
    goal.classList.add('cleared');
    goal.innerHTML = '✅ 找到了！對角線「垂直」+「平分」！這是<strong>鳶形/菱形</strong>的特殊性質！';
  } else {
    goal.innerHTML = '🎯 目標：AC ⊥ BD（' + (perpOk?'✓':'快了！') + '）+ OB = OD（' + (bisectOk?'✓':'O 點要在中間') + '）';
  }
}

/* ============ Q5: BOSS 風箏分類 ============ */
function setupQ5() {
  const card = document.getElementById('quest-card');
  const t = TASKS[4];
  card.innerHTML = `
    <h2>${t.title}</h2>
    <div class="task-mission">${t.mission}</div>
    <div class="kite-tray" id="q5-tray">
      <span class="kite-item" draggable="true" data-id="kite1" data-type="kite" title="鳶形">🪁</span>
      <span class="kite-item" draggable="true" data-id="kite2" data-type="rhombus" title="菱形">🔷</span>
      <span class="kite-item" draggable="true" data-id="kite3" data-type="square" title="正方形">🟪</span>
      <span class="kite-item" draggable="true" data-id="kite4" data-type="rect" title="長方形">🟨</span>
    </div>
    <div class="category-grid">
      <div class="category-box" data-accept="kite">
        <div class="label">🟥 鳶形（兩組鄰邊等長）</div>
        <div class="slot"></div>
      </div>
      <div class="category-box" data-accept="rhombus">
        <div class="label">🟦 菱形（四邊都等長）</div>
        <div class="slot"></div>
      </div>
      <div class="category-box" data-accept="square">
        <div class="label">🟪 正方形（四邊等 + 四角直）</div>
        <div class="slot"></div>
      </div>
      <div class="category-box" data-accept="rect">
        <div class="label">🟨 長方形（對邊等 + 四角直）</div>
        <div class="slot"></div>
      </div>
    </div>
    <div class="goal-box" id="q5-goal">🎯 把 4 個風箏拖到正確分類！(0 / 4)</div>
    <div class="hint-box">💡 <strong>提示</strong>：每個 emoji 顏色都對應一個分類框，顏色配對好就是答案！</div>
  `;
  // HTML5 drag and drop
  let dragId = null;
  document.querySelectorAll('.kite-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      dragId = item.dataset.id;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    // Touch fallback
    let touchTarget = null;
    item.addEventListener('touchstart', e => {
      dragId = item.dataset.id;
      touchTarget = item;
      item.classList.add('dragging');
    });
    item.addEventListener('touchmove', e => {
      e.preventDefault();
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      document.querySelectorAll('.category-box').forEach(b => b.classList.remove('hover'));
      const box = el && el.closest('.category-box');
      if (box) box.classList.add('hover');
    }, {passive:false});
    item.addEventListener('touchend', e => {
      item.classList.remove('dragging');
      const touch = e.changedTouches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const box = el && el.closest('.category-box');
      document.querySelectorAll('.category-box').forEach(b => b.classList.remove('hover'));
      if (box) tryDropQ5(box, item);
    });
  });
  document.querySelectorAll('.category-box').forEach(box => {
    box.addEventListener('dragover', e => {e.preventDefault(); box.classList.add('hover')});
    box.addEventListener('dragleave', () => box.classList.remove('hover'));
    box.addEventListener('drop', e => {
      e.preventDefault();
      box.classList.remove('hover');
      if (!dragId) return;
      const item = document.querySelector(`.kite-item[data-id="${dragId}"]`);
      tryDropQ5(box, item);
    });
  });
}

function tryDropQ5(box, item) {
  if (box.classList.contains('cleared')) return;  // 已經被佔
  if (box.dataset.accept === item.dataset.type) {
    // 正確配對
    box.classList.add('cleared');
    const slot = box.querySelector('.slot');
    slot.textContent = item.textContent;
    item.style.display = 'none';
    state._q5_count = (state._q5_count || 0) + 1;
    spawnConfetti(40);
    updateQ5();
  } else {
    // 錯誤 — 搖晃
    box.style.animation = 'shake 0.4s';
    setTimeout(() => box.style.animation = '', 400);
  }
}

function updateQ5() {
  const count = state._q5_count || 0;
  const goal = document.getElementById('q5-goal');
  if (count === 4) {
    if (!state.completed[4]) {
      state.completed[4] = true;
      completeTask(4, '🏆 風箏分類學家！');
    }
    goal.classList.add('cleared');
    goal.innerHTML = '✅ 風箏王！4 種四邊形分類完成！';
  } else {
    goal.innerHTML = `🎯 把 4 個風箏拖到正確分類！(${count} / 4)`;
  }
}

/* ============ Complete + 過關 ============ */
function completeTask(idx, msg) {
  state.coins += TASKS[idx].reward;
  document.getElementById('hud-coins').textContent = state.coins;
  showBanner(msg);
  spawnConfetti(80);
  renderProgress();
  // 自動下一關（2 秒後）
  setTimeout(() => {
    if (idx < TASKS.length - 1) {
      const nb = document.createElement('button');
      nb.className = 'btn btn-gold';
      nb.style.width = '100%';
      nb.style.marginTop = '14px';
      nb.textContent = '✨ 進入下一關 →';
      nb.onclick = () => { state.currentQ = idx + 1; renderQuest(); };
      const card = document.getElementById('quest-card');
      if (!card.querySelector('.next-btn-injected')) {
        nb.classList.add('next-btn-injected');
        card.appendChild(nb);
      }
    } else {
      // 最後一關 → 勝利
      setTimeout(() => finish(), 2000);
    }
  }, 1500);
}

function showBanner(msg) {
  const b = document.createElement('div');
  b.className = 'reveal-banner';
  b.textContent = msg;
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 2200);
}

function spawnConfetti(count = 80) {
  const colors = ['#FFB3C7', '#FFE066', '#A5D8FF', '#95D5B2', '#D0BFFF', '#FFA94D'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

function renderProgress() {
  const c = document.getElementById('hud-progress'); c.innerHTML = '';
  for (let i = 0; i < TASKS.length; i++) {
    const d = document.createElement('div'); d.className = 'pdot';
    if (state.completed[i]) d.classList.add('done');
    else if (i === state.currentQ) d.classList.add('active');
    d.textContent = i + 1;
    c.appendChild(d);
  }
}

function renderQuest() {
  document.getElementById('hud-name').textContent = state.nick;
  document.getElementById('hud-coins').textContent = state.coins;
  renderProgress();
  const task = TASKS[state.currentQ];
  task.setup();
}

function finish() {
  document.getElementById('vic-name').textContent = state.nick;
  document.getElementById('vic-coins').textContent = state.coins;
  document.getElementById('screen-quest').style.display = 'none';
  document.getElementById('screen-victory').style.display = '';
  spawnConfetti(200);
  setTimeout(() => spawnConfetti(150), 500);
  setTimeout(() => spawnConfetti(150), 1000);
  // Submit to Firebase
  submitToFirebase();
}

async function submitToFirebase() {
  const payload = {
    nick: state.nick,
    hwId: 'special_quad_explore_0610',
    completedAll: state.completed.every(Boolean),
    completed: state.completed,
    coins: state.coins,
    elapsedSec: Math.round((Date.now() - state.startTime) / 1000),
    submittedAt: new Date().toISOString(),
  };
  try {
    await firebase.database().ref(FB_PATH_REF).push(payload);
    document.getElementById('vic-status').innerHTML = '✅ 探索已送到老師後台！';
    document.getElementById('vic-status').style.background = 'var(--success-soft)';
    document.getElementById('vic-status').style.color = '#3E8E5E';
  } catch (err) {
    document.getElementById('vic-status').innerHTML = '⚠️ 送出失敗，請告訴老師你的暱稱和金幣 ' + state.coins;
    document.getElementById('vic-status').style.background = 'var(--primary-soft)';
  }
}

function restart() {
  state.nick = ''; state.startTime = 0; state.currentQ = 0; state.coins = 0;
  state.completed = [false,false,false,false,false];
  document.getElementById('nick-input').value = '';
  document.getElementById('screen-victory').style.display = 'none';
  document.getElementById('screen-start').style.display = '';
}

document.getElementById('start-btn').addEventListener('click', () => {
  const v = document.getElementById('nick-input').value.trim();
  if (!v) { document.getElementById('nick-input').focus(); return; }
  state.nick = v; state.startTime = Date.now();
  document.getElementById('screen-start').style.display = 'none';
  document.getElementById('screen-quest').style.display = '';
  renderQuest();
});

document.getElementById('nick-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('start-btn').click();
});

// shake keyframes
const styleEl = document.createElement('style');
styleEl.textContent = `
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
`;
document.head.appendChild(styleEl);
</script>
