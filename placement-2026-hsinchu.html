let activeGroup = 'all', activeType = 'all', searchQuery = '';

function render() {
  const list = document.getElementById('schoolsList');
  const filtered = SCHOOLS.map(school => {
    if (activeType !== 'all' && school.type !== activeType) return null;
    let depts = school.depts;
    if (activeGroup !== 'all') depts = depts.filter(d => d.group === activeGroup);
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const schoolMatch = school.name.toLowerCase().includes(q);
      const deptMatch = depts.some(d => (d.name + d.group).toLowerCase().includes(q));
      if (!schoolMatch && !deptMatch) return null;
      if (!schoolMatch) depts = depts.filter(d => (d.name + d.group).toLowerCase().includes(q));
    }
    if (depts.length === 0) return null;
    return { ...school, depts };
  }).filter(Boolean);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">沒有符合條件的學校或科系</div>';
    return;
  }

  list.innerHTML = filtered.map(school => {
    const total = school.depts.reduce((s, d) => s + d.quota, 0);
    return `
      <div class="school-card">
        <div class="school-header">
          <div>
            <div class="school-name">${school.name}</div>
            <div style="font-size:.78em;color:#999;margin-top:2px">共 ${total} 名額 · ${school.depts.length} 個科別</div>
          </div>
          <div class="school-type type-${school.type}">${school.type}</div>
        </div>
        ${school.depts.map(d => `
          <div class="dept">
            <div class="dept-info">
              <div class="dept-group">${d.group}</div>
              <div class="dept-name">${d.name}${d.tag ? `<span class="dept-tag">[${d.tag}]</span>` : ''}</div>
            </div>
            <div class="dept-quota">${d.quota}</div>
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
}

document.getElementById('groupFilter').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#groupFilter .chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  activeGroup = e.target.dataset.group;
  render();
});
document.getElementById('typeFilter').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#typeFilter .chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  activeType = e.target.dataset.type;
  render();
});
document.getElementById('searchBox').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

render();
</script>
</body>
</html>
