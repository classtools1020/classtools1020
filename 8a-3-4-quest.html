<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>等腰王者 · 段考衝刺 · 8A 數學</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --c-perp: #FF6B9D;
  --c-bisect: #00BCD4;
  --c-equal: #B967FF;
  --c-right: #FF3B30;
  --c-bg-1: #0a0a1f;
  --c-bg-2: #1a1a3e;
  --c-bg-3: #2d1a4d;
  --c-gold: #FFD700;
  --c-bronze: #CD7F32;
  --c-silver: #C0C0C0;
  --c-diamond: #B9F2FF;
}
html, body {
  font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  background: linear-gradient(135deg, var(--c-bg-1) 0%, var(--c-bg-2) 50%, var(--c-bg-3) 100%);
  color: #fff;
  min-height: 100vh;
  min-height: 100dvh;
  user-select: none;
  -webkit-user-select: none;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-image:
    radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 60% 70%, rgba(255,107,157,0.6), transparent),
    radial-gradient(2px 2px at 40% 80%, rgba(0,188,212,0.5), transparent),
    radial-gradient(1px 1px at 80% 20%, rgba(185,103,255,0.6), transparent),
    linear-gradient(135deg, #0a0a1f 0%, #1a1a3e 50%, #2d1a4d 100%);
}

.wrap { max-width: 720px; width: 100%; }

/* ===== 入口 ===== */
.cover { text-align: center; padding: 30px 16px; animation: fadeUp .6s ease-out; }
.cover .badge-bg-text {
  font-size: 0.9rem; color: var(--c-gold); letter-spacing: 4px;
  font-weight: 700; margin-bottom: 6px;
}
.cover h1 {
  font-size: 2.6rem;
  font-weight: 900;
  margin-bottom: 8px;
  background: linear-gradient(90deg, var(--c-perp), var(--c-bisect), var(--c-equal));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -1px;
  text-shadow: 0 0 30px rgba(255,107,157,.4);
  line-height: 1.1;
}
.cover .sub { font-size: 1.05rem; color: #aab; margin-bottom: 22px; }
.cover .ranks-preview {
  display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 22px;
}
.cover .rank-chip {
  padding: 6px 12px; border-radius: 50px; font-size: .82rem;
  font-weight: 800; letter-spacing: 1px; opacity: 0.7;
}
.r-bronze { background: rgba(205,127,50,.2); color: #d49a5c; border: 1px solid rgba(205,127,50,.4); }
.r-silver { background: rgba(192,192,192,.2); color: #d8d8d8; border: 1px solid rgba(192,192,192,.4); }
.r-gold { background: rgba(255,215,0,.2); color: var(--c-gold); border: 1px solid rgba(255,215,0,.4); }
.r-diamond { background: rgba(185,242,255,.2); color: var(--c-diamond); border: 1px solid rgba(185,242,255,.4); }
.r-king { background: linear-gradient(135deg, rgba(255,107,157,.3), rgba(185,103,255,.3)); color: #fff; border: 1px solid rgba(255,255,255,.4); }

.cover .start-btn {
  background: linear-gradient(135deg, var(--c-perp), var(--c-equal));
  color: white; border: none;
  padding: 22px 50px; font-size: 1.5rem; font-weight: 900;
  font-family: inherit; border-radius: 60px; cursor: pointer;
  box-shadow: 0 8px 24px rgba(255,107,157,.4), inset 0 -3px 0 rgba(0,0,0,.2);
  letter-spacing: 2px; transition: transform .15s; animation: pulse 1.6s infinite;
}
.cover .start-btn:active { transform: scale(.96); }
@keyframes pulse {
  0%, 100% { box-shadow: 0 8px 24px rgba(255,107,157,.4), inset 0 -3px 0 rgba(0,0,0,.2); }
  50%      { box-shadow: 0 8px 36px rgba(255,107,157,.7), inset 0 -3px 0 rgba(0,0,0,.2); }
}
.cover .hint { margin-top: 18px; color: #889; font-size: .88rem; line-height: 1.6; }

/* ===== HUD ===== */
.hud {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 12px 14px;
  background: rgba(0,0,0,.4);
  border: 2px solid rgba(255,255,255,.08);
  border-radius: 16px;
  margin-bottom: 14px;
  font-weight: 800;
}
.hud .stage { font-size: .98rem; color: var(--c-gold); flex-shrink: 0; }
.hud .combo { color: var(--c-bisect); font-size: 1rem; }
.hud .combo.hot { color: var(--c-perp); animation: hotPulse .5s; }
@keyframes hotPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
.hud .coins { color: var(--c-gold); font-size: 1.05rem; }

.stages-bar { display: flex; gap: 5px; margin-bottom: 16px; }
.stage-dot { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); transition: all .3s; }
.stage-dot.active { background: linear-gradient(90deg, var(--c-perp), var(--c-bisect)); box-shadow: 0 0 8px var(--c-perp); }
.stage-dot.done { background: var(--c-gold); }

/* ===== 題目卡 ===== */
.q-card {
  background: rgba(255,255,255,.06);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255,255,255,.12);
  border-radius: 22px; padding: 24px 22px;
  margin-bottom: 14px;
  animation: fadeUp .4s ease-out;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.boss-tag {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, var(--c-perp), var(--c-equal));
  color: white; padding: 8px 16px; border-radius: 50px;
  font-size: .92rem; font-weight: 900; letter-spacing: 1px;
  margin-bottom: 14px;
  box-shadow: 0 4px 14px rgba(255,107,157,.3);
}
.q-emoji { font-size: 2.4rem; margin-bottom: 4px; }
.q-title {
  font-size: 1.35rem; font-weight: 900;
  margin-bottom: 14px; line-height: 1.55; color: #fff;
}
.q-figure {
  display: block; margin: 12px auto 14px;
  max-width: 280px; width: 100%;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px; padding: 14px;
}
.q-hint {
  color: #aac; font-size: .92rem; margin-bottom: 16px;
  font-style: italic; padding-left: 8px; border-left: 3px solid var(--c-bisect);
  padding: 10px 14px; background: rgba(0,188,212,.08); border-radius: 8px;
}

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  background: rgba(255,255,255,.05);
  border: 2px solid rgba(255,255,255,.18);
  padding: 14px 16px; border-radius: 14px;
  font-size: 1.1rem; color: #fff;
  cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  transition: all .18s; font-family: inherit;
  text-align: left; min-height: 60px;
  font-weight: 600; line-height: 1.4; width: 100%;
}
.option:active { transform: scale(.98); }
.option .letter {
  width: 38px; height: 38px; flex-shrink: 0;
  background: rgba(255,255,255,.1);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 1.05rem;
}
.option.correct {
  background: linear-gradient(135deg, rgba(34,197,94,.35), rgba(34,197,94,.18));
  border-color: #22c55e; animation: correctPop .5s;
}
.option.correct .letter { background: #22c55e; }
.option.wrong {
  background: linear-gradient(135deg, rgba(239,68,68,.35), rgba(239,68,68,.18));
  border-color: #ef4444; animation: shake .4s;
}
.option.wrong .letter { background: #ef4444; }
@keyframes correctPop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

.feedback {
  margin-top: 14px; padding: 14px 16px;
  border-radius: 12px; font-weight: 700;
  text-align: center; font-size: 1rem;
  display: none; animation: fadeUp .3s ease-out;
  line-height: 1.55;
}
.feedback.show { display: block; }
.feedback.ok { background: rgba(34,197,94,.2); color: #4ade80; border: 1px solid rgba(34,197,94,.4); }
.feedback.bad { background: rgba(239,68,68,.2); color: #f87171; border: 1px solid rgba(239,68,68,.4); }
.feedback .reward { font-size: 1.1rem; color: var(--c-gold); margin-top: 6px; font-weight: 900; }

.next-btn {
  margin-top: 12px; width: 100%;
  background: linear-gradient(135deg, var(--c-bisect), var(--c-equal));
  color: white; border: none;
  padding: 18px; font-size: 1.2rem; font-weight: 900;
  border-radius: 50px; cursor: pointer; font-family: inherit;
  display: none;
  box-shadow: 0 6px 18px rgba(0,188,212,.4);
}
.next-btn.show { display: block; animation: fadeUp .3s; }
.next-btn:active { transform: scale(.97); }

/* level up flash */
.level-up-overlay {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, rgba(255,107,157,.95), rgba(185,103,255,.95));
  display: none; flex-direction: column; align-items: center; justify-content: center;
  z-index: 9998; animation: levelUpFlash .6s;
}
.level-up-overlay.show { display: flex; }
@keyframes levelUpFlash {
  from { opacity: 0; transform: scale(.6); }
  to { opacity: 1; transform: scale(1); }
}
.level-up-overlay .lv-text {
  font-size: 3rem; font-weight: 900; color: white;
  text-shadow: 0 0 30px rgba(255,255,255,.6);
  letter-spacing: 4px; margin-bottom: 12px;
}
.level-up-overlay .lv-sub { color: white; font-size: 1.4rem; font-weight: 700; }

/* ===== 通關 ===== */
.victory { text-align: center; padding: 24px 16px; animation: fadeUp .8s ease-out; }
.victory h1 {
  font-size: 2.4rem; font-weight: 900;
  background: linear-gradient(90deg, var(--c-gold), var(--c-perp), var(--c-bisect));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; letter-spacing: -1px; margin-bottom: 12px;
  animation: rainbow 3s infinite;
}
@keyframes rainbow { 0%, 100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(60deg); } }
.victory .crown { font-size: 4.5rem; margin-bottom: 12px; animation: bounce 1.4s infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.rank-card {
  display: inline-block; max-width: 100%;
  background: linear-gradient(135deg, rgba(255,215,0,.2), rgba(255,107,157,.2));
  border: 2px solid var(--c-gold);
  padding: 20px 30px; border-radius: 24px; margin: 14px 0;
  position: relative; overflow: hidden;
}
.rank-card::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 50%, rgba(255,215,0,.15), transparent 60%);
  pointer-events: none;
}
.rank-card .label { font-size: .92rem; color: var(--c-gold); margin-bottom: 6px; letter-spacing: 2px; font-weight: 700; }
.rank-card .name { font-size: 1.85rem; font-weight: 900; color: white; letter-spacing: 1px; }

.stats { display: flex; justify-content: center; gap: 12px; margin: 18px 0; flex-wrap: wrap; }
.stat {
  background: rgba(255,255,255,.06);
  padding: 12px 18px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,.12);
  min-width: 96px;
}
.stat .num { font-size: 1.5rem; font-weight: 900; color: var(--c-gold); }
.stat .lab { font-size: .78rem; color: #aab; margin-top: 2px; }

.action-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.action-row .act {
  flex: 1; min-width: 140px;
  padding: 14px 18px; border-radius: 14px;
  border: 2px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.06);
  color: #fff; font-weight: 800; font-size: 1rem;
  cursor: pointer; font-family: inherit;
  transition: all .15s;
  text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.action-row .act:active { transform: scale(.97); }
.action-row .act.primary {
  background: linear-gradient(135deg, var(--c-perp), var(--c-equal));
  border-color: transparent;
  box-shadow: 0 6px 18px rgba(255,107,157,.3);
}
.action-row .copied {
  background: rgba(34,197,94,.3); border-color: #22c55e;
}
.victory .restart {
  margin-top: 14px;
  background: rgba(255,255,255,.05);
  color: white; border: 1px solid rgba(255,255,255,.15);
  padding: 12px 24px; font-size: .92rem; font-weight: 600;
  border-radius: 50px; cursor: pointer; font-family: inherit;
}

/* 名字輸入 */
.name-input-wrap {
  background: rgba(0,0,0,.4);
  border: 2px solid rgba(255,255,255,.1);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 14px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.name-input-wrap label { color: var(--c-gold); font-weight: 800; }
.name-input-wrap input {
  flex: 1; min-width: 130px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.15);
  color: white;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 16px; font-family: inherit;
  min-height: 44px;
}
.name-input-wrap input:focus { outline: none; border-color: var(--c-perp); background: rgba(255,255,255,.1); }

/* 煙火 */
#fireworks { position: fixed; inset: 0; pointer-events: none; z-index: 9999; display: none; }

/* SVG 三角形圖形顏色 */
.tri-line { stroke: #fff; stroke-width: 2; fill: none; }
.tri-fill { fill: url(#triGradPink); stroke: var(--c-perp); stroke-width: 2.5; filter: drop-shadow(0 4px 12px rgba(255,107,157,.25)); }
.tri-equal { fill: url(#triGradTeal); stroke: var(--c-bisect); stroke-width: 2.5; filter: drop-shadow(0 4px 12px rgba(0,188,212,.25)); }
.tri-bad { fill: rgba(255,255,255,.04); stroke: rgba(255,255,255,.35); stroke-width: 2; stroke-dasharray: 5 3; }
.tri-tag { fill: #fff; font-size: 14px; font-weight: 700; }
.tri-tick { stroke: var(--c-gold); stroke-width: 3; stroke-linecap: round; }

/* === 解題動畫面板 === */
.solution-panel {
  margin-top: 16px;
  padding: 18px 18px 22px;
  background: linear-gradient(135deg, rgba(0,188,212,.12), rgba(185,103,255,.12));
  border-radius: 16px;
  border: 2px solid rgba(0,188,212,.35);
  display: none;
  animation: panelIn .4s ease-out;
}
.solution-panel.show { display: block; }
@keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.sol-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 1rem; color: var(--c-bisect); font-weight: 800;
  letter-spacing: 1px; margin-bottom: 12px;
}
.sol-replay {
  background: rgba(0,188,212,.2); color: var(--c-bisect);
  border: 1px solid rgba(0,188,212,.4); border-radius: 50px;
  padding: 4px 12px; font-size: .82rem; cursor: pointer; font-family: inherit;
}
.sol-replay:active { transform: scale(.95); }

.sol-steps { display: flex; flex-direction: column; gap: 10px; }
.sol-step {
  background: rgba(255,255,255,.04);
  border-left: 3px solid var(--c-bisect);
  padding: 10px 14px; border-radius: 0 8px 8px 0;
  color: #ddd; font-size: .98rem;
  opacity: 0;
}
.sol-panel.playing .sol-step {
  animation: solStepIn .5s ease-out forwards;
}
.sol-panel.playing .sol-step:nth-child(1) { animation-delay: .15s; border-color: var(--c-perp); }
.sol-panel.playing .sol-step:nth-child(2) { animation-delay: .85s; border-color: var(--c-bisect); }
.sol-panel.playing .sol-step:nth-child(3) { animation-delay: 1.55s; border-color: var(--c-equal); }
.sol-panel.playing .sol-step:nth-child(4) { animation-delay: 2.25s; border-color: var(--c-gold); }
.sol-panel.playing .sol-step:nth-child(5) { animation-delay: 2.95s; border-color: var(--c-perp); }
@keyframes solStepIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
.sol-step b { color: var(--c-gold); font-weight: 800; }
.sol-step .eq { display: block; margin-top: 4px; font-size: 1.1rem; color: #fff; font-family: 'Consolas', 'Menlo', monospace; }

.sol-svg { display: block; margin: 0 auto 14px; max-width: 320px; width: 100%; }

/* SVG animated elements */
.anim-fade-in { opacity: 0; animation: animFadeIn .6s ease-out forwards; }
.anim-fade-in.d1 { animation-delay: .15s; }
.anim-fade-in.d2 { animation-delay: .85s; }
.anim-fade-in.d3 { animation-delay: 1.55s; }
.anim-fade-in.d4 { animation-delay: 2.25s; }
.anim-fade-in.d5 { animation-delay: 2.95s; }
@keyframes animFadeIn { to { opacity: 1; } }
.anim-pulse { animation: animPulse 1.2s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes animPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
.sol-panel:not(.playing) .anim-fade-in { opacity: 1; }

/* === Q3 fold animation === */
.fold-group { transform-box: fill-box; transform-origin: 130px 100px; }
.sol-panel.playing .fold-group { animation: foldRight 2.5s ease-in-out 1.5s both; }
@keyframes foldRight {
  0%   { transform: scaleX(1); }
  50%  { transform: scaleX(-1); }
  100% { transform: scaleX(1); }
}

/* === Q2 slider === */
.slider-demo {
  background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
}
.slider-demo .sd-label { display: flex; justify-content: space-between; font-size: .9rem; color: #aac; margin-bottom: 8px; }
.slider-demo input[type=range] {
  width: 100%; height: 6px; -webkit-appearance: none; appearance: none;
  background: linear-gradient(90deg, var(--c-perp), var(--c-bisect));
  border-radius: 3px; outline: none;
}
.slider-demo input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px;
  background: #fff; border-radius: 50%; cursor: pointer;
  box-shadow: 0 0 0 4px rgba(255,255,255,.2);
}
.slider-demo input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; background: #fff;
  border: none; border-radius: 50%; cursor: pointer;
  box-shadow: 0 0 0 4px rgba(255,255,255,.2);
}
.slider-demo .sd-result {
  margin-top: 10px; text-align: center; font-size: 1rem;
  color: var(--c-gold); font-weight: 700;
}

/* RWD */
@media (max-width: 600px) {
  body { padding: 12px; }
  .cover { padding: 22px 8px; }
  .cover h1 { font-size: 2rem; }
  .cover .sub { font-size: 1rem; }
  .cover .start-btn { padding: 18px 38px; font-size: 1.25rem; letter-spacing: 1.5px; }
  .hud { padding: 10px 12px; }
  .hud .stage { font-size: .88rem; }
  .hud .combo, .hud .coins { font-size: .92rem; }
  .q-card { padding: 18px 14px; }
  .q-emoji { font-size: 2rem; }
  .q-title { font-size: 1.15rem; }
  .q-hint { font-size: .85rem; }
  .option { padding: 12px 12px; font-size: 1rem; min-height: 56px; gap: 10px; }
  .option .letter { width: 32px; height: 32px; font-size: .95rem; }
  .victory h1 { font-size: 1.85rem; }
  .victory .crown { font-size: 3.4rem; }
  .rank-card { padding: 16px 22px; }
  .rank-card .name { font-size: 1.45rem; }
  .stat { min-width: 80px; padding: 10px 12px; }
  .stat .num { font-size: 1.3rem; }
  .level-up-overlay .lv-text { font-size: 2.4rem; }
}
@media (hover: none) {
  .option:hover { background: rgba(255,255,255,.05); }
}
</style>
</head>
<body>
<!-- 全域 SVG 漸層定義 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="triGradPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B967FF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="triGradTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00BCD4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5DD8E8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="triGradGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<canvas id="fireworks"></canvas>
<div class="level-up-overlay" id="lvOverlay">
  <div class="lv-text">LEVEL UP!</div>
  <div class="lv-sub" id="lvSub">解鎖新技能</div>
</div>

<div class="wrap" id="app"></div>

<script>
/* ===== 音效 ===== */
let audioCtx = null;
function ctx(){ if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return audioCtx; }
function tone(freq, dur, type='square', vol=0.1){
  const c=ctx(); if(!c)return;
  const osc=c.createOscillator(), gain=c.createGain();
  osc.type=type; osc.frequency.value=freq;
  gain.gain.setValueAtTime(vol, c.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime+dur);
  osc.connect(gain); gain.connect(c.destination);
  osc.start(); osc.stop(c.currentTime+dur);
}

/* ===== 段位 ===== */
function getRank(correct, total) {
  const pct = correct / total;
  if (correct === total) return { name: '👑 等腰王者', cls: 'r-king', desc: '完美通關！全班崇拜你 ⭐' };
  if (pct >= 0.85) return { name: '💎 鑽石勇者', cls: 'r-diamond', desc: '段考穩了！' };
  if (pct >= 0.7) return { name: '🥇 金牌學徒', cls: 'r-gold', desc: '快要滿分！再加把勁' };
  if (pct >= 0.4) return { name: '🥈 銀牌學徒', cls: 'r-silver', desc: '不錯，再來一次更厲害' };
  return { name: '🥉 銅牌新兵', cls: 'r-bronze', desc: '沒關係！再玩一次會更穩' };
}

function startGame() {
  sndJump();
  state.current = 0; state.coins = 0; state.correct = 0; state.attempts = 0;
  state.combo = 0; state.maxCombo = 0; state.startTime = Date.now();
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[state.current];
  const stagesBarHtml = QUESTIONS.map((_, i) => {
    let cls = '';
    if (i < state.current) cls = 'done';
    else if (i === state.current) cls = 'active';
    return `<div class="stage-dot ${cls}"></div>`;
  }).join('');

  const optsHtml = q.options.map((opt, i) => `
    <button class="option" data-idx="${i}" onclick="pick(${i})">
      <div class="letter">${String.fromCharCode(65 + i)}</div>
      <div style="flex:1;">
        <span style="font-size:1.4rem;margin-right:8px;">${opt.emoji}</span>${opt.text}
      </div>
    </button>
  `).join('');

  app.innerHTML = `
    ${state.current === 0 ? `
      <div class="name-input-wrap">
        <label>👤 你的名字：</label>
        <input id="nameInput" type="text" placeholder="輸入名字（給老師對照用）" autocomplete="off" value="${state.studentName}">
      </div>` : ''}

    <div class="hud">
      <div class="stage">⚔️ 第 ${state.current + 1} 關 / ${TOTAL}</div>
      <div class="combo ${state.combo >= 3 ? 'hot' : ''}">🔥 ${state.combo}</div>
      <div class="coins">🪙 ${state.coins}</div>
    </div>
    <div class="stages-bar">${stagesBarHtml}</div>

    <div class="q-card">
      <div class="boss-tag">${q.boss}</div>
      <div class="q-emoji">${q.emoji}</div>
      <div class="q-title">${q.title}</div>
      ${q.figure ? `<div class="q-figure">${q.figure}</div>` : ''}
      ${q.interactive === 'q2-slider' ? renderQ2Slider() : ''}
      <div class="q-hint">💡 ${q.hint}</div>
      <div class="options">${optsHtml}</div>
      <div class="feedback" id="fb"></div>
      <button class="show-sol-btn" id="showSolBtn" onclick="toggleSolution()" style="display:none;width:100%;margin-top:10px;padding:14px;border-radius:50px;border:2px solid var(--c-bisect);background:rgba(0,188,212,.1);color:var(--c-bisect);font-weight:800;font-size:1rem;font-family:inherit;cursor:pointer;">🎬 看解題動畫</button>
      <div class="solution-panel sol-panel" id="solPanel">
        <div class="sol-title">
          <span>🎬 解題步驟（動畫）</span>
          <button class="sol-replay" onclick="replaySolution()">🔄 重播</button>
        </div>
        <div id="solBody">${q.solution || ''}</div>
      </div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">${state.current === TOTAL - 1 ? '看通關證 🏆' : '下一關 →'}</button>
    </div>
  `;

  const nameInput = document.getElementById('nameInput');
  if (nameInput) {
    nameInput.addEventListener('input', e => state.studentName = e.target.value);
  }
  if (q.interactive === 'q2-slider') initQ2Slider();
}

function initQ2Slider() {
  const slider = document.getElementById('q2Slider');
  const drawQ2 = (apexDeg) => {
    const baseAngle = (180 - apexDeg) / 2;  // 兩底角
    // 三角形畫成等腰，apex 在 (140, 30)，底寬隨 apex 改變
    // 高固定 140
    const h = 140;
    const halfBase = h * Math.tan(apexDeg * Math.PI / 360);  // tan(A/2) * h
    const cx = 140;
    const ay = 30;
    const by = ay + h;
    const bx = cx - halfBase, ex = cx + halfBase;
    const svg = document.getElementById('q2DemoSvg');
    if (!svg) return;
    svg.innerHTML = `
      <polygon points="${cx},${ay} ${bx},${by} ${ex},${by}" fill="url(#triGradPink)" stroke="#FF6B9D" stroke-width="2.5"/>
      <line x1="${cx}" y1="${ay}" x2="${cx}" y2="${by}" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
      <text x="${cx}" y="22" fill="#fff" font-weight="900" font-size="14" text-anchor="middle">A</text>
      <text x="${bx-10}" y="${by+14}" fill="#fff" font-weight="900" font-size="14">B</text>
      <text x="${ex+4}" y="${by+14}" fill="#fff" font-weight="900" font-size="14">C</text>
      <text x="${cx-50}" y="${by-6}" fill="#FF6B9D" font-weight="900" font-size="13">${baseAngle.toFixed(0)}°</text>
      <text x="${cx+30}" y="${by-6}" fill="#FF6B9D" font-weight="900" font-size="13">${baseAngle.toFixed(0)}°</text>
      <text x="${cx-12}" y="${ay+24}" fill="#FFD700" font-weight="900" font-size="13">${apexDeg}°</text>
    `;
    document.getElementById('q2A').textContent = `∠A = ${apexDeg}°`;
    document.getElementById('q2Result').textContent = `∠B = ∠C = ${baseAngle.toFixed(0)}° （永遠相等！）`;
  };
  drawQ2(parseInt(slider.value));
  slider.addEventListener('input', e => drawQ2(parseInt(e.target.value)));
}

function toggleSolution() {
  const panel = document.getElementById('solPanel');
  const btn = document.getElementById('showSolBtn');
  if (panel.classList.contains('show')) {
    panel.classList.remove('show', 'playing');
    btn.textContent = '🎬 看解題動畫';
  } else {
    panel.classList.add('show', 'playing');
    btn.textContent = '🙈 收起解題';
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function replaySolution() {
  const panel = document.getElementById('solPanel');
  panel.classList.remove('playing');
  void panel.offsetWidth;  // force reflow
  panel.classList.add('playing');
}

function pick(idx) {
  const q = QUESTIONS[state.current];
  const opts = document.querySelectorAll('.option');
  if (opts[0].classList.contains('correct') || opts[0].classList.contains('wrong')) return;

  state.attempts++;
  const isCorrect = q.options[idx].correct;

  if (isCorrect) {
    opts[idx].classList.add('correct');
    state.correct++;
    state.combo++;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    const baseCoin = 10;
    const comboBonus = state.combo >= 3 ? 5 * state.combo : 0;
    const totalCoin = baseCoin + comboBonus;
    state.coins += totalCoin;
    sndCoin();
    if (state.combo >= 3) setTimeout(() => sndCombo(), 200);
    setTimeout(() => sndLevelUp(), 350);
    showLevelUpFlash(q.skill);
    showFeedback('ok',
      `✅ 答對！技能解鎖：${q.skill}` +
      (state.combo >= 3 ? `<div class="reward">🔥 ${state.combo}連對！+${totalCoin} 🪙 (含 COMBO bonus!)</div>` : `<div class="reward">+${totalCoin} 🪙</div>`)
    );
    document.getElementById('nextBtn').classList.add('show');
    const solBtn = document.getElementById('showSolBtn');
    if (solBtn && q.solution) solBtn.style.display = 'block';
    document.querySelectorAll('.option').forEach(o => o.style.pointerEvents = 'none');
    miniSpark();
  } else {
    opts[idx].classList.add('wrong');
    state.combo = 0;
    sndWrong();
    showFeedback('bad', '❌ 答錯了！COMBO 中斷。再試試別的選項～');
    setTimeout(() => opts[idx].classList.remove('wrong'), 800);
  }
}

function showLevelUpFlash(skill) {
  const ov = document.getElementById('lvOverlay');
  document.getElementById('lvSub').textContent = `解鎖：${skill}`;
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 800);
}

function showFeedback(type, msg) {
  const fb = document.getElementById('fb');
  fb.className = `feedback show ${type}`;
  fb.innerHTML = msg;
}

function nextQ() {
  state.current++;
  if (state.current >= TOTAL) {
    renderVictory();
  } else {
    sndJump();
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function renderVictory() {
  const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  const min = Math.floor(elapsed / 60);
  const sec = elapsed % 60;
  const timeStr = `${min}:${String(sec).padStart(2, '0')}`;
  const rank = getRank(state.correct, TOTAL);
  const greet = state.studentName ? `${state.studentName}` : '勇者';

  // 存 localStorage
  saveResult({
    name: state.studentName || '匿名',
    correct: state.correct,
    total: TOTAL,
    rank: rank.name,
    time: timeStr,
    coins: state.coins,
    combo: state.maxCombo,
    ts: Date.now()
  });

  const teacherUrl = buildTeacherUrl({
    n: state.studentName || '匿名',
    s: state.correct,
    r: rank.name,
    t: timeStr,
    c: state.coins,
    co: state.maxCombo
  });

  app.innerHTML = `
    <div class="victory">
      <div class="crown">${rank.name.match(/[👑💎🥇🥈🥉]/)?.[0] || '🏆'}</div>
      <h1>${greet}！通關！</h1>
      <div style="color:#aab;font-size:1.05rem;margin-bottom:8px;">3-4 等腰／正三角形 · 段考衝刺完成</div>

      <div class="rank-card">
        <div class="label">獲得段位</div>
        <div class="name">${rank.name}</div>
      </div>
      <div style="color:#ccd;font-size:1rem;margin-bottom:6px;">${rank.desc}</div>

      <div class="stats">
        <div class="stat"><div class="num">${state.correct}/${TOTAL}</div><div class="lab">✅ 答對</div></div>
        <div class="stat"><div class="num">${state.coins}</div><div class="lab">🪙 金幣</div></div>
        <div class="stat"><div class="num">${state.maxCombo}</div><div class="lab">🔥 最高 COMBO</div></div>
        <div class="stat"><div class="num">${timeStr}</div><div class="lab">⏱ 用時</div></div>
      </div>

      <div class="action-row">
        <button class="act primary" id="copyTxtBtn" onclick="copyTextResult()">📋 複製成績傳老師</button>
        <button class="act" id="copyLinkBtn" onclick="copyTeacherLink('${teacherUrl}')">🔗 複製通關連結</button>
      </div>
      <div style="color:#889;font-size:.85rem;margin-top:10px;line-height:1.6;">
        把成績或連結 LINE 傳老師 = 完成段考衝刺練習 ✅
      </div>

      <button class="restart" onclick="startGame()">🔄 再玩一次</button>
    </div>
  `;
  sndVictory();
  bigFireworks();
}

function saveResult(r) {
  try {
    const key = '8a-3-4-records';
    const arr = JSON.parse(localStorage.getItem(key) || '[]');
    arr.push(r);
    localStorage.setItem(key, JSON.stringify(arr));
  } catch(e) {}
}

function buildTeacherUrl(p) {
  const base = location.origin + location.pathname.replace(/[^/]*$/, '') + '8a-3-4-teacher.html';
  const qs = new URLSearchParams({ key: 'stacey2026', ...p }).toString();
  return base + '?' + qs;
}

function copyTextResult() {
  const r = JSON.parse(localStorage.getItem('8a-3-4-records') || '[]').slice(-1)[0];
  if (!r) return;
  const txt = `📊 8A 段考衝刺 · 等腰王者
👤 姓名：${r.name}
🏅 段位：${r.rank}
✅ 答對：${r.correct}/${r.total}
🪙 金幣：${r.coins}
🔥 最高 COMBO：${r.combo}
⏱ 用時：${r.time}`;
  copyToClipboard(txt, document.getElementById('copyTxtBtn'));
}

function copyTeacherLink(url) {
  copyToClipboard(url, document.getElementById('copyLinkBtn'));
}

function copyToClipboard(text, btn) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => flashBtn(btn, '✓ 已複製'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    flashBtn(btn, '✓ 已複製');
  }
}

function flashBtn(btn, msg) {
  if (!btn) return;
  const orig = btn.innerHTML;
  btn.innerHTML = msg; btn.classList.add('copied');
  setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1800);
}

/* ===== 煙火 ===== */
const fwCanvas = document.getElementById('fireworks');
const fwCtx = fwCanvas.getContext('2d');
let fwParticles = [];
function resizeFW(){ fwCanvas.width=innerWidth; fwCanvas.height=innerHeight; }
resizeFW(); addEventListener('resize', resizeFW);
function bigFireworks(){
  fwCanvas.style.display='block';
  for(let i=0;i<6;i++) setTimeout(()=>burst(Math.random()*innerWidth, Math.random()*innerHeight*0.6+50), i*350);
  fwLoop();
  setTimeout(()=>{ fwCanvas.style.display='none'; fwParticles=[]; }, 5000);
}
function miniSpark(){ fwCanvas.style.display='block'; burst(innerWidth/2, innerHeight/2); fwLoop(); }
function burst(x,y){
  const colors=['#FF6B9D','#00BCD4','#B967FF','#FFD700','#FF3B30','#22c55e'];
  for(let i=0;i<36;i++){
    const a=(i/36)*Math.PI*2;
    fwParticles.push({ x, y, vx: Math.cos(a)*(Math.random()*5+2), vy: Math.sin(a)*(Math.random()*5+2), life: 70, color: colors[Math.floor(Math.random()*colors.length)] });
  }
}
function fwLoop(){
  fwCtx.fillStyle='rgba(0,0,0,0.12)';
  fwCtx.fillRect(0,0,fwCanvas.width,fwCanvas.height);
  fwParticles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--; fwCtx.fillStyle=p.color; fwCtx.globalAlpha=p.life/70; fwCtx.fillRect(p.x,p.y,4,4); });
  fwCtx.globalAlpha=1;
  fwParticles=fwParticles.filter(p=>p.life>0);
  if(fwParticles.length>0) requestAnimationFrame(fwLoop);
  else if(fwCanvas.style.display==='block') fwCanvas.style.display='none';
}

renderCover();
</script>
