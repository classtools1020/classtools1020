<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三角王國攻略戰 · 8A 數學 3-5</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --neon-pink: #FF1B6B;
  --neon-cyan: #00F0FF;
  --neon-purple: #B100E8;
  --neon-yellow: #FFD700;
  --neon-green: #00FF88;
  --bg-1: #0A0E27;
  --bg-2: #1A1A3E;
  --bg-3: #2D1B69;
}
html, body {
  font-family: 'Noto Sans TC','Microsoft JhengHei',sans-serif;
  background: linear-gradient(135deg,var(--bg-1) 0%,var(--bg-3) 100%);
  color: #fff;
  min-height: 100vh;
  min-height: 100dvh;
  user-select: none;
  -webkit-user-select: none;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
body {
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(177,0,232,0.25), transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(255,27,107,0.2), transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(0,240,255,0.1), transparent 50%),
    linear-gradient(135deg,var(--bg-1) 0%,var(--bg-3) 100%);
  background-attachment: fixed;
}
.wrap { max-width: 720px; width: 100%; }

/* ========== 首頁 ========== */
.cover {
  text-align: center;
  padding: 24px 12px;
  animation: zoomIn .6s;
}
@keyframes zoomIn {
  from { opacity: 0; transform: scale(.8); }
  to { opacity: 1; transform: scale(1); }
}
.cover .game-icon {
  font-size: 5rem;
  display: block;
  margin-bottom: 4px;
  filter: drop-shadow(0 0 24px var(--neon-pink));
  animation: glow 2s infinite alternate;
}
@keyframes glow {
  from { filter: drop-shadow(0 0 14px var(--neon-pink)); }
  to { filter: drop-shadow(0 0 32px var(--neon-cyan)); }
}
.cover h1 {
  font-size: 2.6rem;
  font-weight: 900;
  letter-spacing: -1px;
  background: linear-gradient(90deg,var(--neon-pink),var(--neon-cyan),var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
  text-shadow: 0 0 40px rgba(255,27,107,.3);
}
.cover .sub {
  font-size: 1.05rem;
  color: #C4B5FD;
  margin-bottom: 18px;
  font-weight: 600;
  letter-spacing: 2px;
}
.cover .tag {
  display: inline-block;
  padding: 6px 16px;
  background: rgba(255,27,107,.15);
  border: 1px solid var(--neon-pink);
  border-radius: 50px;
  font-size: .85rem;
  color: var(--neon-pink);
  font-weight: 800;
  margin-bottom: 18px;
  letter-spacing: 2px;
}

/* 名字輸入 */
.name-input{
  background: rgba(0,0,0,.5);
  border: 2px solid var(--neon-cyan);
  border-radius: 20px;
  padding: 14px 18px;
  margin: 0 auto 18px;
  max-width: 380px;
  box-shadow: 0 0 30px rgba(0,240,255,.2);
}
.name-input label {
  display: block;
  color: var(--neon-cyan);
  font-weight: 800;
  font-size: .92rem;
  margin-bottom: 8px;
  letter-spacing: 2px;
}
.name-input input {
  width: 100%;
  background: rgba(255,255,255,.08);
  border: 2px solid rgba(0,240,255,.4);
  color: white;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 1.1rem;
  font-family: inherit;
  text-align: center;
  font-weight: 700;
  min-height: 48px;
}
.name-input input:focus {
  outline: none;
  border-color: var(--neon-cyan);
  background: rgba(0,240,255,.08);
  box-shadow: 0 0 20px rgba(0,240,255,.3);
}
.name-hint {
  margin-top: 6px;
  color: var(--neon-pink);
  font-size: .85rem;
  text-align: center;
  font-weight: 700;
  display: none;
}
.name-hint.show { display: block; }

/* 英雄選擇 */
.hero-select {
  margin: 14px 0;
}
.hero-select .title {
  color: var(--neon-yellow);
  font-weight: 800;
  font-size: .92rem;
  margin-bottom: 8px;
  letter-spacing: 2px;
}
.heroes {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
@media (max-width: 500px) {
  .heroes { grid-template-columns: repeat(5, 1fr); gap: 5px; }
}
.hero {
  background: rgba(255,255,255,.04);
  border: 2px solid rgba(255,255,255,.15);
  border-radius: 14px;
  padding: 10px 4px;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
}
.hero:active { transform: scale(.95); }
.hero.selected {
  border-color: var(--neon-pink);
  background: rgba(255,27,107,.2);
  box-shadow: 0 0 20px rgba(255,27,107,.5);
  transform: scale(1.05);
}
.hero .emoji { font-size: 2rem; display: block; }
.hero .name { font-size: .72rem; color: #ccd; margin-top: 4px; font-weight: 700; }
.hero.selected .name { color: white; }

.start-btn {
  background: linear-gradient(135deg,var(--neon-pink),var(--neon-purple));
  color: white;
  border: none;
  padding: 18px 44px;
  font-size: 1.4rem;
  font-weight: 900;
  font-family: inherit;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(255,27,107,.5), inset 0 -4px 0 rgba(0,0,0,.2);
  letter-spacing: 4px;
  margin-top: 8px;
  text-shadow: 0 0 8px rgba(255,255,255,.5);
}
.start-btn:active { transform: scale(.95); }

/* ========== Round 選單 ========== */
.round-menu {
  text-align: center;
  padding: 16px 8px;
  animation: zoomIn .6s;
}
.round-menu h2 {
  font-size: 1.8rem;
  font-weight: 900;
  margin-bottom: 8px;
  background: linear-gradient(90deg,var(--neon-cyan),var(--neon-pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.round-menu .player-info {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,.06);
  border: 2px solid rgba(255,255,255,.15);
  border-radius: 50px;
  padding: 8px 18px;
  margin-bottom: 18px;
}
.round-menu .player-info .emoji { font-size: 1.6rem; }
.round-menu .player-info .name { font-weight: 800; color: white; letter-spacing: 1px; }

.round-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}
@media (max-width: 540px) {
  .round-cards { grid-template-columns: 1fr; }
}
.round-card {
  background: rgba(0,0,0,.4);
  border: 2px solid rgba(255,255,255,.15);
  border-radius: 18px;
  padding: 18px 14px;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
}
.round-card.locked {
  opacity: .5;
  cursor: not-allowed;
}
.round-card:not(.locked):hover, .round-card:not(.locked):active {
  border-color: var(--neon-pink);
  background: rgba(255,27,107,.1);
  box-shadow: 0 0 24px rgba(255,27,107,.3);
}
.round-card .badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 50px;
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}
.round-card.r1 .badge { background: rgba(0,240,255,.2); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }
.round-card.r2 .badge { background: rgba(255,27,107,.2); color: var(--neon-pink); border: 1px solid var(--neon-pink); }
.round-card .icon { font-size: 2.6rem; display: block; margin: 4px 0; }
.round-card .name { font-size: 1.2rem; font-weight: 900; color: white; margin-bottom: 4px; }
.round-card .desc { font-size: .85rem; color: #aab; }
.round-card .status {
  margin-top: 8px;
  font-size: .82rem;
  font-weight: 700;
}
.round-card.cleared .status { color: var(--neon-green); }
.round-card.locked .status { color: #888; }

/* ========== 戰役畫面 ========== */
.battle-hud {
  position: sticky; top: 0;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid var(--neon-purple);
  border-radius: 18px;
  padding: 10px 14px;
  margin-bottom: 12px;
  z-index: 50;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.battle-hud .left { display: flex; gap: 8px; align-items: center; }
.battle-hud .hero-emoji { font-size: 1.6rem; }
.battle-hud .stage { font-weight: 800; color: var(--neon-cyan); font-size: .95rem; }
.battle-hud .stats { display: flex; gap: 6px; font-size: .92rem; font-weight: 800; }
.battle-hud .kills { color: var(--neon-green); }
.battle-hud .misses { color: #888; }

/* 地圖 */
.map-board {
  background: rgba(0,0,0,.3);
  border: 2px solid rgba(255,255,255,.12);
  border-radius: 18px;
  padding: 14px 12px;
  margin-bottom: 14px;
}
.map-title {
  font-size: .85rem;
  color: var(--neon-yellow);
  font-weight: 800;
  letter-spacing: 2px;
  text-align: center;
  margin-bottom: 10px;
}
.castles {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.castle {
  background: rgba(255,255,255,.05);
  border: 2px solid rgba(255,255,255,.2);
  border-radius: 12px;
  padding: 10px 4px;
  text-align: center;
  font-size: .72rem;
  color: #aab;
  position: relative;
  transition: all .4s;
  min-height: 84px;
}
.castle .ic { font-size: 1.8rem; display: block; line-height: 1; }
.castle .nm { margin-top: 4px; font-weight: 700; }
.castle.active {
  border-color: var(--neon-yellow);
  box-shadow: 0 0 14px rgba(255,215,0,.4);
  animation: activePulse 1s infinite;
}
@keyframes activePulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.castle.captured {
  background: linear-gradient(135deg,rgba(0,255,136,.35),rgba(0,240,255,.2));
  border-color: var(--neon-green);
  color: white;
  animation: captureAnim 1.2s;
}
@keyframes captureAnim {
  0% { transform: scale(1); }
  30% { transform: scale(1.15) rotate(8deg); }
  60% { transform: scale(1.15) rotate(-8deg); }
  100% { transform: scale(1.05) rotate(0); }
}
.castle.captured::after {
  content: "🚩";
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 1.4rem;
  animation: flagWave 1.6s infinite;
}
@keyframes flagWave {
  0%,100% { transform: rotate(-10deg); }
  50% { transform: rotate(10deg); }
}
.castle.failed {
  background: rgba(60,60,80,.4);
  border-color: rgba(255,255,255,.1);
  opacity: .6;
}

/* 題目卡 */
.q-card {
  background: rgba(255,255,255,.05);
  border: 2px solid var(--neon-purple);
  border-radius: 22px;
  padding: 20px 16px;
  box-shadow: 0 0 40px rgba(177,0,232,.2);
  animation: slideUp .4s;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.q-banner {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg,var(--neon-pink),var(--neon-purple));
  color: white;
  padding: 8px 16px;
  border-radius: 50px;
  font-weight: 900;
  font-size: .95rem;
  margin-bottom: 12px;
  letter-spacing: 1px;
  box-shadow: 0 0 14px rgba(255,27,107,.4);
}
.q-title {
  font-size: 1.35rem;
  font-weight: 900;
  color: white;
  margin-bottom: 12px;
  line-height: 1.5;
}
.q-figure {
  background: rgba(0,0,0,.25);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  padding: 10px;
  margin: 8px auto;
  max-width: 360px;
}
.q-figure svg { display: block; margin: 0 auto; width: 100%; max-width: 320px; height: auto; }

/* === 互動三角形 builder === */
.tri-builder { text-align: center; }
.tri-builder .tb-svg { width: 100%; max-width: 320px; height: auto; }
.tri-builder .tb-hint {
  font-size: .82rem;
  color: rgba(255,255,255,.55);
  margin: 4px 0 6px;
  letter-spacing: .5px;
}
.tb-btn {
  display: inline-block;
  margin: 8px auto 4px;
  padding: 10px 22px;
  font-size: 1.05rem;
  font-weight: 900;
  letter-spacing: 1px;
  color: #fff;
  background: linear-gradient(135deg, #FF1B6B, #B100E8);
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(255,27,107,.55);
  transition: transform .15s ease, box-shadow .15s ease;
}
.tb-btn:hover { transform: scale(1.05); box-shadow: 0 0 26px rgba(255,27,107,.8); }
.tb-btn:active { transform: scale(.96); }
.tb-svg .tb-pulse-ok { animation: tbPulseOk .6s ease 1; }
.tb-svg .tb-pulse-bad { animation: tbPulseBad .6s ease 1; }
@keyframes tbPulseOk {
  0% { filter: drop-shadow(0 0 0 #00FF88); }
  50% { filter: drop-shadow(0 0 18px #00FF88); }
  100% { filter: drop-shadow(0 0 0 #00FF88); }
}
@keyframes tbPulseBad {
  0% { filter: drop-shadow(0 0 0 #FF1B6B); }
  50% { filter: drop-shadow(0 0 14px #FF1B6B); }
  100% { filter: drop-shadow(0 0 0 #FF1B6B); }
}
.q-hint {
  background: rgba(255,215,0,.1);
  border-left: 4px solid var(--neon-yellow);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: .92rem;
  color: var(--neon-yellow);
  font-weight: 600;
  margin: 10px 0;
}
.q-hint::before { content: "💡 "; }

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}
.option {
  background: rgba(255,255,255,.05);
  border: 2px solid rgba(255,255,255,.2);
  padding: 16px 18px;
  border-radius: 14px;
  font-size: 1.15rem;
  font-weight: 700;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: inherit;
  text-align: left;
  width: 100%;
  min-height: 60px;
  transition: all .15s;
}
.option:active { transform: scale(.98); }
.option .letter {
  width: 38px; height: 38px;
  background: rgba(255,255,255,.15);
  color: white;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900;
  font-size: 1.1rem;
  flex-shrink: 0;
}
.option.correct {
  background: linear-gradient(135deg,rgba(0,255,136,.3),rgba(0,240,255,.2));
  border-color: var(--neon-green);
  animation: correctPop .5s;
  box-shadow: 0 0 20px rgba(0,255,136,.4);
}
.option.correct .letter { background: var(--neon-green); color: black; }
.option.wrong {
  background: rgba(255,27,107,.2);
  border-color: var(--neon-pink);
  animation: shake .4s;
}
.option.wrong .letter { background: var(--neon-pink); color: white; }
@keyframes correctPop {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.next-btn {
  width: 100%;
  margin-top: 12px;
  background: linear-gradient(135deg,var(--neon-cyan),var(--neon-purple));
  color: white;
  border: none;
  padding: 16px;
  font-size: 1.2rem;
  font-weight: 900;
  border-radius: 50px;
  cursor: pointer;
  font-family: inherit;
  display: none;
  box-shadow: 0 0 24px rgba(0,240,255,.4);
  letter-spacing: 2px;
}
.next-btn.show { display: block; }
.next-btn:active { transform: scale(.97); }

/* ========== 攻佔彈窗 ========== */
.capture-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.capture-overlay.show { display: flex; animation: overlayIn .3s; }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
.capture-overlay .big {
  font-size: 4rem;
  animation: captureBounce .8s infinite;
}
@keyframes captureBounce {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-20px) scale(1.1); }
}
.capture-overlay .text {
  font-size: 2.2rem;
  font-weight: 900;
  background: linear-gradient(90deg,var(--neon-green),var(--neon-yellow));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-top: 8px;
  letter-spacing: 4px;
}
.capture-overlay .castle-name {
  margin-top: 8px;
  color: white;
  font-size: 1.2rem;
  font-weight: 700;
}

/* ========== 通關／段位 ========== */
.victory {
  text-align: center;
  padding: 24px 14px;
  background: rgba(255,255,255,.04);
  border: 2px solid var(--neon-yellow);
  border-radius: 24px;
  box-shadow: 0 0 60px rgba(255,215,0,.25);
  animation: zoomIn .8s;
}
.victory h1 {
  font-size: 2rem;
  font-weight: 900;
  background: linear-gradient(90deg,var(--neon-yellow),var(--neon-pink),var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.rank-medal {
  font-size: 6rem;
  display: block;
  margin: 8px 0;
  animation: medalSpin 3s infinite;
  filter: drop-shadow(0 0 24px rgba(255,215,0,.7));
}
@keyframes medalSpin {
  0%,100% { transform: rotate(0); }
  25% { transform: rotate(-10deg); }
  75% { transform: rotate(10deg); }
}
.rank-name {
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--neon-yellow);
  letter-spacing: 3px;
  margin-bottom: 8px;
}
.rank-desc {
  font-size: .95rem;
  color: #ccd;
  margin-bottom: 14px;
}
.stats {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 14px 0;
}
.stat {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 12px;
  padding: 10px 14px;
  min-width: 90px;
}
.stat .num { font-size: 1.4rem; font-weight: 900; color: var(--neon-cyan); }
.stat .lab { font-size: .78rem; color: #aab; margin-top: 2px; }
.upload-status {
  background: rgba(0,255,136,.1);
  border: 1px solid var(--neon-green);
  border-radius: 14px;
  padding: 12px 14px;
  margin-top: 14px;
  color: var(--neon-green);
  font-weight: 700;
  font-size: .95rem;
}
.upload-status.warn {
  background: rgba(255,215,0,.1);
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
}
.victory .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.victory .btn-row button {
  flex: 1; min-width: 130px;
  background: rgba(255,255,255,.06);
  border: 2px solid rgba(255,255,255,.2);
  color: white;
  padding: 12px 18px;
  font-weight: 700;
  border-radius: 50px;
  cursor: pointer;
  font-family: inherit;
  font-size: .95rem;
}
.victory .btn-row button.primary {
  background: linear-gradient(135deg,var(--neon-pink),var(--neon-purple));
  border-color: transparent;
}
.victory .btn-row button:active { transform: scale(.97); }

#fireworks { position: fixed; inset: 0; pointer-events: none; z-index: 9998; display: none; }

/* SVG 樣式 */
.tri-pink { fill: rgba(255,27,107,.2); stroke: var(--neon-pink); stroke-width: 2.5; }
.tri-cyan { fill: rgba(0,240,255,.18); stroke: var(--neon-cyan); stroke-width: 2.5; }
.tri-purple { fill: rgba(177,0,232,.2); stroke: var(--neon-purple); stroke-width: 2.5; }

/* RWD */
@media (max-width: 500px) {
  body { padding: 10px 6px; }
  .cover h1 { font-size: 1.85rem; }
  .cover .game-icon { font-size: 4rem; }
  .start-btn { padding: 16px 36px; font-size: 1.2rem; letter-spacing: 2px; }
  .hero .emoji { font-size: 1.6rem; }
  .hero .name { font-size: .65rem; }
  .castle { padding: 8px 2px; min-height: 72px; }
  .castle .ic { font-size: 1.5rem; }
  .castle .nm { font-size: .65rem; }
  .q-title { font-size: 1.15rem; }
  .option { font-size: 1.02rem; padding: 13px 12px; min-height: 56px; }
  .option .letter { width: 32px; height: 32px; font-size: 1rem; }
  .capture-overlay .text { font-size: 1.65rem; }
  .victory h1 { font-size: 1.55rem; }

/* ===== 互動三角形 builder ===== */
/* 兩根短邊從最長邊兩端折上來，能組 → 收在頂點 ✓；不能組 → 停在 80° 露紅色間距 ✗ */
function triBuild(a,b,c,id){
  const arr=[a,b,c].slice().sort((x,y)=>x-y);
  const s1=arr[0], s2=arr[1], base=arr[2];
  const canForm = (s1+s2) > base;
  const equal = (s1+s2) === base; // 剛好等於：也不能組
  const SCALE = Math.min(20, 200/base);
  const baseW = base*SCALE;
  const cx = 140;
  const baseY = 130;
  const Bx = cx - baseW/2, Cx = cx + baseW/2;
  // 起始：兩短邊平躺在最長邊「上方一點」分開放著
  const startY = baseY - 38;
  const lStartX1 = Bx, lStartY1 = startY;
  const lStartX2 = Bx + s1*SCALE, lStartY2 = startY;
  const rStartX1 = Cx, rStartY1 = startY;
  const rStartX2 = Cx - s2*SCALE, rStartY2 = startY;
  // 終止位置
  let lEndX2, lEndY2, rEndX2, rEndY2;
  if(canForm){
    // 三角形 apex（以 B=(0,0), C=(base,0)）
    const ax = (s1*s1 - s2*s2 + base*base) / (2*base);
    const ay = Math.sqrt(Math.max(0, s1*s1 - ax*ax));
    lEndX2 = Bx + ax*SCALE;
    lEndY2 = baseY - ay*SCALE;
    rEndX2 = lEndX2;
    rEndY2 = lEndY2;
  } else {
    // 兩根都抬到 80°，露出紅色間距
    const ang = Math.PI/180 * 80;
    lEndX2 = Bx + s1*SCALE*Math.cos(ang);
    lEndY2 = baseY - s1*SCALE*Math.sin(ang);
    rEndX2 = Cx - s2*SCALE*Math.cos(ang);
    rEndY2 = baseY - s2*SCALE*Math.sin(ang);
  }
  const lblOffset = 14;
  // pivot 動畫：起始橫躺 → 終止對應 apex 角度
  const lPivotX1 = Bx, lPivotY1 = baseY;
  const lPivotX2 = Bx + s1*SCALE, lPivotY2 = baseY;
  const rPivotX1 = Cx, rPivotY1 = baseY;
  const rPivotX2 = Cx - s2*SCALE, rPivotY2 = baseY;
  return `
  <div class="tri-builder" data-id="${id}" data-can="${canForm?1:0}" data-state="0">
    <svg viewBox="0 0 280 170" class="tb-svg">
      <!-- 最長邊（紫） -->
      <line x1="${Bx}" y1="${baseY}" x2="${Cx}" y2="${baseY}"
            stroke="#B100E8" stroke-width="6" stroke-linecap="round"/>
      <text x="${cx}" y="${baseY+22}" fill="#B100E8" font-size="14"
            font-weight="900" text-anchor="middle">${base}（最長）</text>
      <circle cx="${Bx}" cy="${baseY}" r="4" fill="#fff"/>
      <circle cx="${Cx}" cy="${baseY}" r="4" fill="#fff"/>
      <text x="${Bx-10}" y="${baseY+5}" fill="#fff" font-size="13" font-weight="900" text-anchor="end">B</text>
      <text x="${Cx+10}" y="${baseY+5}" fill="#fff" font-size="13" font-weight="900">C</text>
      <!-- 左短邊（粉，起始橫躺在上方） -->
      <line class="tb-stick" data-role="left"
            data-px1="${lPivotX1}" data-py1="${lPivotY1}" data-px2="${lPivotX2}" data-py2="${lPivotY2}"
            data-fx="${lEndX2}" data-fy="${lEndY2}"
            x1="${lStartX1}" y1="${lStartY1}" x2="${lStartX2}" y2="${lStartY2}"
            stroke="#FF1B6B" stroke-width="6" stroke-linecap="round"/>
      <text class="tb-lbl" data-role="leftLbl"
            data-sx="${(lStartX1+lStartX2)/2}" data-sy="${(lStartY1+lStartY2)/2-lblOffset}"
            data-fx="${(Bx+lEndX2)/2 - 12}" data-fy="${(baseY+lEndY2)/2}"
            x="${(lStartX1+lStartX2)/2}" y="${(lStartY1+lStartY2)/2-lblOffset}"
            fill="#FF1B6B" font-size="14" font-weight="900" text-anchor="middle">${s1}</text>
      <!-- 右短邊（青） -->
      <line class="tb-stick" data-role="right"
            data-px1="${rPivotX1}" data-py1="${rPivotY1}" data-px2="${rPivotX2}" data-py2="${rPivotY2}"
            data-fx="${rEndX2}" data-fy="${rEndY2}"
            x1="${rStartX1}" y1="${rStartY1}" x2="${rStartX2}" y2="${rStartY2}"
            stroke="#00F0FF" stroke-width="6" stroke-linecap="round"/>
      <text class="tb-lbl" data-role="rightLbl"
            data-sx="${(rStartX1+rStartX2)/2}" data-sy="${(rStartY1+rStartY2)/2-lblOffset}"
            data-fx="${(Cx+rEndX2)/2 + 12}" data-fy="${(baseY+rEndY2)/2}"
            x="${(rStartX1+rStartX2)/2}" y="${(rStartY1+rStartY2)/2-lblOffset}"
            fill="#00F0FF" font-size="14" font-weight="900" text-anchor="middle">${s2}</text>
      <!-- 間距虛線（不能組才會顯示） -->
      <line class="tb-gap" x1="0" y1="0" x2="0" y2="0"
            stroke="#FF1B6B" stroke-width="2.5" stroke-dasharray="5 4" opacity="0"/>
      <!-- 結果文字 -->
      <text class="tb-result" x="${cx}" y="28" font-size="22" font-weight="900"
            text-anchor="middle" fill="${canForm?'#00FF88':'#FF1B6B'}" opacity="0">
        ${canForm?'✓ 兜起來啦！':'✗ 兜不起來！'}
      </text>
    </svg>
    <div class="tb-hint">↓ 按下去看兩根短邊能不能對到 ↓</div>
    <button class="tb-btn" onclick="animateTri('${id}')">▶ 組組看！</button>
  </div>`;
}

window.animateTri = function(id){
  const root = document.querySelector('.tri-builder[data-id="'+id+'"]');
  if(!root) return;
  const btn = root.querySelector('.tb-btn');
  const sticks = root.querySelectorAll('.tb-stick');
  const lbls = root.querySelectorAll('.tb-lbl');
  const result = root.querySelector('.tb-result');
  const gap = root.querySelector('.tb-gap');
  const can = root.dataset.can === '1';
  const state = root.dataset.state;
  // Toggle: 0=未播 1=已播
  if(state === '0'){
    // 第一段：兩短邊「貼到」最長邊兩端（pivot 位置），300ms
    animatePhase(sticks, lbls, 'start->pivot', 300, ()=>{
      // 第二段：往上折，1200ms
      animatePhase(sticks, lbls, 'pivot->final', 1200, ()=>{
        result.setAttribute('opacity', 1);
        if(can){
          sticks.forEach(s=>s.classList.add('tb-pulse-ok'));
          try{ if(typeof sndCorrect==='function') sndCorrect(); }catch(e){}
        } else {
          // 顯示紅色間距虛線
          const L = root.querySelector('.tb-stick[data-role="left"]');
          const R = root.querySelector('.tb-stick[data-role="right"]');
          gap.setAttribute('x1', +L.getAttribute('x2'));
          gap.setAttribute('y1', +L.getAttribute('y2'));
          gap.setAttribute('x2', +R.getAttribute('x2'));
          gap.setAttribute('y2', +R.getAttribute('y2'));
          gap.setAttribute('opacity', 1);
          sticks.forEach(s=>s.classList.add('tb-pulse-bad'));
          try{ if(typeof sndWrong==='function') sndWrong(); }catch(e){}
        }
      });
    });
    root.dataset.state = '1';
    btn.textContent = '↻ 再來一次';
  } else {
    // reset
    sticks.forEach(s=>{
      s.setAttribute('x1', s.dataset.px1);
      s.setAttribute('y1', s.dataset.py1);
      s.setAttribute('x2', s.dataset.px2);
      s.setAttribute('y2', s.dataset.py2);
      s.classList.remove('tb-pulse-ok','tb-pulse-bad');
    });
    // 再回到起始（startY=92） — 用 reverse animatePhase
    // 簡化：直接重新渲染父節點的 outerHTML（保留 dataset 不變太麻煩） — 改用立即回放
    location.reload();
  }
};

function animatePhase(sticks, lbls, mode, dur, done){
  const start = performance.now();
  const reads = [];
  sticks.forEach(s=>{
    const cur = {x1:+s.getAttribute('x1'), y1:+s.getAttribute('y1'),
                 x2:+s.getAttribute('x2'), y2:+s.getAttribute('y2')};
    let tgt;
    if(mode === 'start->pivot'){
      tgt = {x1:+s.dataset.px1, y1:+s.dataset.py1, x2:+s.dataset.px2, y2:+s.dataset.py2};
    } else {
      tgt = {x1:cur.x1, y1:cur.y1, x2:+s.dataset.fx, y2:+s.dataset.fy};
    }
    reads.push({el:s, cur, tgt});
  });
  const lblReads = [];
  lbls.forEach(l=>{
    const cur = {x:+l.getAttribute('x'), y:+l.getAttribute('y')};
    let tgt;
    if(mode === 'start->pivot'){
      // 標籤中點：pivot 的中點
      const role = l.dataset.role;
      const stick = role === 'leftLbl' ? sticks[0] : sticks[1];
      const mx = (+stick.dataset.px1 + +stick.dataset.px2)/2;
      const my = (+stick.dataset.py1 + +stick.dataset.py2)/2 - 14;
      tgt = {x:mx, y:my};
    } else {
      tgt = {x:+l.dataset.fx, y:+l.dataset.fy};
    }
    lblReads.push({el:l, cur, tgt});
  });
  function frame(now){
    const t = Math.min(1, (now-start)/dur);
    const e = mode === 'start->pivot' ? t : (1 - Math.pow(1-t, 3));
    reads.forEach(r=>{
      r.el.setAttribute('x1', r.cur.x1+(r.tgt.x1-r.cur.x1)*e);
      r.el.setAttribute('y1', r.cur.y1+(r.tgt.y1-r.cur.y1)*e);
      r.el.setAttribute('x2', r.cur.x2+(r.tgt.x2-r.cur.x2)*e);
      r.el.setAttribute('y2', r.cur.y2+(r.tgt.y2-r.cur.y2)*e);
    });
    lblReads.forEach(r=>{
      r.el.setAttribute('x', r.cur.x+(r.tgt.x-r.cur.x)*e);
      r.el.setAttribute('y', r.cur.y+(r.tgt.y-r.cur.y)*e);
    });
    if(t<1) requestAnimationFrame(frame);
    else done && done();
  }
  requestAnimationFrame(frame);
}

/* ===== 段位 ===== */
function getRank(totalCorrect){
  if(totalCorrect===10)return{medal:'👑',name:'三角王者',desc:'10 城全攻佔！稱霸三角王國！',cls:'r-king'};
  if(totalCorrect>=8)return{medal:'💎',name:'白金菁英',desc:'快要稱王了！',cls:'r-platinum'};
  if(totalCorrect>=6)return{medal:'🥇',name:'金牌勇者',desc:'戰績不凡！',cls:'r-gold'};
  if(totalCorrect>=4)return{medal:'🥈',name:'銀牌戰士',desc:'繼續努力！',cls:'r-silver'};
  return{medal:'🥉',name:'銅牌新兵',desc:'你做到最後一題了！',cls:'r-bronze'};
}

/* ===== 狀態 ===== */
const state={
  studentName:'',
  hero:null,
  round:1,
  currentQ:0,
  correct:0,
  attempts:0,
  startTime:null,
  cleared:{r1:false,r2:false},
  r1Correct:0,
  r2Correct:0,
  picked:[]
};
const app=document.getElementById('app');

/* ===== 首頁 ===== */
function renderCover(){
  const heroesHtml=HEROES.map(h=>`
    <div class="hero ${state.hero===h.id?'selected':''}" onclick="pickHero('${h.id}')">
      <span class="emoji">${h.emoji}</span>
      <div class="name">${h.name}</div>
    </div>
  `).join('');
  app.innerHTML=`
    <div class="cover">
      <span class="game-icon">⚔️</span>
      <h1>三角王國攻略戰</h1>
      <div class="sub">8A 數學 3-5 · 邊角戰場</div>
      <div class="tag">⚔ 10 城堡 · 5 英雄 · 段位戰 ⚔</div>

      <div class="name-input">
        <label>👤 戰士代號</label>
        <input id="coverNameInput" type="text" placeholder="輸入名字" autocomplete="off" maxlength="15" value="${state.studentName}">
        <div class="name-hint" id="nameHint">⚠️ 老師才知道誰玩的</div>
      </div>

      <div class="hero-select">
        <div class="title">⚔ 選擇你的英雄 ⚔</div>
        <div class="heroes">${heroesHtml}</div>
      </div>

      <button class="start-btn" onclick="enterRoundMenu()">進入戰場 ▶</button>
    </div>
  `;
  setTimeout(()=>{const inp=document.getElementById('coverNameInput');if(inp&&!state.studentName)inp.focus()},200);
}

function pickHero(id){
  state.hero=id;
  sndStart();
  renderCover();
}

function enterRoundMenu(){
  const inp=document.getElementById('coverNameInput');
  const name=(inp?inp.value:state.studentName).trim();
  if(!name){
    document.getElementById('nameHint').classList.add('show');
    if(inp){inp.style.borderColor='#FF1B6B';inp.focus()}
    return;
  }
  if(!state.hero){
    alert('請選一個英雄！');
    return;
  }
  state.studentName=name;
  sndStart();
  renderRoundMenu();
}

/* ===== 戰役選單 ===== */
function renderRoundMenu(){
  const hero=HEROES.find(h=>h.id===state.hero);
  const r1Locked=false;
  const r2Locked=!state.cleared.r1;
  app.innerHTML=`
    <div class="round-menu">
      <h2>選擇戰役</h2>
      <div class="player-info">
        <span class="emoji">${hero.emoji}</span>
        <span class="name">${hero.name} · ${state.studentName}</span>
      </div>

      <div class="round-cards">
        <div class="round-card r1 ${state.cleared.r1?'cleared':''}" onclick="startRound(1)">
          <div class="badge">ROUND 1</div>
          <span class="icon">🏰</span>
          <div class="name">三邊王國</div>
          <div class="desc">5 個城堡 · 三邊長關係</div>
          <div class="status">${state.cleared.r1?`✅ 已通關（${state.r1Correct}/5）`:'⚔️ 等待你來攻略'}</div>
        </div>
        <div class="round-card r2 ${r2Locked?'locked':''} ${state.cleared.r2?'cleared':''}" onclick="${r2Locked?'showLockedMsg()':'startRound(2)'}">
          <div class="badge">ROUND 2</div>
          <span class="icon">🗼</span>
          <div class="name">外角王國</div>
          <div class="desc">5 個城堡 · 外角應用</div>
          <div class="status">${r2Locked?'🔒 完成 Round 1 解鎖':state.cleared.r2?`✅ 已通關（${state.r2Correct}/5）`:'⚔️ 等待你來攻略'}</div>
        </div>
      </div>

      ${state.cleared.r1&&state.cleared.r2?`
        <button class="start-btn" style="margin-top:18px;font-size:1.1rem;letter-spacing:2px;padding:14px 28px;" onclick="renderVictory()">📜 看通關證</button>
      `:''}
      <button class="start-btn" style="margin-top:14px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);font-size:.95rem;padding:10px 24px;letter-spacing:1px;box-shadow:none;" onclick="renderCover()">← 換英雄</button>
    </div>
  `;
}

function showLockedMsg(){
  alert('🔒 先完成 Round 1 才能解鎖 Round 2 喔！');
}

function startRound(r){
  state.round=r;
  state.currentQ=0;
  state.correct=0;
  state.attempts=0;
  state.startTime=Date.now();
  state.picked=[];
  sndStart();
  renderBattle();
}

/* ===== 戰役畫面 ===== */
function renderBattle(){
  const questions=state.round===1?ROUND1:ROUND2;
  const castles=state.round===1?CASTLES_R1:CASTLES_R2;
  const q=questions[state.currentQ];
  const hero=HEROES.find(h=>h.id===state.hero);

  const castlesHtml=castles.map((c,i)=>{
    let cls='';
    if(i<state.currentQ){
      // 之前的城堡：看 picked 是對是錯
      const pickedRec=state.picked[i];
      if(pickedRec&&pickedRec.correct)cls='captured';
      else cls='failed';
    }else if(i===state.currentQ){
      cls='active';
    }
    return `<div class="castle ${cls}">
      <span class="ic">${c.ic}</span>
      <div class="nm">${c.nm}</div>
    </div>`;
  }).join('');

  const optsHtml=q.options.map((opt,i)=>`
    <button class="option" onclick="pick(${i})">
      <div class="letter">${String.fromCharCode(65+i)}</div>
      <div style="flex:1">${opt.text}</div>
    </button>
  `).join('');

  app.innerHTML=`
    <div class="battle-hud">
      <div class="left">
        <span class="hero-emoji">${hero.emoji}</span>
        <div>
          <div class="stage">ROUND ${state.round} · 第 ${state.currentQ+1} 城 / 5</div>
        </div>
      </div>
      <div class="stats">
        <span class="kills">🚩 ${state.correct}</span>
      </div>
    </div>

    <div class="map-board">
      <div class="map-title">⚔ 戰場地圖 ⚔</div>
      <div class="castles">${castlesHtml}</div>
    </div>

    <div class="q-card">
      <span class="q-banner">${q.banner}</span>
      <div class="q-title">${q.title}</div>
      <div class="q-figure">${q.fig}</div>
      <div class="q-hint">${q.hint}</div>
      <div class="options">${optsHtml}</div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">${state.currentQ===4?'⚔ 結算戰績 ⚔':'下一城 →'}</button>
    </div>
  `;
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(idx){
  const questions=state.round===1?ROUND1:ROUND2;
  const castles=state.round===1?CASTLES_R1:CASTLES_R2;
  const q=questions[state.currentQ];
  const opts=document.querySelectorAll('.option');
  if(opts[0].classList.contains('correct')||opts[0].classList.contains('wrong'))return;
  state.attempts++;
  const ok=q.options[idx].correct;
  state.picked.push({q:state.currentQ+1,picked:idx,correct:ok});
  if(ok){
    opts[idx].classList.add('correct');
    state.correct++;
    sndCorrect();
    setTimeout(()=>{
      sndCapture();
      showCaptureOverlay(castles[state.currentQ]);
    },300);
    document.querySelectorAll('.option').forEach(o=>o.style.pointerEvents='none');
    setTimeout(()=>{
      document.getElementById('nextBtn').classList.add('show');
    },1400);
  }else{
    opts[idx].classList.add('wrong');
    sndWrong();
    // 答錯也算過了這一城（不能無限重試）
    document.querySelectorAll('.option').forEach(o=>o.style.pointerEvents='none');
    // 找出正解標出來
    q.options.forEach((o,i)=>{
      if(o.correct)opts[i].classList.add('correct');
    });
    setTimeout(()=>{
      document.getElementById('nextBtn').classList.add('show');
    },1600);
  }
}

function showCaptureOverlay(c){
  document.getElementById('captureBig').textContent=c.ic;
  document.getElementById('captureName').textContent=`✨ ${c.nm} ✨`;
  const ov=document.getElementById('captureOverlay');
  ov.classList.add('show');
  setTimeout(()=>ov.classList.remove('show'),1200);
}

function nextQ(){
  state.currentQ++;
  if(state.currentQ>=5){
    finishRound();
  }else{
    sndStart();
    renderBattle();
  }
}

function finishRound(){
  // 更新狀態
  if(state.round===1){
    state.cleared.r1=true;
    state.r1Correct=state.correct;
  }else{
    state.cleared.r2=true;
    state.r2Correct=state.correct;
  }
  // 上傳 Firebase
  uploadRoundResult();
  // 顯示結算
  renderRoundResult();
}

function renderRoundResult(){
  const elapsed=Math.floor((Date.now()-state.startTime)/1000);
  const min=Math.floor(elapsed/60);
  const sec=elapsed%60;
  const timeStr=`${min}:${String(sec).padStart(2,'0')}`;
  const hero=HEROES.find(h=>h.id===state.hero);
  const allKings=state.correct===5;

  app.innerHTML=`
    <div class="victory">
      <span class="rank-medal">${allKings?'🏆':'⚔️'}</span>
      <h1>Round ${state.round} 結算！</h1>
      <div style="color:#ccd;font-size:1rem;margin-bottom:8px;">${hero.emoji} ${state.studentName}</div>
      <div class="rank-name" style="font-size:1.4rem;">${allKings?'⚔️ 五城全攻佔！':'戰役完成'}</div>
      <div class="rank-desc">${allKings?'你拿下了整個王國！':'部分城堡已成功攻略，繼續加油 ⚔'}</div>

      <div class="stats">
        <div class="stat"><div class="num">${state.correct}/5</div><div class="lab">🚩 攻佔城堡</div></div>
        <div class="stat"><div class="num">${timeStr}</div><div class="lab">⏱ 戰役時間</div></div>
      </div>

      <div class="upload-status" id="uploadStatus">⏳ 上傳戰績到指揮中心...</div>

      <div class="btn-row">
        ${state.round===1&&!state.cleared.r2?`<button class="primary" onclick="renderRoundMenu()">⚔ 前進 Round 2</button>`:''}
        ${state.round===2?`<button class="primary" onclick="renderVictory()">📜 查看通關證</button>`:''}
        <button onclick="renderRoundMenu()">📋 戰役選單</button>
      </div>
    </div>
  `;
  sndVictory();
  if(state.correct===5)bigFireworks();
}

function renderVictory(){
  const totalCorrect=state.r1Correct+state.r2Correct;
  const rank=getRank(totalCorrect);
  const hero=HEROES.find(h=>h.id===state.hero);

  // 上傳總結算（最終段位）
  uploadFinalResult(totalCorrect,rank);

  app.innerHTML=`
    <div class="victory">
      <span class="rank-medal">${rank.medal}</span>
      <h1>戰役全部完成！</h1>
      <div style="color:#ccd;font-size:1rem;margin-bottom:6px;">${hero.emoji} ${state.studentName}</div>
      <div class="rank-name">${rank.name}</div>
      <div class="rank-desc">${rank.desc}</div>

      <div class="stats">
        <div class="stat"><div class="num">${totalCorrect}/10</div><div class="lab">🚩 總攻佔</div></div>
        <div class="stat"><div class="num">${state.r1Correct}/5</div><div class="lab">Round 1</div></div>
        <div class="stat"><div class="num">${state.r2Correct}/5</div><div class="lab">Round 2</div></div>
      </div>

      <div style="background:rgba(177,0,232,.1);border:2px solid var(--neon-purple);border-radius:14px;padding:14px 16px;margin:14px 0;color:#E5D4FF;font-size:.95rem;line-height:1.65;">
        你今天走進戰場、攻略 10 座城堡，<br>不管攻佔幾座，這份「願意挑戰」就值得記下 ⚔<br>
        老師會在後台看到你的戰績，明天我們一起再過一次 💗
      </div>

      <div class="upload-status" id="uploadStatus">⏳ 上傳總戰績...</div>

      <button class="start-btn" style="margin-top:12px;font-size:1rem;padding:12px 28px;letter-spacing:1px;" onclick="resetAll()">🔄 換英雄重玩</button>
    </div>
  `;
  sndRankUp();
  bigFireworks();
}

function resetAll(){
  state.hero=null;
  state.round=1;
  state.currentQ=0;
  state.correct=0;
  state.attempts=0;
  state.cleared={r1:false,r2:false};
  state.r1Correct=0;
  state.r2Correct=0;
  state.picked=[];
  renderCover();
}

/* ===== Firebase ===== */
function uploadRoundResult(){
  const hero=HEROES.find(h=>h.id===state.hero);
  const record={
    name:state.studentName,
    correct:state.correct,
    total:5,
    rank:`⚔️ ${hero.name} · Round ${state.round}（${state.correct}/5）`,
    time:'',
    coins:state.correct*20,
    combo:0,
    quest:'3-5-conquest',
    round:state.round,
    picked:state.picked,
    hero:state.hero,
    ts:Date.now()
  };
  fetch(`${FB_URL}/${FB_PATH}.json`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(record)
  }).then(res=>{
    const tag=document.getElementById('uploadStatus');
    if(!tag)return;
    if(res.ok){tag.innerHTML='✅ 戰績已送達指揮中心！'}
    else{tag.innerHTML='⚠️ 上傳失敗，告訴老師你的成績';tag.classList.add('warn')}
  }).catch(()=>{
    const tag=document.getElementById('uploadStatus');
    if(tag){tag.innerHTML='⚠️ 上傳失敗，告訴老師你的成績';tag.classList.add('warn')}
  });
}

function uploadFinalResult(totalCorrect,rank){
  const hero=HEROES.find(h=>h.id===state.hero);
  const record={
    name:state.studentName,
    correct:totalCorrect,
    total:10,
    rank:`${rank.medal} ${rank.name}（${totalCorrect}/10）`,
    time:'',
    coins:totalCorrect*30,
    combo:0,
    quest:'3-5-conquest-final',
    r1:state.r1Correct,
    r2:state.r2Correct,
    hero:state.hero,
    ts:Date.now()
  };
  fetch(`${FB_URL}/${FB_PATH}.json`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(record)
  }).then(res=>{
    const tag=document.getElementById('uploadStatus');
    if(!tag)return;
    if(res.ok){tag.innerHTML=`✅ ${rank.name} 段位已封存！`}
    else{tag.innerHTML='⚠️ 上傳失敗';tag.classList.add('warn')}
  });
}

/* ===== 煙火 ===== */
const fwc=document.getElementById('fireworks');
const fwx=fwc.getContext('2d');
let fwp=[];
function rsz(){fwc.width=innerWidth;fwc.height=innerHeight}
rsz();addEventListener('resize',rsz);
function bigFireworks(){
  fwc.style.display='block';
  for(let i=0;i<6;i++)setTimeout(()=>burst(Math.random()*innerWidth,Math.random()*innerHeight*0.6+50),i*300);
  fwLoop();
  setTimeout(()=>{fwc.style.display='none';fwp=[]},5000);
}
function burst(x,y){
  const cs=['#FF1B6B','#00F0FF','#B100E8','#FFD700','#00FF88'];
  for(let i=0;i<40;i++){
    const a=(i/40)*Math.PI*2;
    fwp.push({x,y,vx:Math.cos(a)*(Math.random()*5+2),vy:Math.sin(a)*(Math.random()*5+2),life:75,c:cs[Math.floor(Math.random()*cs.length)]})
  }
}
function fwLoop(){
  fwx.fillStyle='rgba(0,0,0,0.15)';
  fwx.fillRect(0,0,fwc.width,fwc.height);
  fwp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;fwx.fillStyle=p.c;fwx.globalAlpha=p.life/75;fwx.fillRect(p.x,p.y,5,5)});
  fwx.globalAlpha=1;
  fwp=fwp.filter(p=>p.life>0);
  if(fwp.length>0)requestAnimationFrame(fwLoop);
  else if(fwc.style.display==='block')fwc.style.display='none';
}

renderCover();
</script>
