.gem-svg-area{width:100%;max-width:440px;aspect-ratio:5/3;background:rgba(0,0,0,.4);border-radius:16px;padding:14px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08)}

.end-container{text-align:center;max-width:640px}

@keyframes gemSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.end-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px;width:100%}

.race-car{position:fixed;top:38%;left:-340px;z-index:200;width:300px;height:130px;pointer-events:none;opacity:0;filter:drop-shadow(0 10px 20px rgba(255,63,142,.5))}

@keyframes zoomRace{0%{left:-340px;opacity:0;transform:translateY(0) rotate(-3deg)}15%{opacity:1;transform:translateY(-8px) rotate(2deg)}50%{transform:translateY(0) rotate(-2deg)}85%{opacity:1}100%{left:100vw;opacity:0;transform:translateY(-6px) rotate(3deg)}}
@keyframes zoomRaceMega{0%{left:-340px;opacity:0;transform:scale(1.4) translateY(0) rotate(-5deg)}10%{opacity:1}50%{transform:scale(1.4) translateY(-12px) rotate(3deg)}90%{opacity:1}100%{left:100vw;opacity:0;transform:scale(1.4) translateY(0) rotate(5deg)}}

.floating-plus{position:fixed;font-family:'Orbitron',sans-serif;font-weight:900;font-size:64px;color:#FFD93D;text-shadow:0 0 30px rgba(255,217,61,.8),0 4px 16px rgba(0,0,0,.5);z-index:201;pointer-events:none;opacity:0}
.floating-plus.fly{animation:floatPlus 1.4s ease-out forwards}
@keyframes floatPlus{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-80%) scale(1.4)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}

.floating-restart{position:fixed;bottom:20px;right:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 18px;border-radius:999px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;backdrop-filter:blur(10px);z-index:50}
.floating-restart:hover{background:rgba(255,255,255,.2)}

  .gem-title{font-size:24px}

  .question-prompt{font-size:18px}
  .options-grid{grid-template-columns:1fr}
  .end-title{font-size:32px}
  .end-stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .end-stat{padding:12px}
  .end-stat-value{font-size:18px}
  .hud-hero-name{font-size:14px}
  .hud-hero-avatar{width:36px;height:36px}
}

/* ---------- STORAGE ---------- */
function loadSessions(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}catch(e){return [];}}
function saveSession(){
  const sessions = loadSessions();
  const idx = sessions.findIndex(s=>s.id===state.sessionId);
  const record = {
    id:state.sessionId,name:state.playerName,hero:state.hero?.id,heroName:state.hero?.name,
    startTime:state.startTime,endTime:state.endTime||null,
    gemsCollected:[...state.gemsCollected],
    attempts:[...state.attempts],
    totalAttempts:state.attempts.length,
    totalStars:state.gemsCollected.length,
    completed:state.gemsCollected.length===10
  };
  if(idx>=0) sessions[idx]=record; else sessions.push(record);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(sessions));
  // Also push to Firebase Realtime DB (non-blocking, fails silently if offline)
  try {
    if(typeof firebase!=='undefined' && firebase.database){
      firebase.database().ref(FB_PATH+'/'+state.sessionId).set(record);
    }
  } catch(e){ console.warn('Firebase save error:',e); }
}

/* ---------- AUDIO (Web Audio API, no external files) ---------- */
let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,dur,delay=0,type='sine',vol=0.18){
  if(!audioCtx) return;
  const t = audioCtx.currentTime+delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq,t);
  gain.gain.setValueAtTime(vol,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t+dur);
}
function playCorrect(){
  tone(659,0.08,0,'sine',0.2);
  tone(988,0.25,0.08,'sine',0.22);
}
function playWrong(){
  tone(220,0.12,0,'triangle',0.13);
  tone(180,0.18,0.06,'triangle',0.1);
}
function playVroom(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(80,t);
  osc.frequency.linearRampToValueAtTime(260,t+0.25);
  osc.frequency.linearRampToValueAtTime(60,t+0.9);
  gain.gain.setValueAtTime(0.06,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+0.9);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+0.9);
}
function playVictory(){
  const notes=[[523,.18,0],[659,.18,.16],[784,.18,.32],[1047,.4,.48],[1047,.16,.92],[1319,.7,1.1]];
  notes.forEach(([f,d,t])=>tone(f,d,t,'sine',0.22));
}

/* ---------- STARFIELD ---------- */
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeStarfield(){
  canvas.width = window.innerWidth*devicePixelRatio;
  canvas.height = window.innerHeight*devicePixelRatio;
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
  stars = Array.from({length:120},()=>({
    x:Math.random()*canvas.width, y:Math.random()*canvas.height,
    r:Math.random()*1.5+.4, a:Math.random()*.6+.2,
    s:Math.random()*.01+.003
  }));
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    s.a += s.s*(Math.random()>.5?1:-1);
    if(s.a>.9)s.a=.9; if(s.a<.1)s.a=.1;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r*devicePixelRatio,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
window.addEventListener('resize',resizeStarfield);
resizeStarfield();
drawStars();

/* ---------- HERO PICK ---------- */
function renderHeroCards(){
  const row = document.getElementById('hero-row');
  row.innerHTML = '';
  HEROES.forEach((h,i)=>{
    const card = document.createElement('div');
    card.className = 'hero-card';
    card.dataset.idx = i;
    card.style.setProperty('--hero-main',h.palette.main);
    card.style.setProperty('--hero-glow',h.palette.glow);
    card.style.setProperty('--hero-bg-1',h.palette.bg1);
    card.style.setProperty('--hero-bg-2',h.palette.bg2);
    card.innerHTML = `
      <div class="hero-card-inner">
        <div class="hero-card-face hero-card-back"></div>
        <div class="hero-card-face hero-card-front">
          <div class="hero-avatar">${h.avatar}</div>
          <div class="hero-name" style="color:${h.palette.main}">${h.name}</div>
          <div class="hero-tag">${h.tag}</div>
        </div>
      </div>`;
    card.addEventListener('click',()=>onHeroClick(i,card));
    row.appendChild(card);
  });
  // entrance animation (y only, no opacity manipulation to avoid stuck-invisible bug)
  if(typeof gsap !== 'undefined'){
    gsap.fromTo('.hero-card',{y:40},{y:0,duration:.5,stagger:.08,ease:'back.out(1.4)'});
  }
  document.getElementById('btn-confirm-hero').disabled = true;
  state.hero = null;
}

function onHeroClick(idx,card){
  // if already selected, unselect
  if(card.classList.contains('selected')){
    card.classList.remove('selected');
    document.querySelectorAll('.hero-card').forEach(c=>c.classList.remove('dim'));
    document.getElementById('btn-confirm-hero').disabled = true;
    state.hero = null;
    return;
  }
  // first time clicking this card - flip and select
  document.querySelectorAll('.hero-card').forEach(c=>{
    c.classList.remove('selected');
    c.classList.add('dim');
  });
  card.classList.remove('dim');
  if(!card.classList.contains('flipped')){
    card.classList.add('flipped');
  }
  setTimeout(()=>card.classList.add('selected'),300);
  state.hero = HEROES[idx];
  document.getElementById('btn-confirm-hero').disabled = false;
}

document.getElementById('btn-confirm-hero').addEventListener('click',()=>{
  if(!state.hero) return;
  setupGameHUD();
  renderGemMap();
  saveSession();
  switchView('game');
});

  determLabel.className = 'row-label row-label-d';
  determLabel.innerHTML = '<div class="row-num">判別</div><div class="row-hint">6～10 號</div>';
  determLabel.style.cssText = 'position:absolute;left:2%;top:72%;transform:translateY(-50%);text-align:center;color:#FF6BB0;font-weight:900';
  map.appendChild(determLabel);
  GEMS.forEach((gem,i)=>{

    const node = document.createElement('div');
    node.className = 'gem-node';
    node.style.left = pos.x+'%';
    node.style.top = pos.y+'%';
    node.style.setProperty('--gem-glow',gem.color+'AA');
    if(state.gemsCollected.includes(gem.id)) node.classList.add('collected');
    const isNext = !state.gemsCollected.includes(gem.id) && state.gemsCollected.length>0 && state.gemsCollected.length<10;
    // gentle pulse hint on the first uncollected one
    node.innerHTML = `
      <div class="gem-node-shape">${gemIconSVG(gem)}</div>
      <div class="gem-node-label">${gem.label}</div>`;
    if(!state.gemsCollected.includes(gem.id)){
      node.addEventListener('click',()=>openGemModal(gem));
    }
    map.appendChild(node);
    // entrance animation
    // No fromTo scale animation — caused stuck-invisible gems on slow rendering
    if(typeof gsap!=='undefined') gsap.fromTo(node,{y:20},{y:0,duration:.45,delay:.04*i,ease:'back.out(1.6)'});
  });
  // pulse first uncollected
  const firstIdx = GEMS.findIndex(g=>!state.gemsCollected.includes(g.id));
  if(firstIdx>=0){
    map.children[firstIdx].classList.add('pulse-hint');
  }
}

function gemIconSVG(gem){
  const c = gem.color;
  const displayNum = gem.id;
  if(gem.type==='P'){
    return `<svg viewBox="0 0 60 60"><defs><linearGradient id="gp${gem.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#1a0b3d"/></linearGradient></defs><polygon points="30,3 57,30 30,57 3,30" fill="url(#gp${gem.id})" stroke="${c}" stroke-width="2.5"/><polygon points="30,12 48,30 30,48 12,30" fill="${c}" opacity=".35"/><text x="30" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="900" font-family="Orbitron,sans-serif">${displayNum}</text></svg>`;
  } else {
    return `<svg viewBox="0 0 60 60"><defs><radialGradient id="gd${gem.id}"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#1a0b3d"/></radialGradient></defs><circle cx="30" cy="30" r="27" fill="url(#gd${gem.id})" stroke="${c}" stroke-width="2.5"/><circle cx="30" cy="30" r="15" fill="${c}" opacity=".4"/><text x="30" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="900" font-family="Orbitron,sans-serif">${displayNum}</text></svg>`;
  }
}

/* ---------- GEM MODAL ---------- */
const modal = document.getElementById('gem-modal');
const modalContent = document.getElementById('modal-content');
let currentAttemptStart = 0;

function openGemModal(gem){
  state.currentGem = gem;
  state.modalStage = 'play';
  // populate gem visual
  const badge = document.getElementById('gem-badge');
  const typeLabel = gem.type==='P'?`性質 ${gem.num}`:`判別 ${gem.num}`;
  const rarityCN = {common:'普通',rare:'稀有',epic:'史詩',legendary:'傳說'}[gem.rarity];
  badge.className = 'gem-badge type-'+gem.type;
  badge.innerHTML = `${typeLabel}<span class="gem-rarity rarity-${gem.rarity}">${rarityCN}</span>`;
  document.getElementById('gem-title').textContent = gem.label;
  document.getElementById('gem-svg-area').innerHTML = gem.drawSVG();
  document.getElementById('gem-plain').textContent = gem.plain;
  document.getElementById('gem-life').textContent = gem.life;
  modalContent.style.setProperty('--gem-glow',gem.color+'66');

  // populate question + options (visible together with gem visual)
  document.getElementById('question-prompt').textContent = gem.q.prompt;
  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  const letters = ['A','B','C','D'];
  gem.q.opts.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<div class="option-letter">${letters[i]}</div><div>${opt}</div>`;
    btn.addEventListener('click',()=>onOptionClick(i,btn));
    grid.appendChild(btn);
  });

  // show stages
  document.getElementById('stage-play').hidden = false;
  document.getElementById('stage-result').hidden = true;

  modal.hidden = false;
  currentAttemptStart = Date.now();
  if(typeof gsap!=='undefined') gsap.fromTo(modalContent,{scale:.85,y:30},{scale:1,y:0,opacity:1,duration:.45,ease:'back.out(1.4)'});
  else modalContent.style.opacity='1';
}

function closeGemModal(){
  if(typeof gsap!=='undefined') gsap.to(modalContent,{scale:.85,opacity:0,duration:.22});
  // Guaranteed hide via setTimeout, regardless of whether GSAP onComplete fires
  setTimeout(()=>{
    modal.hidden=true;
    // Reset modal-content style for next open
    modalContent.style.opacity='';
    modalContent.style.transform='';
  },240);
}

document.getElementById('modal-close').addEventListener('click',closeGemModal);
document.querySelector('.modal-overlay').addEventListener('click',closeGemModal);

// (Question populated inside openGemModal — no intermediate stage transition.)

function onOptionClick(idx,btn){
  if(btn.disabled) return;
  const gem = state.currentGem;
  const correct = idx===gem.q.correct;
  const timeMs = Date.now()-currentAttemptStart;
  state.attempts.push({gemId:gem.id,correct,timeMs,optionChosen:idx});
  if(correct){
    btn.classList.add('correct');
    playCorrect();
    // floating +1 from button position
    const r = btn.getBoundingClientRect();
    floatPlusOne(r.left+r.width/2, r.top+r.height/2);
    setTimeout(()=>showResult(true),650);
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    playWrong();
    setTimeout(()=>btn.classList.remove('wrong'),400);
    // small message
    const grid = document.getElementById('options-grid');
    let msg = grid.querySelector('.retry-msg');
    if(!msg){
      msg = document.createElement('div');
      msg.className = 'retry-msg';
      msg.style.cssText = 'grid-column:1/-1;text-align:center;color:#FF6BB0;font-size:14px;margin-top:4px;font-weight:700';
      msg.textContent = '差一點點！再試一次 →';
      grid.appendChild(msg);
    }
    gsap.fromTo(msg,{y:-5,opacity:0},{y:0,opacity:1,duration:.3});
    currentAttemptStart = Date.now();
  }
}

function showResult(success){
  state.modalStage='result';
  document.getElementById('stage-play').hidden = true;
  document.getElementById('stage-result').hidden = false;
  const gem = state.currentGem;
  document.getElementById('result-icon').textContent = '★';
  document.getElementById('result-icon').style.color = gem.color;
  document.getElementById('result-icon').style.textShadow = `0 0 24px ${gem.color}`;
  document.getElementById('result-text').textContent = `寶石「${gem.label}」入庫！`;
  document.getElementById('result-skill').textContent = `${state.hero.name} 使出「${state.hero.skillName}」`;
  if(typeof gsap!=='undefined'){
    gsap.fromTo('#result-icon',{scale:0,rotate:-180},{scale:1,rotate:0,duration:.7,ease:'back.out(2)'});
    gsap.fromTo('#result-text',{y:20},{y:0,duration:.5,delay:.2});
  }
  // collect
  if(!state.gemsCollected.includes(gem.id)){
    state.gemsCollected.push(gem.id);
  }
  // confetti + race car (mega if this is the final / 10th gem)
  triggerSkillEffect(state.hero.skillKind,gem.color);
  const isFinal = state.gemsCollected.length===10;
  fireRaceCar(isFinal);
  saveSession();
}

document.getElementById('btn-result-next').addEventListener('click',()=>{
  closeGemModal();
  updateProgress();
  renderGemMap();
  if(state.gemsCollected.length>=10){
    setTimeout(showEndView,500);
  }
  // else: stay on map, teacher calls next student
});

/* ---------- SKILL EFFECTS ---------- */
function triggerSkillEffect(kind,color){
  // base confetti for all
  const opts = {particleCount:80,spread:90,origin:{y:.5},colors:[color,'#FFD93D','#fff']};
  switch(kind){
    case 'slash':
      confetti({...opts,particleCount:60,angle:135,spread:30,startVelocity:55,origin:{x:.1,y:.1}});
      confetti({...opts,particleCount:60,angle:45,spread:30,startVelocity:55,origin:{x:.9,y:.9}});
      break;
    case 'speedline':
      confetti({...opts,particleCount:100,angle:0,spread:20,startVelocity:60,origin:{x:0,y:.5}});
      confetti({...opts,particleCount:100,angle:180,spread:20,startVelocity:60,origin:{x:1,y:.5}});
      break;
    case 'explosion':
      confetti({...opts,particleCount:140,spread:160,startVelocity:50});
      break;
    case 'hearts':
      confetti({...opts,particleCount:60,spread:60,gravity:.6,scalar:1.2,shapes:['circle']});
      confetti({...opts,particleCount:40,spread:120,startVelocity:25,gravity:.3,scalar:.9,colors:['#FFB3D1','#FFE8F0','#FFD93D']});
      break;
    case 'stardust':
      confetti({...opts,particleCount:100,spread:360,startVelocity:30,gravity:.4,colors:['#FFD93D','#7C8BFF','#fff']});
      break;
  }
}

/* ---------- END VIEW ---------- */
function showEndView(){
  state.endTime = Date.now();
  saveSession();
  // populate
  document.getElementById('end-hero-name').textContent = state.hero.name;
  document.getElementById('end-hero-name').style.color = state.hero.palette.main;
  document.getElementById('end-stars').textContent = `${state.gemsCollected.length}/10`;
  document.getElementById('end-attempts').textContent = state.attempts.length;
  // gem display
  const display = document.getElementById('end-gem-display');
  display.innerHTML = '';
  GEMS.forEach(gem=>{
    const div = document.createElement('div');
    div.className = 'end-gem';
    div.innerHTML = gemIconSVG(gem);
    display.appendChild(div);
  });
  switchView('end');
  // EPIC finale: confetti bursts + victory melody + race car parade
  setTimeout(()=>{
    const colors = ['#FFD93D','#FF6BB0','#27D7FF','#9B5BFF','#fff','#FFB300'];
    confetti({particleCount:260,spread:170,origin:{y:.35},colors});
    playVictory();
    setTimeout(()=>confetti({particleCount:160,spread:120,angle:60,origin:{x:0,y:.6},colors}),250);
    setTimeout(()=>confetti({particleCount:160,spread:120,angle:120,origin:{x:1,y:.6},colors}),500);
    setTimeout(()=>confetti({particleCount:200,spread:360,startVelocity:35,origin:{y:.5},colors,scalar:1.2}),900);
    setTimeout(()=>fireRaceCar(true),300);
    setTimeout(()=>fireRaceCar(false),1500);
    setTimeout(()=>confetti({particleCount:140,spread:140,origin:{y:.4},colors}),1800);
  },200);
  if(typeof gsap!=='undefined'){
    gsap.fromTo('.end-stat',{y:30},{y:0,duration:.5,stagger:.15,delay:.3});
    gsap.fromTo('.end-next-step',{scale:.9},{scale:1,duration:.5,delay:1});
  }
}

/* ---------- RESTART ---------- */
function restartForNextPlayer(){
  if(state.gemsCollected.length>0 && state.gemsCollected.length<10){
    if(!confirm('還沒蒐集完，確定要換下一位玩家嗎？')) return;
    state.endTime = Date.now();
    saveSession();
  }
  resetState();
  switchView('start');
}

document.getElementById('btn-restart').addEventListener('click',restartForNextPlayer);
document.getElementById('floating-restart').addEventListener('click',restartForNextPlayer);

/* ---------- INIT ---------- */
window.addEventListener('load',()=>{
  // entrance: animate position only, NEVER touch opacity (so elements stay visible even if GSAP fails)
  if(typeof gsap !== 'undefined'){
    gsap.fromTo('.title-block',{y:-20},{y:0,duration:.5,ease:'power2.out'});
    gsap.fromTo('.name-block',{y:20},{y:0,duration:.5,delay:.1,ease:'power2.out'});
  }
});
</script>
