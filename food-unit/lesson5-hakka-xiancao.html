<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>仙草大解密！學習單 — 客家飲食文化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    background: linear-gradient(135deg, #FFFCF5 0%, #F5E6D3 100%);
    color: #6B3A1F;
    min-height: 100vh;
    line-height: 1.6;
    user-select: none;
    -webkit-user-select: none;
  }
  body { padding: 15px; }
  .container { max-width: 780px; margin: 0 auto; }

  .header {
    background: linear-gradient(135deg, #5D4037 0%, #8B4513 100%);
    color: #FFFCF5;
    padding: 22px;
    border-radius: 20px;
    margin-bottom: 15px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(93,64,55,0.3);
  }
  h1 { font-size: 1.9rem; margin-bottom: 6px; }
  .subtitle { font-size: 1rem; color: #F5E6D3; opacity: 0.95; }

  .teacher-banner {
    background: #D32F2F;
    color: white;
    padding: 10px;
    text-align: center;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 1.1rem;
    font-weight: bold;
    display: none;
  }
  body.teacher-mode .teacher-banner { display: block; }

  .name-box {
    background: #FFF8E7;
    border: 3px solid #D4A574;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .name-box label { font-size: 1.2rem; font-weight: bold; color: #8B4513; min-width: 80px; }
  .name-box input {
    flex: 1;
    min-width: 150px;
    font-size: 1.3rem;
    padding: 12px 15px;
    border: 2px solid #D4A574;
    border-radius: 10px;
    font-family: inherit;
    color: #6B3A1F;
    background: #FFFCF5;
    min-height: 50px;
  }
  .name-box input:focus { outline: none; border-color: #8B4513; background: #FFFDF8; }

  .progress-box {
    background: #FFF8E7;
    border: 3px solid #D4A574;
    border-radius: 50px;
    padding: 5px;
    margin-bottom: 15px;
    overflow: hidden;
  }
  .progress-bar {
    background: linear-gradient(90deg, #D4A574 0%, #8B4513 100%);
    height: 35px;
    border-radius: 50px;
    width: 0%;
    transition: width 0.4s ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 1.1rem;
    min-width: 80px;
  }

  .question-card {
    background: #FFFCF5;
    border: 4px solid #D4A574;
    border-radius: 20px;
    padding: 25px 20px;
    margin-bottom: 15px;
    box-shadow: 0 6px 16px rgba(139,69,19,0.15);
    animation: fadeIn 0.4s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .q-num {
    background: #5D4037;
    color: white;
    padding: 8px 18px;
    border-radius: 50px;
    font-size: 1.2rem;
    font-weight: bold;
    display: inline-block;
    margin-bottom: 12px;
  }
  .q-title {
    font-size: 1.5rem;
    color: #6B3A1F;
    font-weight: bold;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .q-hint {
    font-size: 1rem;
    color: #A0522D;
    margin-bottom: 18px;
    font-style: italic;
  }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .options.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .option {
    background: #FFF8E7;
    border: 3px solid #D4A574;
    border-radius: 15px;
    padding: 18px 20px;
    font-size: 1.4rem;
    color: #6B3A1F;
    cursor: pointer;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    transition: transform 0.15s, background 0.2s, border-color 0.2s;
    position: relative;
    font-weight: 500;
    line-height: 1.4;
  }
  .option:active { transform: scale(0.97); }
  .option.selected {
    background: #F5E6D3;
    border-color: #5D4037;
    border-width: 4px;
    box-shadow: 0 4px 12px rgba(93,64,55,0.3);
    transform: scale(1.02);
  }
  .option.selected::before {
    content: "✓";
    position: absolute;
    top: 5px;
    right: 10px;
    color: #5D4037;
    font-size: 1.8rem;
    font-weight: bold;
    animation: checkPop 0.3s ease-out;
  }
  @keyframes checkPop {
    0% { transform: scale(0); }
    60% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  body.teacher-mode .option.correct::after {
    content: "✅ 正解";
    position: absolute;
    top: -12px;
    right: 10px;
    background: #D32F2F;
    color: white;
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .option .emoji { font-size: 2.2rem; }

  .match-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 10px;
  }
  .match-col { display: flex; flex-direction: column; gap: 12px; }
  .match-col h3 {
    text-align: center;
    font-size: 1.15rem;
    color: #5D4037;
    padding-bottom: 8px;
    border-bottom: 2px solid #D4A574;
    margin-bottom: 5px;
  }
  .match-item {
    background: #FFF8E7;
    border: 3px solid #D4A574;
    border-radius: 12px;
    padding: 16px 10px;
    font-size: 1.1rem;
    font-weight: bold;
    color: #6B3A1F;
    cursor: pointer;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: all 0.2s;
    line-height: 1.4;
  }
  .match-item:active { transform: scale(0.97); }
  .match-item.active {
    background: #FFD700;
    border-color: #5D4037;
    border-width: 4px;
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(255,215,0,0.5);
  }
  .match-item.matched {
    background: linear-gradient(135deg, #FFD700 0%, #D4A574 100%);
    border-color: #5D4037;
    color: white;
    cursor: not-allowed;
    pointer-events: none;
  }
  .match-item.matched::before {
    content: "🔗 ";
    font-size: 1rem;
    margin-right: 3px;
  }

  .nav-btns { display: flex; gap: 10px; margin-top: 10px; }
  .btn {
    flex: 1;
    padding: 20px;
    font-size: 1.4rem;
    font-weight: bold;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    min-height: 65px;
    font-family: inherit;
    transition: transform 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #D4A574 0%, #8B4513 100%);
    color: white;
    box-shadow: 0 4px 12px rgba(139,69,19,0.3);
  }
  .btn-secondary { background: #FFF8E7; color: #5D4037; border: 3px solid #D4A574; }
  .btn-back { background: #FFF8E7; color: #5D4037; border: 3px solid #D4A574; flex: 0.5; }

  .result-card {
    background: #FFFCF5;
    border: 4px solid #D4A574;
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(139,69,19,0.2);
  }
  .score-label { font-size: 1.3rem; color: #5D4037; margin-bottom: 10px; }
  .score-big {
    font-size: 4.5rem;
    font-weight: bold;
    color: #5D4037;
    margin: 15px 0;
    animation: scoreIn 0.8s ease-out;
  }
  @keyframes scoreIn {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  .score-msg {
    font-size: 1.6rem;
    color: #6B3A1F;
    margin: 20px 0;
    padding: 20px;
    background: #FFF8E7;
    border-radius: 15px;
    border: 3px solid #D4A574;
    line-height: 1.6;
  }
  .score-emoji { font-size: 4rem; display: block; margin-bottom: 10px; }
  .passport {
    background: #FFF8E7;
    border: 3px dashed #8B4513;
    border-radius: 15px;
    padding: 16px;
    margin: 16px 0;
    font-size: 1.1rem;
  }
  .passport .stamps {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  .stamp {
    background: white;
    border: 2px solid #D4A574;
    border-radius: 10px;
    padding: 8px 4px;
    font-size: 0.85rem;
    color: #6B3A1F;
    line-height: 1.2;
  }
  .stamp.done {
    background: linear-gradient(135deg, #FFD700 0%, #D4A574 100%);
    color: white;
    font-weight: bold;
  }
  .stamp .icon { font-size: 1.4rem; display: block; margin-bottom: 2px; }

  #fireworks {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none; z-index: 9999;
    display: none;
  }

  .answer-review {
    background: #FFF8E7;
    border: 2px solid #D4A574;
    border-radius: 12px;
    padding: 12px;
    margin-top: 15px;
    text-align: left;
    font-size: 1rem;
  }
  .answer-review .row {
    padding: 6px 0;
    border-bottom: 1px dashed #D4A574;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .answer-review .row:last-child { border-bottom: none; }
  .mark-ok { color: #388E3C; font-weight: bold; }
  .mark-x { color: #D32F2F; font-weight: bold; }

  @media (max-width: 500px) {
    h1 { font-size: 1.5rem; }
    .q-title { font-size: 1.3rem; }
    .option { font-size: 1.2rem; padding: 16px 12px; }
    .score-big { font-size: 3.5rem; }
    .score-msg { font-size: 1.3rem; }
    .match-item { font-size: 1rem; padding: 14px 8px; }
    .passport .stamps { grid-template-columns: repeat(5, 1fr); }
    .stamp { font-size: 0.7rem; padding: 6px 2px; }
  }
</style>
</head>
<body>
<canvas id="fireworks"></canvas>

<div class="container">
  <div class="teacher-banner">👩‍🏫 老師模式：正確答案已標記 ✅</div>

  <div class="header">
    <h1>🌿 仙草大解密！學習單</h1>
    <div class="subtitle">客家飲食文化・芎林國中 集中式特教班 A 組</div>
  </div>

  <div class="name-box">
    <label>👤 姓名：</label>
    <input type="text" id="studentName" placeholder="請輸入名字（可以跳過）" autocomplete="off">
  </div>

  <div class="progress-box">
    <div class="progress-bar" id="progressBar">0 / 10</div>
  </div>

  <div id="quizArea"></div>
</div>

<script>
const QUESTIONS = [
  {
    type: 'single',
    title: '仙草茶是什麼顏色？',
    hint: '想想你看過的仙草',
    options: [
      { text: '紅色', emoji: '🔴' },
      { text: '黑色', emoji: '⚫', correct: true },
      { text: '藍色', emoji: '🔵' },
    ]
  },
  {
    type: 'single',
    title: '仙草植物本身（種在田裡）是什麼顏色？',
    hint: '不是黑色喔！',
    options: [
      { text: '黑色', emoji: '⚫' },
      { text: '綠色', emoji: '🟢', correct: true },
      { text: '黃色', emoji: '🟡' },
    ]
  },
  {
    type: 'single',
    title: '全台灣 80% 的仙草種在哪裡？',
    hint: '就在我們學校隔壁！',
    options: [
      { text: '台北', emoji: '🏙️' },
      { text: '關西', emoji: '⭐', correct: true },
      { text: '高雄', emoji: '🌊' },
    ]
  },
  {
    type: 'single',
    title: '關西在我們學校（芎林）的哪裡？',
    hint: '走路就快到了',
    options: [
      { text: '很遠的地方', emoji: '🚗' },
      { text: '就在隔壁！', emoji: '📍', correct: true },
      { text: '要坐飛機', emoji: '✈️' },
    ]
  },
  {
    type: 'single',
    title: '關西和芎林是什麼地形？',
    hint: '我們上學會走上坡下坡',
    options: [
      { text: '平地（像操場）', emoji: '🏟️' },
      { text: '丘陵（小山坡）', emoji: '⛰️', correct: true },
      { text: '高山（像玉山）', emoji: '🏔️' },
    ]
  },
  {
    type: 'single',
    title: '為什麼丘陵適合種仙草？',
    hint: '想想水會往哪流',
    options: [
      { text: '因為水很多', emoji: '💧' },
      { text: '排水好，不會積水', emoji: '🏔️', correct: true },
      { text: '因為很熱', emoji: '🥵' },
    ]
  },
  {
    type: 'single',
    title: '新竹秋天那種超大、把人吹到快飛走的風叫什麼？',
    hint: '新竹特產的風',
    options: [
      { text: '九降風', emoji: '🌬️', correct: true },
      { text: '海風', emoji: '🌊' },
      { text: '寒流', emoji: '❄️' },
    ]
  },
  {
    type: 'single',
    title: '九降風對仙草有什麼幫助？',
    hint: '不用花錢的烘乾機',
    options: [
      { text: '天然風乾仙草', emoji: '🌬️', correct: true },
      { text: '幫仙草澆水', emoji: '💧' },
      { text: '讓仙草結冰', emoji: '❄️' },
    ]
  },
  {
    type: 'single',
    title: '仙草是哪個族群的食物？',
    hint: '我們芎林關西很多',
    options: [
      { text: '原住民族', emoji: '🏹' },
      { text: '客家人', emoji: '🏘️', correct: true },
      { text: '日本人', emoji: '🍣' },
    ]
  },
  {
    type: 'match',
    title: '連連看！住的地方 → 吃的食物',
    hint: '先點左邊，再點右邊配對',
    left: [
      { id: 'a', text: '山上缺水', emoji: '🏔️' },
      { id: 'b', text: '平地有水', emoji: '🌾' },
      { id: 'c', text: '北方寒冷', emoji: '❄️' },
      { id: 'd', text: '丘陵有風有霧', emoji: '⛰️' },
    ],
    right: [
      { id: 'r1', text: '小米' },
      { id: 'r2', text: '白飯' },
      { id: 'r3', text: '蔥油餅' },
      { id: 'r4', text: '仙草' },
    ],
    correct: { a: 'r1', b: 'r2', c: 'r3', d: 'r4' }
  }
];

const state = {
  current: 0,
  answers: Array(QUESTIONS.length).fill(null),
  matchSelected: null,
};
const isTeacher = new URLSearchParams(location.search).get('teacher') === 'true';
if (isTeacher) document.body.classList.add('teacher-mode');

let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}
function beep(freq, duration, type='sine', volume=0.15) {
  const ctx = getAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + duration);
}
function soundTap() { beep(660, 0.1, 'sine', 0.12); }
function soundMatch() { beep(523, 0.12, 'sine', 0.15); setTimeout(() => beep(784, 0.15, 'sine', 0.15), 100); }
function soundCelebrate() {
  const notes = [523, 659, 784, 1046];
  notes.forEach((n, i) => setTimeout(() => beep(n, 0.2, 'triangle', 0.18), i * 130));
}

const quizArea = document.getElementById('quizArea');
const progressBar = document.getElementById('progressBar');

function updateProgress() {
  const total = QUESTIONS.length;
  const done = Math.min(state.current, total);
  progressBar.style.width = (done / total * 100) + '%';
  progressBar.textContent = `${done} / ${total}`;
}

function render() {
  if (state.current >= QUESTIONS.length) { renderResult(); return; }
  updateProgress();
  const q = QUESTIONS[state.current];
  if (q.type === 'single') renderSingle(q);
  else if (q.type === 'match') renderMatch(q);
}

function buildCard(q, innerHTML) {
  return `
    <div class="question-card">
      <span class="q-num">第 ${state.current + 1} 題</span>
      <div class="q-title">${q.title}</div>
      <div class="q-hint">${q.hint}</div>
      ${innerHTML}
      <div class="nav-btns">
        ${state.current > 0 ? '<button class="btn btn-back" onclick="prevQuestion()">← 上一題</button>' : ''}
        <button class="btn btn-primary" onclick="nextQuestion()">${state.current === QUESTIONS.length - 1 ? '看成績 🎉' : '下一題 →'}</button>
      </div>
    </div>
  `;
}

function renderSingle(q) {
  const selected = state.answers[state.current];
  const html = `<div class="options">
    ${q.options.map((opt, i) => `
      <div class="option ${selected === i ? 'selected' : ''} ${isTeacher && opt.correct ? 'correct' : ''}"
           onclick="pickSingle(${i})">
        <span class="emoji">${opt.emoji}</span>
        <span>${opt.text}</span>
      </div>
    `).join('')}
  </div>`;
  quizArea.innerHTML = buildCard(q, html);
}

function renderMatch(q) {
  const pairs = state.answers[state.current] || {};
  const leftHtml = q.left.map(item => {
    const matched = pairs[item.id];
    const active = state.matchSelected === item.id;
    return `<div class="match-item ${matched ? 'matched' : ''} ${active ? 'active' : ''}"
            onclick="pickMatchLeft('${item.id}')">
      <div><span style="font-size:1.6rem;display:block;">${item.emoji}</span>${item.text}</div>
    </div>`;
  }).join('');
  const usedRights = Object.values(pairs);
  const rightHtml = q.right.map(item => {
    const matched = usedRights.includes(item.id);
    const isCorrect = isTeacher && Object.entries(q.correct).find(([,v]) => v === item.id);
    return `<div class="match-item ${matched ? 'matched' : ''}"
            onclick="pickMatchRight('${item.id}')">
      <div>${item.text}${isCorrect ? '<br><small style="color:#D32F2F;">↔ '+q.left.find(l=>l.id===isCorrect[0]).text+'</small>' : ''}</div>
    </div>`;
  }).join('');

  const html = `
    <div class="match-area">
      <div class="match-col"><h3>住的地方</h3>${leftHtml}</div>
      <div class="match-col"><h3>吃的食物</h3>${rightHtml}</div>
    </div>
    <div style="text-align:center;margin-top:15px;">
      <button class="btn btn-secondary" onclick="resetMatch()" style="padding:12px 25px;font-size:1rem;min-height:auto;">🔄 重新配對</button>
    </div>
  `;
  quizArea.innerHTML = buildCard(q, html);
}

function pickSingle(idx) {
  state.answers[state.current] = idx;
  soundTap();
  render();
}
function pickMatchLeft(id) {
  const pairs = state.answers[state.current] || {};
  if (pairs[id]) return;
  state.matchSelected = state.matchSelected === id ? null : id;
  soundTap();
  render();
}
function pickMatchRight(id) {
  if (!state.matchSelected) { soundTap(); return; }
  const pairs = state.answers[state.current] || {};
  if (Object.values(pairs).includes(id)) return;
  pairs[state.matchSelected] = id;
  state.answers[state.current] = pairs;
  state.matchSelected = null;
  soundMatch();
  render();
}
function resetMatch() {
  state.answers[state.current] = {};
  state.matchSelected = null;
  soundTap();
  render();
}
function nextQuestion() {
  state.current++;
  state.matchSelected = null;
  soundTap();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}
function prevQuestion() {
  if (state.current > 0) {
    state.current--;
    state.matchSelected = null;
    soundTap();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }
}

function scoreQuestion(q, ans) {
  if (ans === null || ans === undefined) return false;
  if (q.type === 'single') return q.options[ans] && q.options[ans].correct === true;
  if (q.type === 'match') {
    if (!ans || typeof ans !== 'object') return false;
    return Object.keys(q.correct).every(k => ans[k] === q.correct[k]);
  }
  return false;
}

function renderResult() {
  updateProgress();
  let score = 0;
  const details = QUESTIONS.map((q, i) => {
    const ok = scoreQuestion(q, state.answers[i]);
    if (ok) score++;
    return { q: i+1, title: q.title, ok };
  });

  let msg, emoji, celebrate = false;
  if (score === 10) { msg = '你是仙草大師！🏆'; emoji = '🎉'; celebrate = true; }
  else if (score >= 8) { msg = '超棒的！客家美食偵探！'; emoji = '🌟'; celebrate = true; }
  else if (score >= 5) { msg = '很好！繼續加油！'; emoji = '💪'; }
  else { msg = '沒關係，下次會更好！'; emoji = '😊'; }

  const name = document.getElementById('studentName').value.trim();
  const greet = name ? `${name}，` : '';

  quizArea.innerHTML = `
    <div class="result-card">
      <div class="score-label">${greet}你答對了</div>
      <div class="score-big">${score} / 10</div>
      <div class="score-msg">
        <span class="score-emoji">${emoji}</span>
        ${msg}
      </div>
      <div class="passport">
        🎫 <b>食物護照進度</b>
        <div class="stamps">
          <div class="stamp done"><span class="icon">🌾</span>小米</div>
          <div class="stamp done"><span class="icon">🍛</span>咖哩</div>
          <div class="stamp done"><span class="icon">🥞</span>蔥油餅</div>
          <div class="stamp done"><span class="icon">🌿</span>仙草</div>
          <div class="stamp"><span class="icon">❓</span>下次</div>
        </div>
        <div style="margin-top:10px;font-size:1rem;color:#5D4037;">已蓋 4 個章！還有 1 個神秘食物～</div>
      </div>
      <div class="answer-review">
        ${details.map(d => `
          <div class="row">
            <span>第 ${d.q} 題：${d.title}</span>
            <span class="${d.ok ? 'mark-ok' : 'mark-x'}">${d.ok ? '✓ 答對' : '✗ 答錯'}</span>
          </div>
        `).join('')}
      </div>
      <div class="nav-btns" style="margin-top:20px;">
        <button class="btn btn-primary" onclick="restart()">🔄 再玩一次</button>
        <button class="btn btn-secondary" onclick="location.href='../index.html'">🏠 回首頁</button>
      </div>
    </div>
  `;

  if (celebrate) {
    soundCelebrate();
    setTimeout(launchFireworks, 200);
  }
}

function restart() {
  state.current = 0;
  state.answers = Array(QUESTIONS.length).fill(null);
  state.matchSelected = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* 煙火 */
const fwCanvas = document.getElementById('fireworks');
const fwCtx = fwCanvas.getContext('2d');
let fwParticles = [];
function resizeFW() { fwCanvas.width = innerWidth; fwCanvas.height = innerHeight; }
resizeFW();
addEventListener('resize', resizeFW);

function launchFireworks() {
  fwCanvas.style.display = 'block';
  for (let i = 0; i < 4; i++) {
    setTimeout(() => burst(Math.random() * innerWidth, Math.random() * innerHeight * 0.6 + 50), i * 350);
  }
  fwLoop();
  setTimeout(() => { fwCanvas.style.display = 'none'; fwParticles = []; }, 3000);
}
function burst(x, y) {
  const colors = ['#FFD700', '#D4A574', '#8B4513', '#FF6B6B', '#5D4037'];
  for (let i = 0; i < 30; i++) {
    const a = (i / 30) * Math.PI * 2;
    fwParticles.push({
      x, y,
      vx: Math.cos(a) * (Math.random() * 4 + 2),
      vy: Math.sin(a) * (Math.random() * 4 + 2),
      life: 60,
      color: colors[i % colors.length]
    });
  }
}
function fwLoop() {
  fwCtx.fillStyle = 'rgba(0,0,0,0.1)';
  fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
  fwParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--;
    fwCtx.fillStyle = p.color;
    fwCtx.globalAlpha = p.life / 60;
    fwCtx.fillRect(p.x, p.y, 3, 3);
  });
  fwCtx.globalAlpha = 1;
  fwParticles = fwParticles.filter(p => p.life > 0);
  if (fwParticles.length > 0) requestAnimationFrame(fwLoop);
}

render();
</script>
