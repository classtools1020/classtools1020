<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>平行四邊形 PRO · 賽車寶箱大冒險 (6/2)</title>
<style>
  /* === 角落生物動森療癒風 === */
  /* 奶油白 + 粉藍黃綠 + Q 彈動畫 + 不刺激不閃爍 */
  :root {
    --bg: #FFF8F0;              /* 奶油白底 */
    --paper: #FFFFFF;
    --primary: #FFB3C7;         /* 草莓粉 */
    --primary-soft: #FFD6E0;
    --accent: #A5D8FF;          /* 天空藍 */
    --accent-soft: #CCE7FF;
    --gold: #FFE066;            /* 鵝黃 */
    --gold-soft: #FFF3B8;
    --mint: #B8E6B8;            /* 薄荷綠 */
    --lavender: #D0BFFF;        /* 薰衣草紫 */
    --orange: #FFA94D;          /* 暖橘 */
    --success: #95D5B2;
    --success-soft: #C6E9CF;
    --warning: #FFD23F;
    --danger: #FFA8A8;          /* 柔粉紅取代正紅 */
    --text: #4A4458;            /* 深紫灰，不用純黑 */
    --text-dim: #918CA1;
    --ink: #4A4458;
    /* 兼容 */
    --bg-dark: #FFF8F0;
    --bg-mid: #FFEFE0;
    --L1-color: #6B9DD9;
    --L2-color: #FF9FAE;
    --text-soft: #918CA1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{
    font-family:'M PLUS Rounded 1c','Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;overflow-x:hidden;
  }
  /* 奶油白 + 點點紋路 + 柔光（不會閃） */
  body{
    background:
      radial-gradient(circle at 15% 20%, rgba(255,179,199,0.15) 0, transparent 28%),
      radial-gradient(circle at 85% 75%, rgba(165,216,255,0.15) 0, transparent 30%),
      radial-gradient(circle at 50% 50%, rgba(208,191,255,0.08) 0, transparent 40%),
      radial-gradient(circle, rgba(255,224,102,0.06) 1.5px, transparent 1.5px) 0 0 / 24px 24px,
      var(--bg);
    background-attachment:fixed;
  }

  .app{max-width:820px;margin:0 auto;padding:16px;min-height:100vh;position:relative;z-index:1}

  /* === HUD：可愛圓潤橫條 === */
  .hud{
    display:flex;justify-content:space-between;align-items:center;
    background:white;color:var(--text);
    border:none;border-radius:24px;
    padding:10px 18px;margin-bottom:14px;
    box-shadow:0 4px 0 var(--primary-soft), 0 8px 20px rgba(255,179,199,0.25);
  }
  .hud-left{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .hud-nick{
    font-weight:900;color:var(--primary);font-size:15px;letter-spacing:1px;
  }
  .hud-stat{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--text);font-weight:800}
  .hud-stat .icon{font-size:18px}
  .hud-coins{color:var(--orange)}

  /* === 進度條：圓圓的彩色 dot === */
  .progress{display:flex;gap:8px}
  .pdot{
    width:34px;height:34px;border-radius:50%;background:white;
    border:2.5px solid var(--primary-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;color:var(--text-dim);
    box-shadow:0 2px 0 var(--primary-soft);
    transition:transform 0.3s;
  }
  .pdot.done{
    background:var(--success);color:white;border-color:var(--success);
    box-shadow:0 2px 0 #6FB68A;
  }
  .pdot.active{
    background:var(--primary);color:white;border-color:var(--primary);
    transform:scale(1.18);
    box-shadow:0 3px 0 #FF8FA8;
    animation:gentle-bounce 2s ease-in-out infinite;
  }
  @keyframes gentle-bounce{
    0%,100%{transform:scale(1.18) translateY(0)}
    50%{transform:scale(1.18) translateY(-3px)}
  }

  /* === 主卡片：白底大圓角 + 柔影 + 角落生物貼紙 === */
  .card{
    background:white;
    border:none;
    border-radius:28px;
    padding:24px;
    box-shadow:0 6px 0 var(--primary-soft), 0 12px 28px rgba(255,179,199,0.2);
    animation:cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    position:relative;
  }
  /* 卡片右上小白熊（角落生物）— 緩慢可預測彈跳 */
  .card::before{
    content:'🐻';position:absolute;top:-22px;right:-6px;
    font-size:44px;
    animation:bear-float 3s ease-in-out infinite;
    transform-origin:center bottom;
  }
  /* 卡片左下小企鵝 */
  .card::after{
    content:'🐧';position:absolute;bottom:-18px;left:-8px;
    font-size:36px;
    animation:peng-float 3.5s ease-in-out infinite;
  }
  @keyframes bear-float{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-6px) rotate(-4deg)}
  }
  @keyframes peng-float{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-5px) rotate(4deg)}
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(20px) scale(0.95)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  /* === 標題：粉橘漸層字 + 圓潤厚重 === */
  h1{
    font-size:clamp(28px,7vw,42px);
    background:linear-gradient(135deg, #FFB3C7 0%, #FFA94D 50%, #FFD23F 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-align:center;
    letter-spacing:2px;margin-bottom:8px;
    font-weight:900;
    padding:4px 0;
    filter:drop-shadow(0 3px 0 rgba(74,68,88,0.15));
  }
  h2{font-size:clamp(20px,5vw,26px);color:var(--primary);margin-bottom:10px;font-weight:900}
  h3{font-size:clamp(16px,4vw,19px);color:var(--text);margin-bottom:8px;font-weight:800}
  .subtitle{text-align:center;color:var(--text-dim);font-size:15px;margin-bottom:14px;font-weight:700}

  /* === 按鈕：糖果 Q 彈，按下會塌（療癒感）=== */
  .btn{
    min-height:56px;padding:14px 28px;
    background:linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    color:white;border:none;
    font-size:17px;font-weight:900;letter-spacing:1px;
    cursor:pointer;font-family:inherit;
    border-radius:28px;
    box-shadow:0 5px 0 #B89BB3, 0 8px 20px rgba(255,179,199,0.4);
    transition:transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
    min-width:120px;
    text-shadow:0 1px 0 rgba(0,0,0,0.1);
  }
  .btn:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 0 #B89BB3, 0 12px 24px rgba(255,179,199,0.5);
  }
  .btn:active{transform:translateY(5px);box-shadow:0 0 0 #B89BB3, 0 2px 8px rgba(0,0,0,0.1)}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:0 5px 0 #B89BB3, 0 8px 20px rgba(255,179,199,0.4)}
  .btn-gold{background:linear-gradient(135deg, var(--gold) 0%, var(--orange) 100%);box-shadow:0 5px 0 #B88A1F, 0 8px 20px rgba(255,224,102,0.5);color:white}
  .btn-gold:hover{box-shadow:0 8px 0 #B88A1F, 0 12px 24px rgba(255,224,102,0.6)}
  .btn-gold:active{box-shadow:0 0 0 #B88A1F, 0 2px 8px rgba(0,0,0,0.1)}
  .btn-ghost{background:white;color:var(--text);box-shadow:0 4px 0 var(--text-dim), 0 6px 14px rgba(0,0,0,0.06)}
  .btn-ghost:hover{box-shadow:0 6px 0 var(--text-dim), 0 8px 18px rgba(0,0,0,0.1)}
  .btn-ghost:active{box-shadow:0 0 0 var(--text-dim)}
  .btn-warning{background:linear-gradient(135deg, var(--gold) 0%, #FFAD3D 100%);box-shadow:0 5px 0 #B88A1F, 0 8px 20px rgba(255,210,63,0.5);color:white}

  /* === Input：療癒筆記本感 === */
  .input{
    width:100%;padding:16px 22px;
    background:#FFFEF7;
    border:3px solid var(--primary-soft);
    border-radius:20px;
    box-shadow:0 4px 0 var(--primary-soft), inset 0 2px 4px rgba(0,0,0,0.03);
    font-size:20px;color:var(--text);font-family:inherit;
    text-align:center;font-weight:800;letter-spacing:1px;
  }
  .input:focus{outline:none;border-color:var(--primary);background:white;box-shadow:0 4px 0 var(--primary)}
  .input::placeholder{color:var(--text-dim);font-weight:600}

  /* === 題目：可愛對話框 === */
  .qtitle{
    font-size:clamp(18px,4.6vw,22px);
    font-weight:800;line-height:1.7;color:var(--text);
    margin:18px 0 8px;text-align:left;
    background:#FFFEF5;
    border:none;
    border-left:6px solid var(--accent);
    border-radius:16px;
    padding:16px 20px;
    box-shadow:0 4px 0 var(--accent-soft), 0 6px 18px rgba(165,216,255,0.2);
    position:relative;
  }
  .qhint{
    font-size:14px;color:var(--text);text-align:center;
    margin-bottom:14px;margin-top:16px;
    font-weight:700;
    background:linear-gradient(135deg, var(--gold-soft) 0%, rgba(255,228,142,0.5) 100%);
    border:2px dashed var(--orange);
    padding:10px 16px;border-radius:14px;
  }

  /* === 幾何圖區：白底圓角（保留圖形可讀性）=== */
  .stage-wrap{
    background:white;
    border:3px solid var(--accent-soft);
    box-shadow:0 4px 0 var(--accent-soft), 0 8px 20px rgba(165,216,255,0.2);
    padding:14px;margin:14px 0;overflow:hidden;
    border-radius:20px;
  }
  .stage{width:100%;height:auto;display:block}

  /* === 選項：可愛糖果按鈕 === */
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:18px}
  .opt{
    min-height:62px;padding:14px 18px;
    background:white;color:var(--text);
    border:3px solid var(--primary-soft);
    border-radius:20px;
    box-shadow:0 4px 0 var(--primary-soft);
    font-size:16px;font-weight:800;
    cursor:pointer;font-family:inherit;
    text-align:center;line-height:1.4;
    transition:all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .opt:hover{
    background:var(--primary-soft);
    border-color:var(--primary);
    transform:translateY(-3px);
    box-shadow:0 7px 0 var(--primary);
  }
  .opt.correct{
    background:var(--success);color:white;
    border-color:var(--success);
    box-shadow:0 4px 0 #6FB68A;
    font-weight:900;
    animation:bounce-correct 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .opt.wrong{
    background:var(--primary-soft);color:#B85C7C;
    border-color:var(--danger);
    box-shadow:0 4px 0 var(--danger);
    opacity:0.85;
  }
  .opt.show-correct{
    background:var(--success);color:white;
    border-color:var(--success);
    box-shadow:0 4px 0 #6FB68A;font-weight:900;
  }
  @keyframes bounce-correct{
    0%{transform:scale(1)}
    20%{transform:scale(1.15)}
    40%{transform:scale(0.95)}
    60%{transform:scale(1.08)}
    80%{transform:scale(0.98)}
    100%{transform:scale(1)}
  }

  /* === 回饋：療癒對白 === */
  .fb{
    margin-top:16px;padding:14px 18px;
    border:none;border-radius:18px;
    font-size:15px;line-height:1.7;font-weight:700;
    display:none;animation:cardIn 0.4s;
  }
  .fb.show{display:block}
  .fb.win{
    background:linear-gradient(135deg, var(--success-soft) 0%, #DDF4E2 100%);
    color:#3E8E5E;
    box-shadow:0 3px 0 var(--success), 0 6px 14px rgba(149,213,178,0.3);
  }
  .fb.win::before{content:'🌟 ';font-size:22px}
  .fb.gentle{
    background:linear-gradient(135deg, var(--gold-soft) 0%, #FFF3CC 100%);
    color:#A1751C;
    box-shadow:0 3px 0 var(--gold), 0 6px 14px rgba(255,224,102,0.3);
  }
  .fb.gentle::before{content:'💭 ';font-size:22px}

  /* === 提示：粉色便條紙 + 角落生物角色 === */
  .hints{display:none;margin-top:14px}
  .hints.show{display:block;animation:cardIn 0.4s}
  .hint{
    background:#FFF0F5;color:var(--text);
    border:none;border-left:5px solid var(--primary);
    border-radius:14px;
    box-shadow:0 3px 0 var(--primary-soft), 0 6px 14px rgba(255,179,199,0.15);
    padding:12px 14px 12px 18px;margin-bottom:10px;
    font-size:14px;line-height:1.7;font-weight:600;
    transform:rotate(-0.3deg);
    position:relative;
  }
  .hint:nth-child(2){transform:rotate(0.3deg);background:#FFFBE5;border-left-color:var(--gold)}
  .hint:nth-child(3){transform:rotate(-0.4deg);background:#E5F2FF;border-left-color:var(--accent)}
  .hint strong{color:var(--orange);font-weight:900}

  .stage text{user-select:none}

  /* === Nav === */
  .nav{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
  .nav .btn{flex:1;min-width:130px}

  /* === 金幣彈跳 === */
  @keyframes coinPop{
    0%{transform:translateY(0) scale(1) rotate(0);opacity:1}
    100%{transform:translateY(-50px) scale(1.6) rotate(360deg);opacity:0}
  }
  .coin-pop{position:fixed;font-size:36px;pointer-events:none;animation:coinPop 1s ease-out forwards;z-index:9999}

  /* === 勝利畫面 === */
  .victory{text-align:center;padding:28px}
  .victory .emoji{font-size:80px;margin-bottom:8px;animation:gentle-bounce 1.5s infinite;display:inline-block}
  .victory h1{font-size:42px;margin-bottom:14px}
  .score-display{
    background:linear-gradient(135deg, var(--gold-soft) 0%, var(--primary-soft) 50%, var(--accent-soft) 100%);
    color:var(--text);
    border:none;border-radius:24px;
    box-shadow:0 6px 0 var(--primary), 0 12px 28px rgba(255,179,199,0.3);
    padding:24px;margin:20px 0;
  }
  .score-display .num{
    font-size:72px;font-weight:900;color:var(--orange);
    text-shadow:0 4px 0 rgba(74,68,88,0.15);
    letter-spacing:2px;
  }
  .score-display .label{font-size:15px;margin-top:4px;font-weight:800;color:var(--text)}

  /* === 送出狀態 === */
  .submit-status{
    padding:14px 18px;border:none;border-radius:16px;
    text-align:center;font-weight:800;margin:14px 0;
    box-shadow:0 3px 0 rgba(0,0,0,0.05);
  }
  .submit-status.pending{background:var(--accent-soft);color:#3676B2}
  .submit-status.success{background:var(--success-soft);color:#3E8E5E}
  .submit-status.error{background:var(--primary-soft);color:#B85C7C}

  .spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(0,0,0,0.1);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* === 飄浮角落生物（背景裝飾） === */
  .deco-stars{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:0}
  .star{
    position:absolute;font-size:24px;
    opacity:0.4;
    animation:cute-float 6s ease-in-out infinite;
  }
  @keyframes cute-float{
    0%,100%{transform:translateY(0) rotate(0);opacity:0.3}
    50%{transform:translateY(-15px) rotate(10deg);opacity:0.5}
  }

  /* === Start 畫面 === */
  .start-screen{text-align:center;padding:30px 18px;position:relative}
  .start-screen .crown{
    font-size:80px;margin-bottom:10px;
    display:inline-block;
    animation:crown-float 3s ease-in-out infinite;
  }
  @keyframes crown-float{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-8px) rotate(-3deg)}
  }
  .start-screen h1{font-size:44px;margin-bottom:8px}
  .start-screen .tagline{
    color:var(--text);font-size:16px;margin-bottom:24px;
    font-weight:800;line-height:1.6;
    background:linear-gradient(135deg, var(--primary-soft) 0%, var(--gold-soft) 100%);
    border:none;border-radius:24px;
    padding:10px 20px;display:inline-block;
    box-shadow:0 4px 0 var(--primary), 0 6px 14px rgba(255,179,199,0.3);
  }
  .stage-info{
    background:#FFFEF7;
    border:none;border-radius:20px;
    box-shadow:0 5px 0 var(--accent-soft), 0 8px 20px rgba(165,216,255,0.15);
    padding:20px;margin:20px 0;
    font-size:15px;color:var(--text);line-height:1.9;
    font-weight:700;text-align:left;
  }

  /* === 難度標籤 === */
  .lvl-badge{
    display:inline-block;padding:6px 14px;
    border:none;border-radius:14px;
    box-shadow:0 3px 0 rgba(0,0,0,0.1);
    font-size:13px;font-weight:900;margin-bottom:12px;
    letter-spacing:1px;
  }
  .lvl-base{background:var(--success);color:white;box-shadow:0 3px 0 #6FB68A}
  .lvl-mid{background:var(--gold);color:white;box-shadow:0 3px 0 #B88A1F}
  .lvl-boss{background:var(--primary);color:white;box-shadow:0 3px 0 #B85C7C}

  .crystal{font-size:24px;animation:gentle-bounce 2s infinite ease-in-out;display:inline-block}

  /* === PRO 升級樣式（療癒重做） === */
  /* 彩虹小徑 + 白熊在跑 */
  .race-track{
    position:relative;
    background:linear-gradient(to right, #FFB3C7 0%, #FFD6E0 20%, #FFE066 40%, #B8E6B8 60%, #A5D8FF 80%, #D0BFFF 100%);
    border:none;border-radius:30px;
    height:54px;margin-bottom:14px;
    overflow:hidden;
    box-shadow:0 5px 0 var(--primary), inset 0 -4px 12px rgba(255,255,255,0.5);
  }
  /* 跑道閃星（靜態，不會閃，視覺豐富） */
  .race-track::before{
    content:'✨   ⭐   ✨   ⭐   ✨   ⭐';
    position:absolute;top:50%;left:0;right:0;text-align:center;
    transform:translateY(-50%);
    color:rgba(255,255,255,0.6);
    font-size:18px;letter-spacing:8px;
  }
  .race-car{
    position:absolute;top:50%;
    transform:translateY(-50%);
    font-size:38px;
    transition:left 0.8s cubic-bezier(0.34,1.56,0.64,1);
    z-index:2;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.2));
  }
  .race-flag{
    position:absolute;top:50%;right:8px;
    transform:translateY(-50%);
    font-size:28px;z-index:1;
  }

  /* COMBO 飛字（療癒版） */
  .combo-counter{
    display:inline-block;background:var(--primary);color:white;
    padding:3px 12px;border:none;border-radius:14px;
    box-shadow:0 2px 0 #B85C7C;
    font-weight:900;font-size:14px;letter-spacing:1px;
    margin-left:8px;animation:combo-pulse 0.5s;
  }
  @keyframes combo-pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
  .combo-fly{
    position:fixed;font-size:56px;font-weight:900;
    color:var(--primary);
    text-shadow:0 4px 0 var(--text), 0 6px 20px rgba(255,179,199,0.6);
    letter-spacing:3px;
    pointer-events:none;z-index:9999;
    animation:combo-fly 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes combo-fly{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.5) rotate(-15deg)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(5deg)}
    100%{opacity:0;transform:translate(-50%,-120%) scale(1) rotate(0)}
  }

  /* 禮物盒 modal */
  .treasure-overlay{
    position:fixed;inset:0;background:rgba(255,248,240,0.95);
    display:none;align-items:center;justify-content:center;
    z-index:9000;animation:fade-in 0.4s;
    backdrop-filter:blur(6px);
  }
  .treasure-overlay.show{display:flex}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  .treasure-card{
    background:white;
    border:none;border-radius:32px;
    box-shadow:0 8px 0 var(--primary), 0 16px 40px rgba(255,179,199,0.4);
    padding:32px 40px;
    text-align:center;max-width:380px;width:90%;
    animation:treasure-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes treasure-in{
    0%{transform:scale(0.7);opacity:0}
    100%{transform:scale(1);opacity:1}
  }
  .treasure-chest{
    font-size:90px;cursor:pointer;display:inline-block;
    transition:transform 0.2s;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,0.15));
    animation:gift-shake 1s ease-in-out infinite;
  }
  @keyframes gift-shake{

/* =============== SVG Helpers =============== */
// 角度弧（標準數學角度系：0°=右、90°=上、180°=左、270°=下）
// SVG y 向下，自動翻轉處理
function svgArc(cx, cy, fromDeg, toDeg, r, color = '#FFC93C', sw = 2.8) {
  const PI = Math.PI;
  const sx = cx + r * Math.cos(fromDeg * PI / 180);
  const sy = cy - r * Math.sin(fromDeg * PI / 180);
  const ex = cx + r * Math.cos(toDeg * PI / 180);
  const ey = cy - r * Math.sin(toDeg * PI / 180);
  let delta = toDeg - fromDeg;
  while (delta > 180) delta -= 360;
  while (delta < -180) delta += 360;
  // SVG sweep=1 = 視覺順時針；數學 delta<0 (順時針) 對應 SVG y 翻轉後仍視覺順時針
  const sweep = delta < 0 ? 1 : 0;
  return `<path d="M ${sx.toFixed(2)} ${sy.toFixed(2)} A ${r} ${r} 0 0 ${sweep} ${ex.toFixed(2)} ${ey.toFixed(2)}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
}
// 角度數字標籤（自動放在弧中間外側，處理 wrap-around）
function svgAngleLabel(cx, cy, fromDeg, toDeg, r, text, color = '#FFC93C', size = 16) {
  const PI = Math.PI;
  let _from = fromDeg, _to = toDeg;
  while (_to - _from > 180) _to -= 360;
  while (_to - _from < -180) _to += 360;
  const midDeg = (_from + _to) / 2;
  const lr = r + 14;
  const lx = cx + lr * Math.cos(midDeg * PI / 180);
  const ly = cy - lr * Math.sin(midDeg * PI / 180);
  return `<text x="${lx.toFixed(1)}" y="${(ly + size/3).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="${size}" font-weight="800">${text}</text>`;
}
// 角度名稱標籤（∠1、∠2 等，放在更外側）
function svgAngleName(cx, cy, fromDeg, toDeg, r, text, color = '#FFD970', size = 18) {
  const PI = Math.PI;
  let _from = fromDeg, _to = toDeg;
  while (_to - _from > 180) _to -= 360;
  while (_to - _from < -180) _to += 360;
  const midDeg = (_from + _to) / 2;
  const lr = r + 32;
  const lx = cx + lr * Math.cos(midDeg * PI / 180);
  const ly = cy - lr * Math.sin(midDeg * PI / 180);
  return `<text x="${lx.toFixed(1)}" y="${(ly + size/3).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="${size}" font-weight="800">${text}</text>`;
}
// 整合標籤：把 "∠A" + "30°" 合併成單一文字 "∠A=30°"（避免兩個標籤擠在同方向）
function svgAngleFull(cx, cy, fromDeg, toDeg, r, name, value, color = '#FFD970', size = 17) {
  const PI = Math.PI;
  let _from = fromDeg, _to = toDeg;
  while (_to - _from > 180) _to -= 360;
  while (_to - _from < -180) _to += 360;
  const midDeg = (_from + _to) / 2;
  const lr = r + 22;
  const lx = cx + lr * Math.cos(midDeg * PI / 180);
  const ly = cy - lr * Math.sin(midDeg * PI / 180);
  const text = value ? `${name}=${value}` : name;
  return `<text x="${lx.toFixed(1)}" y="${(ly + size/3).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="${size}" font-weight="800">${text}</text>`;
}
// 點圓 + 標籤
function svgPoint(cx, cy, label, color = '#FFC93C', labelOffsetX = 0, labelOffsetY = -14, size = 16) {
  return `<circle cx="${cx}" cy="${cy}" r="7" fill="${color}" stroke="#0D0D14" stroke-width="2.5"/>` +
    (label ? `<text x="${cx + labelOffsetX}" y="${cy + labelOffsetY}" text-anchor="middle" fill="${color}" font-size="${size}" font-weight="800">${label}</text>` : '');

/* === 平行四邊形 SVG builder === */
function buildPlg(opts) {
  const Ax=130, Ay=240, Bx=430, By=240, Cx=540, Cy=100, Dx=240, Dy=100;
  const Ox = (Ax+Cx)/2, Oy = (Ay+Cy)/2;
  const H = (s) => (opts.highlight || []).includes(s);
  const HL_C = '#FF1744', NORM_C = '#0D0D14';
  const parts = [];
  parts.push(`<svg class="stage" viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg">`);

  const edges = [
    ['AB', Ax, Ay, Bx, By, opts.AB, 'mid-bottom'],
    ['BC', Bx, By, Cx, Cy, opts.BC, 'mid-right'],
    ['CD', Cx, Cy, Dx, Dy, opts.CD, 'mid-top'],
    ['DA', Dx, Dy, Ax, Ay, opts.DA, 'mid-left'],
  ];
  for (const [name, x1, y1, x2, y2, label, pos] of edges) {
    const isHL = H(name);
    const col = isHL ? '#FF8FA3' : 'var(--L1-color)';
    const w = isHL ? 5 : 4;
    parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`);
    if (label) {
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      const ox = pos === 'mid-right' ? 18 : pos === 'mid-left' ? -18 : 0;
      const oy = pos === 'mid-bottom' ? 22 : pos === 'mid-top' ? -10 : 4;
      parts.push(`<text x="${mx+ox}" y="${my+oy}" text-anchor="middle" fill="${isHL ? HL_C : NORM_C}" font-size="18" font-weight="800">${label}</text>`);
    }
  }
  if (opts.diagonals) {
    parts.push(`<line x1="${Ax}" y1="${Ay}" x2="${Cx}" y2="${Cy}" stroke="#0D0D14" stroke-width="2" stroke-dasharray="7 5" opacity="0.5"/>`);
    parts.push(`<line x1="${Bx}" y1="${By}" x2="${Dx}" y2="${Dy}" stroke="#0D0D14" stroke-width="2" stroke-dasharray="7 5" opacity="0.5"/>`);
  }
  if (opts.AC) parts.push(`<text x="${(Ox+Cx)/2 + 8}" y="${(Oy+Cy)/2 - 8}" fill="${H('AC') ? HL_C : NORM_C}" font-size="15" font-weight="800">AC=${opts.AC}</text>`);
  if (opts.BD) parts.push(`<text x="${(Ox+Dx)/2 - 12}" y="${(Oy+Dy)/2 - 8}" text-anchor="end" fill="${H('BD') ? HL_C : NORM_C}" font-size="15" font-weight="800">BD=${opts.BD}</text>`);
  if (opts.AO) parts.push(`<text x="${(Ax+Ox)/2 - 8}" y="${(Ay+Oy)/2 + 22}" text-anchor="end" fill="${H('AO') ? HL_C : NORM_C}" font-size="15" font-weight="800">AO=${opts.AO}</text>`);
  if (opts.BO) parts.push(`<text x="${(Bx+Ox)/2 + 8}" y="${(By+Oy)/2 + 22}" fill="${H('BO') ? HL_C : NORM_C}" font-size="15" font-weight="800">BO=${opts.BO}</text>`);
  if (opts.OC) parts.push(`<text x="${(Cx+Ox)/2 + 8}" y="${(Cy+Oy)/2 - 8}" fill="${H('OC') ? HL_C : NORM_C}" font-size="15" font-weight="800">OC=${opts.OC}</text>`);
  if (opts.OD) parts.push(`<text x="${(Dx+Ox)/2 - 12}" y="${(Dy+Oy)/2 - 8}" text-anchor="end" fill="${H('OD') ? HL_C : NORM_C}" font-size="15" font-weight="800">OD=${opts.OD}</text>`);

  const angles = [
    ['angleA', Ax+18, Ay-12, opts.angleA, '∠A'],
    ['angleB', Bx-22, By-12, opts.angleB, '∠B'],
    ['angleC', Cx-22, Cy+22, opts.angleC, '∠C'],
    ['angleD', Dx+18, Dy+22, opts.angleD, '∠D'],
  ];
  for (const [name, x, y, val, label] of angles) {
    if (val !== undefined && val !== null) {
      const isHL = H(name);
      const col = isHL ? HL_C : NORM_C;
      const text = val ? `${label}=${val}` : label;
      parts.push(`<text x="${x}" y="${y}" fill="${col}" font-size="15" font-weight="800">${text}</text>`);
    }
  }
  for (const [name, x, y, off_x, off_y] of [
    ['A', Ax, Ay, -16, 6], ['B', Bx, By, 16, 6],
    ['C', Cx, Cy, 16, -6], ['D', Dx, Dy, -16, -6],
  ]) {
    parts.push(`<circle cx="${x}" cy="${y}" r="9" fill="#FFC93C" stroke="#0D0D14" stroke-width="3"/>`);
    parts.push(`<text x="${x+off_x}" y="${y+off_y}" text-anchor="middle" fill="#0D0D14" font-size="20" font-weight="900">${name}</text>`);
  }
  if (opts.O) {
    parts.push(`<circle cx="${Ox}" cy="${Oy}" r="7" fill="#FF1744" stroke="#0D0D14" stroke-width="3"/>`);
    parts.push(`<text x="${Ox+14}" y="${Oy+4}" fill="#FF1744" font-size="17" font-weight="900">O</text>`);
  }
  if (opts.title_extra) {
    parts.push(`<text x="330" y="40" text-anchor="middle" fill="#0066FF" font-size="18" font-weight="900">${opts.title_extra}</text>`);
  }
  parts.push(`</svg>`);
  return parts.join('\n');
}

/* === PRO 升級：賽車進度、寶箱、灑花、COMBO 系統 === */
function spawnConfetti(count = 80) {
  const colors = ['#FFB3C7', '#FFE066', '#A5D8FF', '#95D5B2', '#D0BFFF', '#FFA94D'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    if (Math.random() > 0.5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

function showCombo(level) {
  const el = document.createElement('div');
  el.className = 'combo-fly';
  el.textContent = `COMBO x${level}!`;
  el.style.left = '50%';
  el.style.top = '40%';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

function openTreasureChest(callback) {
  const ov = document.getElementById('treasure-overlay');
  const card = document.getElementById('treasure-card-inner');
  // 隨機獎勵（驚喜分數）
  const prizes = [10, 20, 30, 50, 80, 100, 150];
  const weights = [3, 4, 4, 3, 2, 1, 1];  // 加權，小金幣多、大金幣少
  let totalW = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * totalW;
  let prize = 10;
  for (let i = 0; i < prizes.length; i++) {
    if (r < weights[i]) { prize = prizes[i]; break; }
    r -= weights[i];
  }
  // 渲染
  card.innerHTML = `
    <div style="font-size:14px;font-weight:900;color:var(--accent);margin-bottom:10px">🎉 過關！開寶箱！</div>
    <div class="treasure-chest" id="t-chest" onclick="window._openChest()">🎁</div>
    <div id="t-prize" style="display:none">
      <div class="treasure-prize">+${prize} 💰</div>
      <div class="treasure-msg">${prize >= 100 ? '🌟 史詩級爆擊！' : prize >= 50 ? '✨ 稀有掉落！' : prize >= 30 ? '👍 不錯喔！' : '💪 繼續加油！'}</div>
      <button class="btn btn-gold" onclick="window._closeChest()">下一題 →</button>
    </div>
  `;
  ov.classList.add('show');
  window._chestOpened = false;
  window._currentPrize = prize;
  window._chestCallback = callback;
}

window._openChest = function() {
  if (window._chestOpened) return;
  window._chestOpened = true;
  const chest = document.getElementById('t-chest');
  chest.textContent = '📦';
  chest.classList.add('opened');
  playSound('chest');
  setTimeout(() => {
    chest.textContent = '✨';
    document.getElementById('t-prize').style.display = 'block';
  }, 400);
};

window._closeChest = function() {
  const ov = document.getElementById('treasure-overlay');
  ov.classList.remove('show');
  if (window._chestCallback) {
    window._chestCallback(window._currentPrize);
    window._chestCallback = null;
  }
};

/* =============== UI rendering =============== */
function showScreen(id) {
  document.querySelectorAll('section[id^="screen-"]').forEach(s => s.style.display = 'none');
  document.getElementById('screen-' + id).style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderProgress() {
  const c = document.getElementById('hud-progress');
  c.innerHTML = '';
  for (let i = 0; i < QUESTIONS.length; i++) {
    const d = document.createElement('div');
    d.className = 'pdot';
    if (i < state.currentQ) d.classList.add('done');
    else if (i === state.currentQ) d.classList.add('active');
    d.textContent = i + 1;
    c.appendChild(d);
  }
  updateRaceCar();
}

function updateRaceCar() {
  const car = document.getElementById('race-car');
  if (!car) return;
  const pct = (state.currentQ / QUESTIONS.length) * 92; // 0-92% (留 8% 給終點旗)
  car.style.left = pct + '%';
}

    </div>
    <div class="qtitle">${q.title}</div>
    <div class="qhint">${q.hint}</div>
    <div class="stage-wrap">${q.buildSvg()}</div>
    ${q.bossDemo ? `
      <div class="boss-demo-panel">
        <div class="boss-demo-title">🎬 看不懂沒關係！按下面按鈕看「逐步動畫演示」<br>（每個按鈕都可以重複按、有 🔄 重置）</div>
        <div class="boss-demo-btns">
          <button class="btn btn-warning" onclick="bossDemoStep(1)">📺 Step 1<br>對邊雙胞胎</button>
          <button class="btn btn-warning" onclick="bossDemoStep(2)">📺 Step 2<br>對角線(左)</button>
          <button class="btn btn-warning" onclick="bossDemoStep(3)">📺 Step 3<br>對角線(右)</button>
          <button class="btn btn-gold" onclick="bossDemoStep(4)">🎯 Step 4<br>看完整答案</button>
          <button class="btn btn-ghost" onclick="bossDemoReset()">🔄 重置</button>
        </div>
        <div id="demo-caption" class="demo-caption">👆 按上面 4 個按鈕看「逐步演示」</div>
      </div>
    ` : ''}
    <div class="opts" id="q-opts">
      ${q.options.map((o, i) => `<button class="opt" data-i="${i}">${o.text}</button>`).join('')}
    </div>
    <div class="fb" id="q-fb"></div>
    <div class="hints" id="q-hints">
      ${q.hints.map((h, i) => `<div class="hint"><strong>提示 ${i+1}：</strong> ${h}</div>`).join('')}
    </div>
    <div class="nav">
      <button class="btn btn-warning" id="hint-btn" onclick="toggleHints()">💡 看提示</button>
      <button class="btn btn-gold" id="next-btn" onclick="nextQuestion()" disabled>下一關 →</button>
    </div>
  `;

  // Attach option clicks
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => answerOption(parseInt(btn.dataset.i), btn));
  });

  state.hintsUsed[state.currentQ] = state.hintsUsed[state.currentQ] || 0;
}

function toggleHints() {
  const h = document.getElementById('q-hints');
  h.classList.toggle('show');
  state.hintsUsed[state.currentQ] = (state.hintsUsed[state.currentQ] || 0) + 1;
}

let answered = false;
function answerOption(idx, btnEl) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[state.currentQ];
  const opt = q.options[idx];
  const fb = document.getElementById('q-fb');
  const optsContainer = document.getElementById('q-opts');

  state.answers[state.currentQ] = {
    pickedIndex: idx,
    pickedText: opt.text,
    correct: opt.correct,
  };

  if (opt.correct) {
    btnEl.classList.add('correct');
    fb.className = 'fb win show';
    fb.innerHTML = q.explainCorrect;
    state.correct++;
    // COMBO 系統
    state.combo = (state.combo || 0) + 1;
    if (state.combo >= 2) showCombo(state.combo);
    // 灑花 + 開寶箱
    spawnConfetti(state.combo >= 3 ? 120 : 60);
    playSound('correct');
    setTimeout(() => {
      openTreasureChest((prize) => {
        // 加 COMBO 倍率
        const mult = state.combo >= 3 ? 3 : state.combo >= 2 ? 2 : 1;
        const total = prize * mult;
        state.coins += total;
        document.getElementById('hud-coins').textContent = state.coins;
        if (mult > 1) {
          // 爆擊飛字
          const el = document.createElement('div');
          el.className = 'combo-fly';
          el.textContent = `+${total} 💰 (x${mult})`;
          el.style.left = '50%'; el.style.top = '30%';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1500);
        }
      });
    }, 600);
  } else {
    btnEl.classList.add('wrong');
    state.combo = 0;
    optsContainer.querySelectorAll('.opt').forEach((b, i) => {
      if (q.options[i].correct) b.classList.add('show-correct');
    });
    fb.className = 'fb gentle show';
    fb.innerHTML = q.explainWrong;
    playSound('wrong');
  }

  document.getElementById('next-btn').disabled = false;
  document.getElementById('hud-coins').textContent = state.coins;
}

function nextQuestion() {
  state.currentQ++;
  answered = false;
  if (state.currentQ >= QUESTIONS.length) {
    finishGame();
  } else {
    renderQuest();
  }
}

/* =============== Sound (8-bit) =============== */
let audioCtx;
function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if (type === 'correct') {
      o.type = 'square';
      o.frequency.setValueAtTime(523, audioCtx.currentTime); // C5
      o.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1); // E5
      o.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2); // G5
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      o.start(); o.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'wrong') {
      o.type = 'triangle';
      o.frequency.setValueAtTime(220, audioCtx.currentTime);
      o.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.3);
      g.gain.setValueAtTime(0.1, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      o.start(); o.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'chest') {
      // 開寶箱：3 個短促上揚
      [659, 784, 988].forEach((f, i) => {
        const oo = audioCtx.createOscillator(); const gg = audioCtx.createGain();
        oo.connect(gg); gg.connect(audioCtx.destination);
        oo.type = 'square'; oo.frequency.value = f;
        gg.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.08);
        gg.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.2);
        oo.start(audioCtx.currentTime + i * 0.08);
        oo.stop(audioCtx.currentTime + i * 0.08 + 0.2);
      });
    } else if (type === 'victory') {
      [523, 659, 784, 1047].forEach((f, i) => {
        const oo = audioCtx.createOscillator();
        const gg = audioCtx.createGain();
        oo.connect(gg); gg.connect(audioCtx.destination);
        oo.type = 'square';
        oo.frequency.value = f;
        gg.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.15);
        gg.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.3);
        oo.start(audioCtx.currentTime + i * 0.15);
        oo.stop(audioCtx.currentTime + i * 0.15 + 0.3);
      });
    }
  } catch (e) {}
}

function popCoin(refEl) {
  const r = refEl.getBoundingClientRect();
  const coin = document.createElement('div');
  coin.className = 'coin-pop';
  coin.textContent = '💰';
  coin.style.left = (r.left + r.width / 2 - 16) + 'px';
  coin.style.top = (r.top - 10) + 'px';
  document.body.appendChild(coin);
  setTimeout(() => coin.remove(), 1100);
}

/* =============== Finish + Submit =============== */
function finishGame() {
  const elapsed = Math.round((Date.now() - state.startTime) / 1000);
  // 超大灑花 + 連續 3 波
  spawnConfetti(200);
  setTimeout(() => spawnConfetti(150), 500);
  setTimeout(() => spawnConfetti(150), 1000);
  document.getElementById('vic-name').textContent = state.nick;
  document.getElementById('vic-correct').textContent = state.correct;
  document.getElementById('vic-coins').textContent = state.coins;
  const m = Math.floor(elapsed / 60), s = elapsed % 60;
  document.getElementById('vic-time').textContent = m + ':' + (s < 10 ? '0' : '') + s;
  showScreen('victory');
  playSound('victory');

  submitToServer(elapsed);
}

async function submitToServer(elapsed) {
  const status = document.getElementById('vic-status');
  const payload = {
    nick: state.nick,
    hwId: HOMEWORK_ID,
    correctCount: state.correct,
    totalQuestions: QUESTIONS.length,
    coins: state.coins,
    elapsedSec: elapsed,
    submittedAt: new Date().toISOString(),
    answers: state.answers.map((a, i) => ({
      q: i + 1,
      level: QUESTIONS[i].levelLabel,
      pickedText: a ? a.pickedText : null,
      correct: a ? a.correct : false,
      hintsUsed: state.hintsUsed[i] || 0,
    })),
  };

  // Firebase Realtime Database POST — 永久儲存
  for (let attempt = 0; attempt < 5; attempt++) {
    try {
      const res = await fetch(FIREBASE_NODE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error('POST ' + res.status);

      status.className = 'submit-status success';
      status.innerHTML = '✅ 成績已送達老師後台！';
      return;
    } catch (err) {
      if (attempt === 4) {
        status.className = 'submit-status error';
        status.innerHTML = '⚠️ 送出失敗，請告訴老師你的暱稱和成績：<br><strong>' + state.nick + ' — ' + state.correct + '/' + QUESTIONS.length + ' 分</strong>';
        return;
      }
      await new Promise(r => setTimeout(r, 500 + Math.random() * 800));
    }
  }
}

/* =============== Restart =============== */
function restartGame() {
  state.nick = '';
  state.startTime = 0;
  state.currentQ = 0;
  state.coins = 0;
  state.correct = 0;
  state.combo = 0;
  state.answers = [];
  state.hintsUsed = [];
  answered = false;
  document.getElementById('nick-input').value = '';
  showScreen('start');
}

/* =============== Start =============== */
document.getElementById('start-btn').addEventListener('click', () => {
  const input = document.getElementById('nick-input');
  const nick = input.value.trim();
  if (!nick) {
    input.focus();
    input.style.borderColor = 'var(--danger)';
    setTimeout(() => input.style.borderColor = '', 1500);
    return;
  }
  state.nick = nick;
  state.startTime = Date.now();
  state.currentQ = 0;
  state.coins = 0;
  state.correct = 0;
  state.combo = 0;
  state.answers = [];
  showScreen('quest');
  renderQuest();
});

// Enter key in nick input
document.getElementById('nick-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('start-btn').click();
});

// Expose for inline onclick
window.toggleHints = toggleHints;
window.nextQuestion = nextQuestion;
window.restartGame = restartGame;
</script>
