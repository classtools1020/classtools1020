<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>平行四邊形大冒險 · 5 英雄解封印 (5/29)</title>
<style>
  /* === 漫畫熱血少年風 (Manga Shonen Style) === */
  /* 跟之前暗藍 RPG 完全不同：白底紙感 + 火焰橘 + 電光藍 + 黑粗邊 + 漫畫網點 */
  :root {
    --bg-dark: #FFF8E7;          /* 漫畫紙黃白底（不再是暗黑） */
    --bg-mid: #FFE9C4;
    --primary: #0066FF;           /* 電光藍（招式光） */
    --primary-soft: #4D9BFF;
    --gold: #FF6600;              /* 火焰橘 */
    --gold-soft: #FF9933;
    --accent: #FF1744;            /* 警示紅 */
    --success: #00C853;           /* 過關綠 */
    --success-soft: #B9F6CA;
    --warning: #FFAB00;           /* 警告黃 */
    --danger: #D50000;
    --text: #0D0D14;              /* 漫畫線稿黑 */
    --text-dim: #4A5568;
    --ink: #0D0D14;
    --paper: #FFF8E7;
    --L1-color: #0066FF;
    --L2-color: #FF1744;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{font-family:'Bangers','Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
  /* 漫畫紙感背景：奶黃底 + 細網點 + 對角線速度線 */
  body{
    background:
      repeating-linear-gradient(45deg, transparent 0, transparent 40px, rgba(0,102,255,0.025) 40px, rgba(0,102,255,0.025) 41px),
      radial-gradient(circle, rgba(13,13,20,0.04) 1px, transparent 1px) 0 0 / 12px 12px,
      var(--paper);
    background-attachment:fixed;
  }

  .app{max-width:820px;margin:0 auto;padding:16px;min-height:100vh;position:relative;z-index:1}

  /* === HUD：漫畫條形 banner === */
  .hud{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--ink);color:white;
    border:3px solid var(--ink);
    padding:8px 14px;margin-bottom:16px;
    box-shadow:5px 5px 0 0 var(--gold);
    transform:skew(-2deg);
  }
  .hud > * { transform:skew(2deg); }
  .hud-left{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .hud-nick{font-weight:900;color:#FFD970;font-size:16px;letter-spacing:1px}
  .hud-stat{display:flex;align-items:center;gap:4px;font-size:14px;color:white;font-weight:800}
  .hud-stat .icon{font-size:18px}
  .hud-coins{color:var(--gold-soft)}

  /* === 進度條：漫畫氣泡圓 === */
  .progress{display:flex;gap:7px}
  .pdot{
    width:32px;height:32px;border-radius:50%;background:white;
    border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;color:var(--ink);
    box-shadow:2px 2px 0 0 var(--ink);
  }
  .pdot.done{background:var(--success);color:white}
  .pdot.active{background:var(--gold);color:white;transform:scale(1.18) rotate(-8deg);box-shadow:3px 3px 0 0 var(--accent)}

  /* === 主卡片：白底厚黑邊 + 偏移陰影（漫畫格） === */
  .card{
    background:white;
    border:4px solid var(--ink);
    padding:22px;
    box-shadow:8px 8px 0 0 var(--ink);
    animation:cardIn 0.4s ease;
    position:relative;
  }
  /* 卡片右上角貼紙 */
  .card::before{
    content:'🔥';position:absolute;top:-18px;right:-12px;
    font-size:36px;transform:rotate(15deg);
    filter:drop-shadow(2px 2px 0 var(--ink));
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(15px) rotate(-1deg)}
    to{opacity:1;transform:translateY(0) rotate(0)}
  }

  /* === 標題：漫畫聲效感（雙描邊 + 陰影） === */
  h1{
    font-size:clamp(26px,6.5vw,38px);
    color:var(--accent);text-align:center;
    letter-spacing:2px;margin-bottom:6px;
    font-weight:900;
    -webkit-text-stroke:2px var(--ink);
    text-shadow:4px 4px 0 var(--gold), 4px 4px 0 var(--ink);
    transform:rotate(-1.5deg);
  }
  h2{font-size:clamp(20px,5vw,26px);color:var(--primary);margin-bottom:10px;font-weight:900;-webkit-text-stroke:1px var(--ink)}
  h3{font-size:clamp(16px,4vw,19px);color:var(--ink);margin-bottom:8px;font-weight:800}
  .subtitle{text-align:center;color:var(--ink);font-size:15px;margin-bottom:14px;font-weight:700}

  /* === 按鈕：漫畫聲效按鈕（厚黑邊 + 偏移陰影 + 按下塌陷） === */
  .btn{
    min-height:54px;padding:12px 24px;
    border:3px solid var(--ink);
    background:var(--primary);color:white;
    font-size:17px;font-weight:900;letter-spacing:1px;
    cursor:pointer;font-family:inherit;
    box-shadow:4px 4px 0 0 var(--ink);
    transition:transform 0.1s, box-shadow 0.1s;
    min-width:120px;
    text-shadow:1px 1px 0 rgba(0,0,0,0.3);
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 0 var(--ink)}
  .btn:active{transform:translate(4px,4px);box-shadow:0 0 0 0 var(--ink)}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 0 var(--ink)}
  .btn-gold{background:var(--gold);color:white}
  .btn-ghost{background:white;color:var(--ink)}
  .btn-warning{background:var(--warning);color:var(--ink)}

  /* === Input：手寫筆記本感 === */
  .input{
    width:100%;padding:14px 18px;
    background:white;
    border:3px solid var(--ink);
    box-shadow:4px 4px 0 0 var(--ink);
    font-size:20px;color:var(--ink);font-family:inherit;
    text-align:center;font-weight:800;
    letter-spacing:1px;
  }
  .input:focus{outline:none;background:#FFFEF5;box-shadow:4px 4px 0 0 var(--gold)}
  .input::placeholder{color:#9CA3AF;font-weight:600}

  /* === 題目標題：漫畫對白框 === */
  .qtitle{
    font-size:clamp(18px,4.6vw,22px);
    font-weight:900;line-height:1.6;color:var(--ink);
    margin:18px 0 8px;text-align:left;
    background:#FFFEF5;
    border:3px solid var(--ink);
    border-radius:8px;
    padding:14px 18px;
    position:relative;
    box-shadow:3px 3px 0 0 var(--ink);
  }
  /* 對話框小尖角 */
  .qtitle::after{
    content:'';position:absolute;bottom:-15px;left:30px;
    width:0;height:0;
    border:12px solid transparent;
    border-top-color:var(--ink);
    border-bottom:0;
  }
  .qhint{
    font-size:14px;color:var(--ink);text-align:center;
    margin-bottom:14px;margin-top:20px;
    font-weight:600;font-style:italic;
    background:rgba(255,171,0,0.15);
    border-left:4px solid var(--warning);
    padding:8px 14px;border-radius:4px;
  }

  /* === 幾何圖區：白底 + 黑粗邊（漫畫圖格） === */
  .stage-wrap{
    background:white;
    border:3px solid var(--ink);
    box-shadow:4px 4px 0 0 var(--primary);
    padding:14px;margin:14px 0;overflow:hidden;
    border-radius:6px;
  }
  .stage{width:100%;height:auto;display:block}

  /* === 選項按鈕：漫畫貼紙風 === */
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:18px}
  .opt{
    min-height:62px;padding:14px 16px;
    background:white;color:var(--ink);
    border:3px solid var(--ink);
    box-shadow:4px 4px 0 0 var(--ink);
    font-size:16px;font-weight:800;
    cursor:pointer;font-family:inherit;
    text-align:center;line-height:1.4;
    transition:transform 0.1s, box-shadow 0.1s, background 0.15s;
  }
  .opt:hover{
    background:var(--gold);color:white;
    transform:translate(-1px,-1px) rotate(-1deg);
    box-shadow:5px 5px 0 0 var(--ink);
  }
  .opt.correct{
    background:var(--success);color:white;
    border-color:var(--ink);
    box-shadow:4px 4px 0 0 var(--ink);
    animation:hit 0.5s;
  }
  .opt.wrong{
    background:#FFE0E0;color:var(--danger);
    box-shadow:4px 4px 0 0 var(--ink);opacity:0.85;
  }
  .opt.show-correct{
    background:var(--success);color:white;
    box-shadow:4px 4px 0 0 var(--ink);font-weight:900;
  }
  @keyframes hit{
    0%{transform:scale(1)}
    30%{transform:scale(1.15) rotate(-3deg)}
    60%{transform:scale(0.95) rotate(2deg)}
    100%{transform:scale(1)}
  }

  /* === 回饋框：漫畫對白 === */
  .fb{
    margin-top:16px;padding:14px 18px;
    border:3px solid var(--ink);
    font-size:15px;line-height:1.6;
    font-weight:700;
    display:none;animation:cardIn 0.3s;
    box-shadow:4px 4px 0 0 var(--ink);
  }
  .fb.show{display:block}
  .fb.win{background:#D4FFE0;color:var(--success);border-color:var(--success)}
  .fb.win::before{content:'💥 ';font-size:22px}
  .fb.gentle{background:#FFF5D6;color:#B45309;border-color:var(--warning)}
  .fb.gentle::before{content:'💡 ';font-size:22px}

  /* === 提示卡：螢光便條紙 === */
  .hints{display:none;margin-top:14px}
  .hints.show{display:block;animation:cardIn 0.3s}
  .hint{
    background:#FFF59D;color:var(--ink);
    border:2px solid var(--ink);
    box-shadow:3px 3px 0 0 var(--ink);
    padding:12px 14px;margin-bottom:10px;
    font-size:14px;line-height:1.6;font-weight:600;
    transform:rotate(-0.5deg);
  }
  .hint:nth-child(even){transform:rotate(0.5deg);background:#FFE4B5}
  .hint strong{color:var(--accent);font-weight:900}

  .stage text{user-select:none}

  /* === Nav 按鈕列 === */
  .nav{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
  .nav .btn{flex:1;min-width:130px}

  /* === 金幣彈跳（保留 emoji 樣式但加描邊） === */
  @keyframes coinPop{
    0%{transform:translateY(0) scale(1) rotate(0);opacity:1}
    100%{transform:translateY(-60px) scale(1.8) rotate(360deg);opacity:0}
  }
  .coin-pop{position:fixed;font-size:36px;pointer-events:none;animation:coinPop 1s ease-out forwards;z-index:9999}

  /* === 勝利畫面 === */
  .victory{text-align:center;padding:28px}
  .victory .emoji{font-size:80px;margin-bottom:8px;animation:hit 1.5s infinite;filter:drop-shadow(3px 3px 0 var(--ink))}
  .victory h1{font-size:38px;margin-bottom:14px}
  .score-display{
    background:var(--gold);color:white;
    border:4px solid var(--ink);
    box-shadow:6px 6px 0 0 var(--ink);
    padding:24px;margin:20px 0;
    transform:rotate(-1.5deg);
  }
  .score-display .num{font-size:64px;font-weight:900;text-shadow:3px 3px 0 var(--ink);letter-spacing:2px}
  .score-display .label{font-size:16px;margin-top:4px;font-weight:800;-webkit-text-stroke:0.5px var(--ink)}

  /* === 送出狀態 === */
  .submit-status{
    padding:14px 18px;border:3px solid var(--ink);
    text-align:center;font-weight:800;margin:14px 0;
    box-shadow:3px 3px 0 0 var(--ink);
  }
  .submit-status.pending{background:#FFF59D;color:var(--ink)}
  .submit-status.success{background:var(--success);color:white}
  .submit-status.error{background:#FFE0E0;color:var(--danger);border-color:var(--danger)}

  .spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(0,0,0,0.2);border-top-color:var(--ink);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* === 速度線裝飾（替代原本星星） === */
  .deco-stars{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:0}
  .star{
    position:absolute;color:var(--accent);opacity:0.5;font-size:18px;
    animation:zoom 4s infinite;font-weight:900;
  }
  @keyframes zoom{
    0%,100%{opacity:0.1;transform:scale(0.8) rotate(0)}
    50%{opacity:0.5;transform:scale(1.2) rotate(45deg)}
  }

  /* === 入場畫面：起手式 === */
  .start-screen{text-align:center;padding:30px 18px;position:relative}
  .start-screen .crown{
    font-size:72px;margin-bottom:10px;
    display:inline-block;
    animation:hit 2s infinite;
    filter:drop-shadow(3px 3px 0 var(--ink));
  }
  .start-screen h1{font-size:42px;margin-bottom:8px}
  .start-screen .tagline{
    color:var(--ink);font-size:17px;margin-bottom:24px;
    font-weight:700;line-height:1.6;
    background:var(--gold-soft);
    border:3px solid var(--ink);
    padding:8px 16px;display:inline-block;
    transform:rotate(-1deg);
    box-shadow:3px 3px 0 0 var(--ink);
  }
  .stage-info{
    background:#FFFEF5;
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 0 var(--primary);
    padding:18px;margin:20px 0;
    font-size:15px;color:var(--ink);line-height:1.8;
    font-weight:600;
    text-align:left;
  }

  /* === 難度標籤（彩色 sticker） === */
  .lvl-badge{
    display:inline-block;padding:6px 14px;
    border:2.5px solid var(--ink);
    box-shadow:3px 3px 0 0 var(--ink);
    font-size:13px;font-weight:900;margin-bottom:12px;
    letter-spacing:1px;
    transform:rotate(-2deg);
  }
  .lvl-base{background:var(--success);color:white}
  .lvl-mid{background:var(--gold);color:white}
  .lvl-boss{background:var(--accent);color:white}

  .crystal{font-size:24px;animation:hit 2s infinite ease-in-out;display:inline-block}

  /* === 額外漫畫聲效裝飾 === */
  .manga-burst{
    position:absolute;font-size:14px;font-weight:900;
    color:var(--accent);background:var(--gold);
    border:2px solid var(--ink);
    padding:4px 10px;
    box-shadow:2px 2px 0 0 var(--ink);
    transform:rotate(-8deg);
    pointer-events:none;
  }

  /* === BOSS 演示動畫（自閉症友善：可預測、可重複、可重置） === */
  .boss-demo-panel{
    background:#FFF59D;
    border:3px solid var(--ink);
    box-shadow:4px 4px 0 0 var(--accent);
    padding:14px;margin-top:16px;
    border-radius:4px;
  }
  .boss-demo-title{
    text-align:center;font-weight:900;
    color:var(--accent);margin-bottom:12px;
    font-size:14px;line-height:1.5;
  }
  .boss-demo-btns{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:8px;margin-bottom:12px;
  }
  .boss-demo-btns .btn{
    min-height:54px;padding:8px 10px;
    font-size:13px;min-width:0;line-height:1.3;
  }
  .demo-caption{
    text-align:center;font-weight:900;
    color:var(--accent);font-size:16px;
    min-height:26px;background:white;
    border:2px solid var(--ink);
    padding:8px 12px;border-radius:4px;
  }
  .demo-caption strong{color:var(--gold);font-size:20px;-webkit-text-stroke:0.5px var(--ink)}

  /* SVG 演示高亮樣式 */
  .demo-edge-on{
    stroke:#FF1744 !important;stroke-width:8 !important;
    filter:drop-shadow(0 0 8px rgba(255,23,68,0.7));
    animation:demo-pulse 1s infinite;
  }
  .demo-diag-on{
    stroke:#FF6600 !important;stroke-width:4 !important;
    stroke-dasharray:none !important;opacity:1 !important;
    filter:drop-shadow(0 0 6px rgba(255,102,0,0.6));
  }
  .demo-seg-on{
    stroke:#FF1744 !important;stroke-width:6 !important;opacity:1 !important;
    filter:drop-shadow(0 0 8px rgba(255,23,68,0.7));
    animation:demo-pulse 1s infinite;
  }
  .demo-label-pop{
    fill:#FF1744 !important;font-size:22px !important;font-weight:900 !important;
    animation:demo-bounce 0.6s;
  }
  @keyframes demo-pulse{0%,100%{opacity:1}50%{opacity:0.55}}
  @keyframes demo-bounce{
    0%{transform:scale(1);transform-origin:center}
    50%{transform:scale(1.4);transform-origin:center}
    100%{transform:scale(1);transform-origin:center}
  }
</style>
</head>
<body>

<div class="deco-stars" id="stars"></div>

<div class="app" id="app">

  <!-- Start Screen -->
  <section id="screen-start" class="card start-screen">
    <div class="crown">👑</div>
    <h1>平行四邊形大冒險 · 5 英雄解封印</h1>
    <p class="tagline">⚔️ 5 英雄 + 1 BOSS · 闖過去就是<strong style="color:var(--gold)">英雄聯盟主</strong> ⚔️</p>

    <div style="margin:20px 0">
      <label style="display:block;margin-bottom:8px;color:var(--gold-soft);font-weight:600">請輸入你的召喚師暱稱</label>
      <input id="nick-input" class="input" type="text" placeholder="例：小新、艾妲、神槍手" maxlength="12" autocomplete="off">
    </div>

    <div class="stage-info">
      📜 任務內容：6 關卡（5 英雄 + FINAL BOSS）<br>
      ⏱️ 預計時間：15-20 分鐘<br>
      💎 每位英雄送金幣，全破得「英雄聯盟主」勳章 👑<br>
      🛡️ 答錯不扣分！可以看提示
    </div>

    <button id="start-btn" class="btn btn-gold" style="width:100%;font-size:18px;min-height:60px">
      🚀 出發！進入王國
    </button>
  </section>

  <!-- Quest Screen (HUD + Q) -->
  <section id="screen-quest" style="display:none">
    <div class="hud">
      <div class="hud-left">
        <span class="hud-nick">👑 <span id="hud-name">召喚師</span></span>
        <span class="hud-stat hud-coins"><span class="icon">💰</span><span id="hud-coins">0</span></span>
      </div>
      <div class="progress" id="hud-progress"></div>
    </div>

    <div class="card" id="quest-card">
      <!-- 動態填入題目 -->
    </div>
  </section>

  <!-- Victory Screen -->
  <section id="screen-victory" style="display:none">
    <div class="card victory">
      <div class="emoji">🏆</div>
      <h1>王國大冒險完成！</h1>
      <p style="color:var(--primary-soft);margin-bottom:18px">召喚師 <strong style="color:var(--gold-soft)" id="vic-name">XXX</strong> 通過全部關卡！</p>

      <div class="score-display">
        <div class="num"><span id="vic-correct">0</span>/6</div>
        <div class="label">答對題數</div>
      </div>

      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0">
        <div style="background:rgba(91,111,232,0.15);border-radius:12px;padding:12px 18px">
          <div style="font-size:24px;font-weight:700;color:var(--gold)">💰 <span id="vic-coins">0</span></div>
          <div style="font-size:12px;color:var(--text-dim)">金幣</div>
        </div>
        <div style="background:rgba(91,111,232,0.15);border-radius:12px;padding:12px 18px">
          <div style="font-size:24px;font-weight:700;color:var(--gold)">⏱️ <span id="vic-time">0:00</span></div>
          <div style="font-size:12px;color:var(--text-dim)">用時</div>
        </div>
      </div>

      <div id="vic-status" class="submit-status pending"><span class="spinner"></span>正在送出成績給老師...</div>

      <div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;margin:18px 0;font-size:13px;color:var(--text-dim);line-height:1.7">
        💝 不管答對幾題，<strong style="color:var(--gold)">願意挑戰就是了不起</strong>。<br>
        明天上課，老師會在後台看到你的成績喔！
      </div>

      <button class="btn btn-ghost" style="width:100%" onclick="restartGame()">🔄 再玩一次</button>
    </div>
  </section>

</div>

<script>
'use strict';

/* =============== Config =============== */
// Firebase Realtime Database — 永久儲存、CORS 完美、不會 12 小時消失
const FIREBASE_URL = 'https://classtools1019-default-rtdb.firebaseio.com';
const HOMEWORK_ID = '8a_parallelogram_heroes_2026_05_29';
const FIREBASE_NODE = `${FIREBASE_URL}/submissions/${HOMEWORK_ID}.json`;

/* =============== Stars =============== */
(() => {
  const c = document.getElementById('stars');
  for (let i = 0; i < 25; i++) {
    const s = document.createElement('span');
    s.className = 'star';
    s.textContent = '✦';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';

/* =============== SVG Helpers =============== */
// 角度弧（標準數學角度系：0°=右、90°=上、180°=左、270°=下）
// SVG y 向下，自動翻轉處理
function svgArc(cx, cy, fromDeg, toDeg, r, color = '#FFC93C', sw = 2.8) {
  const PI = Math.PI;
  const sx = cx + r * Math.cos(fromDeg * PI / 180);
  const sy = cy - r * Math.sin(fromDeg * PI / 180);
  const ex = cx + r * Math.cos(toDeg * PI / 180);
  const ey = cy - r * Math.sin(toDeg * PI / 180);
  let delta = toDeg - fromDeg;
  while (delta > 180) delta -= 360;
  while (delta < -180) delta += 360;
  // SVG sweep=1 = 視覺順時針；數學 delta<0 (順時針) 對應 SVG y 翻轉後仍視覺順時針
  const sweep = delta < 0 ? 1 : 0;
  return `<path d="M ${sx.toFixed(2)} ${sy.toFixed(2)} A ${r} ${r} 0 0 ${sweep} ${ex.toFixed(2)} ${ey.toFixed(2)}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
}
// 角度數字標籤（自動放在弧中間外側，處理 wrap-around）
function svgAngleLabel(cx, cy, fromDeg, toDeg, r, text, color = '#FFC93C', size = 16) {
  const PI = Math.PI;
  let _from = fromDeg, _to = toDeg;
  while (_to - _from > 180) _to -= 360;
  while (_to - _from < -180) _to += 360;
  const midDeg = (_from + _to) / 2;
  const lr = r + 14;
  const lx = cx + lr * Math.cos(midDeg * PI / 180);
  const ly = cy - lr * Math.sin(midDeg * PI / 180);
  return `<text x="${lx.toFixed(1)}" y="${(ly + size/3).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="${size}" font-weight="800">${text}</text>`;
}
// 角度名稱標籤（∠1、∠2 等，放在更外側）
function svgAngleName(cx, cy, fromDeg, toDeg, r, text, color = '#FFD970', size = 18) {
  const PI = Math.PI;
  let _from = fromDeg, _to = toDeg;
  while (_to - _from > 180) _to -= 360;
  while (_to - _from < -180) _to += 360;
  const midDeg = (_from + _to) / 2;
  const lr = r + 32;
  const lx = cx + lr * Math.cos(midDeg * PI / 180);
  const ly = cy - lr * Math.sin(midDeg * PI / 180);
  return `<text x="${lx.toFixed(1)}" y="${(ly + size/3).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="${size}" font-weight="800">${text}</text>`;
}
// 整合標籤：把 "∠A" + "30°" 合併成單一文字 "∠A=30°"（避免兩個標籤擠在同方向）
function svgAngleFull(cx, cy, fromDeg, toDeg, r, name, value, color = '#FFD970', size = 17) {
  const PI = Math.PI;
  let _from = fromDeg, _to = toDeg;
  while (_to - _from > 180) _to -= 360;
  while (_to - _from < -180) _to += 360;
  const midDeg = (_from + _to) / 2;
  const lr = r + 22;
  const lx = cx + lr * Math.cos(midDeg * PI / 180);
  const ly = cy - lr * Math.sin(midDeg * PI / 180);
  const text = value ? `${name}=${value}` : name;
  return `<text x="${lx.toFixed(1)}" y="${(ly + size/3).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="${size}" font-weight="800">${text}</text>`;
}
// 點圓 + 標籤
function svgPoint(cx, cy, label, color = '#FFC93C', labelOffsetX = 0, labelOffsetY = -14, size = 16) {
  return `<circle cx="${cx}" cy="${cy}" r="7" fill="${color}" stroke="#0D0D14" stroke-width="2.5"/>` +
    (label ? `<text x="${cx + labelOffsetX}" y="${cy + labelOffsetY}" text-anchor="middle" fill="${color}" font-size="${size}" font-weight="800">${label}</text>` : '');
}

/* === 平行四邊形 SVG builder === */
function buildPlg(opts) {
  const Ax=130, Ay=240, Bx=430, By=240, Cx=540, Cy=100, Dx=240, Dy=100;
  const Ox = (Ax+Cx)/2, Oy = (Ay+Cy)/2;
  const H = (s) => (opts.highlight || []).includes(s);
  const HL_C = '#FF1744', NORM_C = '#0D0D14';
  const parts = [];
  parts.push(`<svg class="stage" viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg">`);

  const edges = [
    ['AB', Ax, Ay, Bx, By, opts.AB, 'mid-bottom'],
    ['BC', Bx, By, Cx, Cy, opts.BC, 'mid-right'],
    ['CD', Cx, Cy, Dx, Dy, opts.CD, 'mid-top'],
    ['DA', Dx, Dy, Ax, Ay, opts.DA, 'mid-left'],
  ];
  for (const [name, x1, y1, x2, y2, label, pos] of edges) {
    const isHL = H(name);
    const col = isHL ? '#FF8FA3' : 'var(--L1-color)';
    const w = isHL ? 5 : 4;
    parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`);
    if (label) {
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      const ox = pos === 'mid-right' ? 18 : pos === 'mid-left' ? -18 : 0;
      const oy = pos === 'mid-bottom' ? 22 : pos === 'mid-top' ? -10 : 4;
      parts.push(`<text x="${mx+ox}" y="${my+oy}" text-anchor="middle" fill="${isHL ? HL_C : NORM_C}" font-size="18" font-weight="800">${label}</text>`);
    }
  }

  if (opts.diagonals) {
    parts.push(`<line x1="${Ax}" y1="${Ay}" x2="${Cx}" y2="${Cy}" stroke="#0D0D14" stroke-width="2" stroke-dasharray="7 5" opacity="0.5"/>`);
    parts.push(`<line x1="${Bx}" y1="${By}" x2="${Dx}" y2="${Dy}" stroke="#0D0D14" stroke-width="2" stroke-dasharray="7 5" opacity="0.5"/>`);
  }
  // 對角線段標籤：分配到 4 個象限避免擠在 O 附近
  // AC 整段：標在 OC 段中點上方（右上區域，靠對角線 AC 方向）
  if (opts.AC) parts.push(`<text x="${(Ox+Cx)/2 + 8}" y="${(Oy+Cy)/2 - 8}" fill="${H('AC') ? HL_C : NORM_C}" font-size="15" font-weight="800">AC=${opts.AC}</text>`);
  // BD 整段：標在 OD 段中點上方（左上區域，靠對角線 BD 方向）
  if (opts.BD) parts.push(`<text x="${(Ox+Dx)/2 - 12}" y="${(Oy+Dy)/2 - 8}" text-anchor="end" fill="${H('BD') ? HL_C : NORM_C}" font-size="15" font-weight="800">BD=${opts.BD}</text>`);
  // AO 段：標在 A-O 線段中點下方（左下區域，靠 AC 對角線下半段）
  if (opts.AO) parts.push(`<text x="${(Ax+Ox)/2 - 8}" y="${(Ay+Oy)/2 + 22}" text-anchor="end" fill="${H('AO') ? HL_C : NORM_C}" font-size="15" font-weight="800">AO=${opts.AO}</text>`);
  // BO 段：標在 B-O 線段中點下方（右下區域，靠 BD 對角線下半段）
  if (opts.BO) parts.push(`<text x="${(Bx+Ox)/2 + 8}" y="${(By+Oy)/2 + 22}" fill="${H('BO') ? HL_C : NORM_C}" font-size="15" font-weight="800">BO=${opts.BO}</text>`);
  // OC 段：標在 O-C 線段中點上方（右上區域）
  if (opts.OC) parts.push(`<text x="${(Cx+Ox)/2 + 8}" y="${(Cy+Oy)/2 - 8}" fill="${H('OC') ? HL_C : NORM_C}" font-size="15" font-weight="800">OC=${opts.OC}</text>`);
  // OD 段：標在 O-D 線段中點上方（左上區域）
  if (opts.OD) parts.push(`<text x="${(Dx+Ox)/2 - 12}" y="${(Dy+Oy)/2 - 8}" text-anchor="end" fill="${H('OD') ? HL_C : NORM_C}" font-size="15" font-weight="800">OD=${opts.OD}</text>`);

  const angles = [
    ['angleA', Ax+18, Ay-12, opts.angleA, '∠A'],
    ['angleB', Bx-22, By-12, opts.angleB, '∠B'],
    ['angleC', Cx-22, Cy+22, opts.angleC, '∠C'],
    ['angleD', Dx+18, Dy+22, opts.angleD, '∠D'],
  ];
  for (const [name, x, y, val, label] of angles) {
    if (val !== undefined && val !== null) {
      const isHL = H(name);
      const col = isHL ? HL_C : NORM_C;
      const text = val ? `${label}=${val}` : label;
      parts.push(`<text x="${x}" y="${y}" fill="${col}" font-size="15" font-weight="800">${text}</text>`);
    }
  }

  for (const [name, x, y, off_x, off_y] of [
    ['A', Ax, Ay, -16, 6], ['B', Bx, By, 16, 6],
    ['C', Cx, Cy, 16, -6], ['D', Dx, Dy, -16, -6],
  ]) {
    parts.push(`<circle cx="${x}" cy="${y}" r="8" fill="#FFC93C" stroke="#0D0D14" stroke-width="3"/>`);
    parts.push(`<text x="${x+off_x}" y="${y+off_y}" text-anchor="middle" fill="#0D0D14" font-size="20" font-weight="800">${name}</text>`);
  }

  if (opts.O) {
    parts.push(`<circle cx="${Ox}" cy="${Oy}" r="6" fill="#FF1744" stroke="#0D0D14" stroke-width="3"/>`);
    parts.push(`<text x="${Ox+14}" y="${Oy+4}" fill="#FF1744" font-size="16" font-weight="800">O</text>`);
  }
  if (opts.title_extra) {
    parts.push(`<text x="330" y="40" text-anchor="middle" fill="#0066FF" font-size="18" font-weight="800">${opts.title_extra}</text>`);
  }
  parts.push(`</svg>`);
  return parts.join('\n');
}



/* === FINAL BOSS 專用 SVG（每個元素有 id，方便演示動畫操作） === */
function buildBossSvg() {
  const Ax=130, Ay=240, Bx=430, By=240, Cx=540, Cy=100, Dx=240, Dy=100;
  const Ox = (Ax+Cx)/2, Oy = (Ay+Cy)/2;
  const parts = [];
  parts.push(`<svg class="stage" viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg">`);
  // 對角線（先畫，讓邊蓋在上面）
  parts.push(`<line id="diag-AC" x1="${Ax}" y1="${Ay}" x2="${Cx}" y2="${Cy}" stroke="#0D0D14" stroke-width="2" stroke-dasharray="7 5" opacity="0.5"/>`);
  parts.push(`<line id="diag-BD" x1="${Bx}" y1="${By}" x2="${Dx}" y2="${Dy}" stroke="#0D0D14" stroke-width="2" stroke-dasharray="7 5" opacity="0.5"/>`);
  // 對角線「段」(隱形，演示時顯示)
  parts.push(`<line id="seg-AO" x1="${Ax}" y1="${Ay}" x2="${Ox}" y2="${Oy}" stroke="transparent" stroke-width="6"/>`);
  parts.push(`<line id="seg-OC" x1="${Ox}" y1="${Oy}" x2="${Cx}" y2="${Cy}" stroke="transparent" stroke-width="6"/>`);
  parts.push(`<line id="seg-BO" x1="${Bx}" y1="${By}" x2="${Ox}" y2="${Oy}" stroke="transparent" stroke-width="6"/>`);
  parts.push(`<line id="seg-OD" x1="${Ox}" y1="${Oy}" x2="${Dx}" y2="${Dy}" stroke="transparent" stroke-width="6"/>`);
  // 4 條邊（已知的 AB 用粉紅突出，其他用主色）
  parts.push(`<line id="edge-AB" x1="${Ax}" y1="${Ay}" x2="${Bx}" y2="${By}" stroke="#FF8FA3" stroke-width="5" stroke-linecap="round"/>`);
  parts.push(`<line id="edge-BC" x1="${Bx}" y1="${By}" x2="${Cx}" y2="${Cy}" stroke="var(--L1-color)" stroke-width="4" stroke-linecap="round"/>`);
  parts.push(`<line id="edge-CD" x1="${Cx}" y1="${Cy}" x2="${Dx}" y2="${Dy}" stroke="var(--L1-color)" stroke-width="4" stroke-linecap="round"/>`);
  parts.push(`<line id="edge-DA" x1="${Dx}" y1="${Dy}" x2="${Ax}" y2="${Ay}" stroke="var(--L1-color)" stroke-width="4" stroke-linecap="round"/>`);
  // 邊長標籤
  parts.push(`<text id="lbl-AB" x="${(Ax+Bx)/2}" y="${Ay+22}" text-anchor="middle" fill="#FF1744" font-size="18" font-weight="900">AB=9</text>`);
  parts.push(`<text id="lbl-CD" x="${(Cx+Dx)/2}" y="${Cy-10}" text-anchor="middle" fill="#0D0D14" font-size="18" font-weight="900">CD=?</text>`);
  // 對角線段標籤
  parts.push(`<text id="lbl-AO" x="${(Ax+Ox)/2 - 8}" y="${(Ay+Oy)/2 + 22}" text-anchor="end" fill="#FF1744" font-size="16" font-weight="900">AO=5</text>`);
  parts.push(`<text id="lbl-BO" x="${(Bx+Ox)/2 + 8}" y="${(By+Oy)/2 + 22}" fill="#FF1744" font-size="16" font-weight="900">BO=4</text>`);
  parts.push(`<text id="lbl-OC" x="${(Cx+Ox)/2 + 8}" y="${(Cy+Oy)/2 - 8}" fill="#0D0D14" font-size="16" font-weight="900">OC=?</text>`);
  parts.push(`<text id="lbl-OD" x="${(Dx+Ox)/2 - 12}" y="${(Dy+Oy)/2 - 8}" text-anchor="end" fill="#0D0D14" font-size="16" font-weight="900">OD=?</text>`);
  // 標題
  parts.push(`<text x="330" y="40" text-anchor="middle" fill="#0066FF" font-size="18" font-weight="900">求 CD + OC + OD</text>`);
  // 4 個頂點
  for (const [n, x, y, ox, oy] of [['A',Ax,Ay,-16,6],['B',Bx,By,16,6],['C',Cx,Cy,16,-6],['D',Dx,Dy,-16,-6]]) {
    parts.push(`<circle cx="${x}" cy="${y}" r="9" fill="#FFC93C" stroke="#0D0D14" stroke-width="3"/>`);
    parts.push(`<text x="${x+ox}" y="${y+oy}" text-anchor="middle" fill="#0D0D14" font-size="20" font-weight="900">${n}</text>`);
  }
  // O 點
  parts.push(`<circle cx="${Ox}" cy="${Oy}" r="7" fill="#FF1744" stroke="#0D0D14" stroke-width="3"/>`);
  parts.push(`<text x="${Ox+14}" y="${Oy+4}" fill="#FF1744" font-size="17" font-weight="900">O</text>`);
  parts.push(`</svg>`);
  return parts.join('\n');
}

/* === BOSS 演示動畫 handler === */
window.bossDemoStep = function(n) {
  window.bossDemoReset();
  const cap = document.getElementById('demo-caption');
  const get = (id) => document.getElementById(id);
  if (n === 1) {
    get('edge-AB')?.classList.add('demo-edge-on');
    get('edge-CD')?.classList.add('demo-edge-on');
    const lbl = get('lbl-CD');
    if (lbl) { lbl.textContent = 'CD=9'; lbl.classList.add('demo-label-pop'); }
    if (cap) cap.innerHTML = '🌸 對邊雙胞胎！AB = CD = <strong>9</strong>';
  } else if (n === 2) {
    get('diag-AC')?.classList.add('demo-diag-on');
    get('seg-AO')?.classList.add('demo-seg-on');
    get('seg-OC')?.classList.add('demo-seg-on');
    const lbl = get('lbl-OC');
    if (lbl) { lbl.textContent = 'OC=5'; lbl.classList.add('demo-label-pop'); }
    if (cap) cap.innerHTML = '⚡ 對角線互相平分！OC = AO = <strong>5</strong>';
  } else if (n === 3) {
    get('diag-BD')?.classList.add('demo-diag-on');
    get('seg-BO')?.classList.add('demo-seg-on');
    get('seg-OD')?.classList.add('demo-seg-on');
    const lbl = get('lbl-OD');
    if (lbl) { lbl.textContent = 'OD=4'; lbl.classList.add('demo-label-pop'); }
    if (cap) cap.innerHTML = '⚡ 對角線互相平分！OD = BO = <strong>4</strong>';
  } else if (n === 4) {
    ['edge-AB','edge-CD'].forEach(id => get(id)?.classList.add('demo-edge-on'));
    ['diag-AC','diag-BD'].forEach(id => get(id)?.classList.add('demo-diag-on'));
    ['seg-AO','seg-OC','seg-BO','seg-OD'].forEach(id => get(id)?.classList.add('demo-seg-on'));
    const vals = {CD:'9', OC:'5', OD:'4'};
    Object.entries(vals).forEach(([name, v]) => {
      const lbl = get('lbl-' + name);
      if (lbl) { lbl.textContent = name + '=' + v; lbl.classList.add('demo-label-pop'); }
    });
    if (cap) cap.innerHTML = '🎯 答案：CD + OC + OD = <strong>9 + 5 + 4 = 18</strong>';
  }
};

window.bossDemoReset = function() {
  document.querySelectorAll('.demo-edge-on,.demo-diag-on,.demo-seg-on,.demo-label-pop')
    .forEach(e => e.classList.remove('demo-edge-on','demo-diag-on','demo-seg-on','demo-label-pop'));
  ['CD','OC','OD'].forEach(name => {
    const lbl = document.getElementById('lbl-' + name);
    if (lbl) lbl.textContent = name + '=?';
  });
  const cap = document.getElementById('demo-caption');
  if (cap) cap.innerHTML = '👆 按上面 4 個按鈕看「逐步演示」';
};

/* =============== UI rendering =============== */
function showScreen(id) {
  document.querySelectorAll('section[id^="screen-"]').forEach(s => s.style.display = 'none');
  document.getElementById('screen-' + id).style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderProgress() {
  const c = document.getElementById('hud-progress');
  c.innerHTML = '';
  for (let i = 0; i < QUESTIONS.length; i++) {
    const d = document.createElement('div');
    d.className = 'pdot';
    if (i < state.currentQ) d.classList.add('done');
    else if (i === state.currentQ) d.classList.add('active');
    d.textContent = i + 1;
    c.appendChild(d);
  }
}

function renderQuest() {
  document.getElementById('hud-name').textContent = state.nick;
  document.getElementById('hud-coins').textContent = state.coins;
  renderProgress();

  const q = QUESTIONS[state.currentQ];
  const lvlClass = q.level === 1 ? 'lvl-base' : q.level === 2 ? 'lvl-mid' : 'lvl-boss';
  const lvlIcon = q.level === 1 ? '⭐' : q.level === 2 ? '🌙' : '☀️';

  const card = document.getElementById('quest-card');
  card.innerHTML = `
    <div style="text-align:center">
      <span class="lvl-badge ${lvlClass}">${lvlIcon} ${q.levelLabel}</span>
    </div>
    <div class="qtitle">${q.title}</div>
    <div class="qhint">${q.hint}</div>
    <div class="stage-wrap">${q.buildSvg()}</div>
    ${q.bossDemo ? `
      <div class="boss-demo-panel">
        <div class="boss-demo-title">🎬 看不懂沒關係！按下面按鈕看「逐步動畫演示」<br>（每個按鈕都可以重複按、有 🔄 重置）</div>
        <div class="boss-demo-btns">
          <button class="btn btn-warning" onclick="bossDemoStep(1)">📺 Step 1<br>對邊雙胞胎</button>
          <button class="btn btn-warning" onclick="bossDemoStep(2)">📺 Step 2<br>對角線(左)</button>
          <button class="btn btn-warning" onclick="bossDemoStep(3)">📺 Step 3<br>對角線(右)</button>
          <button class="btn btn-gold" onclick="bossDemoStep(4)">🎯 Step 4<br>看完整答案</button>
          <button class="btn btn-ghost" onclick="bossDemoReset()">🔄 重置</button>
        </div>
        <div id="demo-caption" class="demo-caption">👆 按上面 4 個按鈕看「逐步演示」</div>
      </div>
    ` : ''}
    <div class="opts" id="q-opts">
      ${q.options.map((o, i) => `<button class="opt" data-i="${i}">${o.text}</button>`).join('')}
    </div>
    <div class="fb" id="q-fb"></div>
    <div class="hints" id="q-hints">
      ${q.hints.map((h, i) => `<div class="hint"><strong>提示 ${i+1}：</strong> ${h}</div>`).join('')}
    </div>
    <div class="nav">
      <button class="btn btn-warning" id="hint-btn" onclick="toggleHints()">💡 看提示</button>
      <button class="btn btn-gold" id="next-btn" onclick="nextQuestion()" disabled>下一關 →</button>
    </div>
  `;

  // Attach option clicks
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => answerOption(parseInt(btn.dataset.i), btn));
  });

  state.hintsUsed[state.currentQ] = state.hintsUsed[state.currentQ] || 0;
}

function toggleHints() {
  const h = document.getElementById('q-hints');
  h.classList.toggle('show');
  state.hintsUsed[state.currentQ] = (state.hintsUsed[state.currentQ] || 0) + 1;
}

let answered = false;
function answerOption(idx, btnEl) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[state.currentQ];
  const opt = q.options[idx];
  const fb = document.getElementById('q-fb');
  const optsContainer = document.getElementById('q-opts');

  state.answers[state.currentQ] = {
    pickedIndex: idx,
    pickedText: opt.text,
    correct: opt.correct,
  };

  if (opt.correct) {
    btnEl.classList.add('correct');
    fb.className = 'fb win show';
    fb.innerHTML = q.explainCorrect;
    state.correct++;
    state.coins += (q.level === 3 ? 30 : q.level === 2 ? 20 : 10);
    popCoin(btnEl);
    playSound('correct');
  } else {
    btnEl.classList.add('wrong');
    // Highlight correct
    optsContainer.querySelectorAll('.opt').forEach((b, i) => {
      if (q.options[i].correct) b.classList.add('show-correct');
    });
    fb.className = 'fb gentle show';
    fb.innerHTML = q.explainWrong;
    playSound('wrong');
  }

  document.getElementById('next-btn').disabled = false;
  document.getElementById('hud-coins').textContent = state.coins;
}

function nextQuestion() {
  state.currentQ++;
  answered = false;
  if (state.currentQ >= QUESTIONS.length) {
    finishGame();
  } else {
    renderQuest();
  }
}

/* =============== Sound (8-bit) =============== */
let audioCtx;
function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if (type === 'correct') {
      o.type = 'square';
      o.frequency.setValueAtTime(523, audioCtx.currentTime); // C5
      o.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1); // E5
      o.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2); // G5
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      o.start(); o.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'wrong') {
      o.type = 'triangle';
      o.frequency.setValueAtTime(220, audioCtx.currentTime);
      o.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.3);
      g.gain.setValueAtTime(0.1, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      o.start(); o.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'victory') {
      [523, 659, 784, 1047].forEach((f, i) => {
        const oo = audioCtx.createOscillator();
        const gg = audioCtx.createGain();
        oo.connect(gg); gg.connect(audioCtx.destination);
        oo.type = 'square';
        oo.frequency.value = f;
        gg.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.15);
        gg.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.3);
        oo.start(audioCtx.currentTime + i * 0.15);
        oo.stop(audioCtx.currentTime + i * 0.15 + 0.3);
      });
    }
  } catch (e) {}
}

function popCoin(refEl) {
  const r = refEl.getBoundingClientRect();
  const coin = document.createElement('div');
  coin.className = 'coin-pop';
  coin.textContent = '💰';
  coin.style.left = (r.left + r.width / 2 - 16) + 'px';
  coin.style.top = (r.top - 10) + 'px';
  document.body.appendChild(coin);
  setTimeout(() => coin.remove(), 1100);
}

/* =============== Finish + Submit =============== */
function finishGame() {
  const elapsed = Math.round((Date.now() - state.startTime) / 1000);
  document.getElementById('vic-name').textContent = state.nick;
  document.getElementById('vic-correct').textContent = state.correct;
  document.getElementById('vic-coins').textContent = state.coins;
  const m = Math.floor(elapsed / 60), s = elapsed % 60;
  document.getElementById('vic-time').textContent = m + ':' + (s < 10 ? '0' : '') + s;
  showScreen('victory');
  playSound('victory');

  submitToServer(elapsed);
}

async function submitToServer(elapsed) {
  const status = document.getElementById('vic-status');
  const payload = {
    nick: state.nick,
    hwId: HOMEWORK_ID,
    correctCount: state.correct,
    totalQuestions: QUESTIONS.length,
    coins: state.coins,
    elapsedSec: elapsed,
    submittedAt: new Date().toISOString(),
    answers: state.answers.map((a, i) => ({
      q: i + 1,
      level: QUESTIONS[i].levelLabel,
      pickedText: a ? a.pickedText : null,
      correct: a ? a.correct : false,
      hintsUsed: state.hintsUsed[i] || 0,
    })),
  };

  // Firebase Realtime Database POST — 永久儲存
  for (let attempt = 0; attempt < 5; attempt++) {
    try {
      const res = await fetch(FIREBASE_NODE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error('POST ' + res.status);

      status.className = 'submit-status success';
      status.innerHTML = '✅ 成績已送達老師後台！';
      return;
    } catch (err) {
      if (attempt === 4) {
        status.className = 'submit-status error';
        status.innerHTML = '⚠️ 送出失敗，請告訴老師你的暱稱和成績：<br><strong>' + state.nick + ' — ' + state.correct + '/' + QUESTIONS.length + ' 分</strong>';
        return;
      }
      await new Promise(r => setTimeout(r, 500 + Math.random() * 800));
    }
  }
}

/* =============== Restart =============== */
function restartGame() {
  state.nick = '';
  state.startTime = 0;
  state.currentQ = 0;
  state.coins = 0;
  state.correct = 0;
  state.answers = [];
  state.hintsUsed = [];
  answered = false;
  document.getElementById('nick-input').value = '';
  showScreen('start');
}

/* =============== Start =============== */
document.getElementById('start-btn').addEventListener('click', () => {
  const input = document.getElementById('nick-input');
  const nick = input.value.trim();
  if (!nick) {
    input.focus();
    input.style.borderColor = 'var(--danger)';
    setTimeout(() => input.style.borderColor = '', 1500);
    return;
  }
  state.nick = nick;
  state.startTime = Date.now();
  state.currentQ = 0;
  state.coins = 0;
  state.correct = 0;
  state.answers = [];
  showScreen('quest');
  renderQuest();
});

// Enter key in nick input
document.getElementById('nick-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('start-btn').click();
});

// Expose for inline onclick
window.toggleHints = toggleHints;
window.nextQuestion = nextQuestion;
window.restartGame = restartGame;
</script>
